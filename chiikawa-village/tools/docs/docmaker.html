<title>領収書・請求書メーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap">
<style>
/* 左に入力、右にA4の見本。領収書と請求書は同じ発行者情報と連番を共有する。 */
:root{--bg:#f2f5f2;--panel:#ffffff;--ink:#1c2a23;--sub:#5b6a62;--line:#d3dbd5;--accent:#2d6a4f;--accent-ink:#ffffff;--warn:#a96a12;--bad:#b3362c;--field:#fbfcfb;
  --paper:#ffffff;--pink:#1a1a1a;--psub:#555555;--pline:#9aa39d;
  --sans:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;--serif:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111714;--panel:#18211c;--ink:#e5ece7;--sub:#9aa9a0;--line:#2b3730;--accent:#6fbf94;--accent-ink:#0d1a13;--warn:#e0a24e;--bad:#ee7d72;--field:#131b17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111714;--panel:#18211c;--ink:#e5ece7;--sub:#9aa9a0;--line:#2b3730;--accent:#6fbf94;--accent-ink:#0d1a13;--warn:#e0a24e;--bad:#ee7d72;--field:#131b17;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:12px}
h1{font-family:var(--serif);font-size:20px;margin:0;letter-spacing:.04em}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:inherit;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 14px;border-radius:8px;cursor:pointer;min-height:36px}
nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.hint{font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel h2{font-size:14px;margin:0 0 10px;letter-spacing:.04em}
.f{display:grid;gap:4px;margin-bottom:10px;min-width:0}
.f label,.f .l{font-size:12px;color:var(--sub)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;min-height:36px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.row3{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px}
.btn{font:inherit;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;min-height:38px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{min-height:30px;padding:2px 10px;font-size:12.5px}
.btn.del{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.msg{font-size:12.5px;min-height:20px;margin-top:6px;color:var(--sub)}
.msg.ok{color:var(--accent)}.msg.ng{color:var(--bad)}
.warn{font-size:12.5px;color:var(--warn);border:1.5px solid var(--warn);border-radius:8px;padding:5px 9px;margin-bottom:10px}
table.ln{width:100%;border-collapse:collapse;font-size:12.5px}
.lnw{overflow-x:auto}
table.ln th{font-weight:500;color:var(--sub);text-align:left;padding:2px 4px;white-space:nowrap}
table.ln td{padding:2px 3px;vertical-align:top}
table.ln input{min-height:32px;padding:3px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;background:var(--field);cursor:pointer;color:var(--ink);font-family:inherit}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.stagebox{overflow:hidden;border:1.5px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--ink) 8%,var(--bg));padding:12px;min-width:0}
.stagebox .sc{transform-origin:0 0}
.hist{width:100%;border-collapse:collapse;font-size:13px}
.hist th{text-align:left;color:var(--sub);font-weight:500;padding:4px 6px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.hist td{padding:6px;border-bottom:1px dashed var(--line);vertical-align:middle}
.hist .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--sub);padding:18px 4px}
/* A4 の紙面。ダークでも白地・黒字のまま（印刷物の見た目）。 */
.paper{width:794px;min-height:1123px;background:var(--paper);color:var(--pink);font-family:var(--sans);font-size:13px;line-height:1.6;padding:56px 60px;position:relative}
.paper h3{font-family:var(--serif);font-weight:700;font-size:30px;letter-spacing:.7em;text-align:center;margin:0 0 26px;padding-left:.7em}
.paper .meta{display:flex;justify-content:flex-end;gap:22px;font-size:12px;color:var(--psub);margin-bottom:6px}
.paper .to{display:flex;align-items:baseline;gap:10px;border-bottom:1.5px solid var(--pink);padding-bottom:4px;width:62%;font-size:20px;font-family:var(--serif)}
.paper .to small{font-size:15px}
.paper .amt{margin:22px 0 14px;border:2px solid var(--pink);display:flex;align-items:baseline;justify-content:space-between;padding:10px 18px}
.paper .amt span{font-size:13px;letter-spacing:.2em}
.paper .amt b{font-family:var(--serif);font-size:32px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.paper .amt i{font-style:normal;font-size:12px;color:var(--psub)}
.paper .row2{display:flex;gap:24px;align-items:flex-start;justify-content:space-between}
.paper .iss{font-size:12.5px;line-height:1.7;text-align:left;min-width:250px}
.paper .iss b{font-size:15px;display:block;font-family:var(--serif)}
.paper table{width:100%;border-collapse:collapse;margin-top:18px;font-size:12.5px}
.paper th{background:#eef0ee;border:1px solid var(--pline);padding:5px 8px;font-weight:500;text-align:center}
.paper td{border:1px solid var(--pline);padding:6px 8px;font-variant-numeric:tabular-nums}
.paper td.r{text-align:right}.paper td.c{text-align:center}
.paper .tot{margin-left:auto;margin-top:12px;width:300px;font-size:13px}
.paper .tot div{display:flex;justify-content:space-between;padding:3px 8px;border-bottom:1px solid var(--pline);font-variant-numeric:tabular-nums}
.paper .tot .g{font-weight:700;font-size:15px;border-bottom:2px solid var(--pink)}
.paper .note{margin-top:20px;font-size:12px;white-space:pre-wrap;border-top:1px solid var(--pline);padding-top:8px}
.paper .stamp{position:absolute;right:60px;bottom:60px;width:130px;height:130px;border:1.5px dashed var(--pline);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--psub);text-align:center}
.paper .bank{margin-top:14px;font-size:12.5px;white-space:pre-wrap;border:1px solid var(--pline);padding:8px 12px}
.paper .for{margin:6px 0 4px;font-size:15px}
.paper .tag{display:inline-block;border:1px solid var(--pink);padding:0 8px;font-size:11px;margin-right:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
<header>
  <h1>領収書・請求書メーカー</h1>
  <nav aria-label="画面">
    <button type="button" data-tab="receipt" aria-pressed="true">領収書</button>
    <button type="button" data-tab="invoice" aria-pressed="false">請求書</button>
    <button type="button" data-tab="history" aria-pressed="false">履歴</button>
    <button type="button" data-tab="settings" aria-pressed="false">設定</button>
  </nav>
  <span class="hint" id="who"></span>
</header>

<section id="v-receipt" class="grid">
  <div class="panel">
    <h2>領収書の内容</h2>
    <div class="row3 f"><div class="f" style="margin:0"><label for="r_to">宛名</label><input id="r_to" placeholder="例：山田 花子"></div>
      <div class="f" style="margin:0"><label for="r_hon">敬称</label><select id="r_hon"><option>様</option><option>御中</option><option value="">なし</option></select></div></div>
    <div class="row"><div class="f"><label for="r_amount">金額（税込・円）</label><input id="r_amount" inputmode="numeric" placeholder="17600"></div>
      <div class="f"><label for="r_rate">消費税</label><select id="r_rate"><option value="10">10%</option><option value="8">8%（軽減）</option><option value="0">非課税</option></select></div></div>
    <div class="f"><label for="r_for">但し書き</label><input id="r_for" value="土壌分析の追加費用として"></div>
    <div class="row"><div class="f"><label for="r_date">領収日（入金日）</label><input id="r_date" type="date"></div>
      <div class="f"><label for="r_pay">支払方法</label><select id="r_pay"><option>銀行振込</option><option>現金</option><option>クレジットカード</option><option value="">表示しない</option></select></div></div>
    <div class="f"><label for="r_note">備考（任意）</label><textarea id="r_note" rows="2"></textarea></div>
    <div id="r_warn"></div>
    <div class="acts"><button type="button" class="btn pri" id="r_pdf">PDFで保存</button><button type="button" class="btn" id="r_save">履歴に保存</button><button type="button" class="btn" id="r_new">新しく作る</button></div>
    <div class="msg" id="r_msg" aria-live="polite"></div>
    <hr style="border:0;border-top:1.5px solid var(--line);margin:14px 0">
    <h2>まとめて作る</h2>
    <div class="f"><label for="b_txt">1行に「宛名,金額,領収日（任意・10/19の形）」を1行ずつ</label><textarea id="b_txt" rows="4" placeholder="山田 花子,17600,10/19&#10;佐藤 太郎,8800"></textarea></div>
    <div class="acts"><button type="button" class="btn" id="b_make">一覧にする</button><button type="button" class="btn pri" id="b_all" disabled>全員ぶんをPDFで保存</button></div>
    <div class="chips" id="b_list"></div>
    <div class="msg" id="b_msg" aria-live="polite"></div>
  </div>
  <div><div class="stagebox" id="r_stage"><div class="sc" id="r_sc"></div></div></div>
</section>

<section id="v-invoice" class="grid" hidden>
  <div class="panel">
    <h2>請求書の内容</h2>
    <div class="row3 f"><div class="f" style="margin:0"><label for="i_to">宛名</label><input id="i_to" placeholder="例：株式会社○○"></div>
      <div class="f" style="margin:0"><label for="i_hon">敬称</label><select id="i_hon"><option>御中</option><option>様</option><option value="">なし</option></select></div></div>
    <div class="f"><label for="i_subject">件名（任意）</label><input id="i_subject" placeholder="例：10月分原稿料"></div>
    <div class="row"><div class="f"><label for="i_date">請求日</label><input id="i_date" type="date"></div>
      <div class="f"><label for="i_due">支払期限</label><input id="i_due" type="date"></div></div>
    <div class="f"><span class="l">明細（金額は税抜）</span>
      <div class="lnw"><table class="ln"><thead><tr><th>品名</th><th>数量</th><th>単位</th><th>単価</th><th></th></tr></thead><tbody id="i_lines"></tbody></table></div>
      <div class="acts"><button type="button" class="btn sm" id="i_add">＋ 明細を足す</button></div></div>
    <div class="f"><label for="i_msg2">あいさつ文</label><input id="i_msg2"></div>
    <div class="f"><label for="i_note">備考</label><textarea id="i_note" rows="2"></textarea></div>
    <div class="acts"><button type="button" class="btn pri" id="i_pdf">PDFで保存</button><button type="button" class="btn" id="i_save">履歴に保存</button><button type="button" class="btn" id="i_new">新しく作る</button></div>
    <div class="msg" id="i_msg" aria-live="polite"></div>
  </div>
  <div><div class="stagebox" id="i_stage"><div class="sc" id="i_sc"></div></div></div>
</section>

<section id="v-history" hidden>
  <div class="panel"><h2>発行した書類</h2><div class="lnw" id="h_box"></div><div class="msg" id="h_msg" aria-live="polite"></div></div>
</section>

<section id="v-settings" hidden>
  <div class="panel" style="max-width:640px">
    <h2>発行者の情報（領収書・請求書の右側に載ります）</h2>
    <div class="row"><div class="f"><label for="s_name">屋号・会社名</label><input id="s_name"></div><div class="f"><label for="s_person">代表者名</label><input id="s_person"></div></div>
    <div class="row"><div class="f"><label for="s_zip">郵便番号</label><input id="s_zip"></div><div class="f"><label for="s_reg">インボイス登録番号（なければ空）</label><input id="s_reg" placeholder="T1234567890123"></div></div>
    <div class="f"><label for="s_addr">住所</label><input id="s_addr"></div>
    <div class="f"><label for="s_bank">振込先（請求書に載ります）</label><textarea id="s_bank" rows="2"></textarea></div>
    <div class="f"><label for="s_invnote">請求書の備考のひな形</label><input id="s_invnote"></div>
    <div class="f"><label for="s_invmsg">請求書のあいさつ文</label><input id="s_invmsg"></div>
    <div class="row"><div class="f"><label for="s_ninv">次の請求書番号（数字）</label><input id="s_ninv" inputmode="numeric"></div><div class="f"><label for="s_nrec">次の領収書番号（数字）</label><input id="s_nrec" inputmode="numeric"></div></div>
    <div class="f"><label for="s_stamp">角印の欄</label><select id="s_stamp"><option value="0">付けない</option><option value="1">付ける（印刷後に押印）</option></select></div>
    <div class="acts"><button type="button" class="btn pri" id="s_save">設定を保存</button></div>
    <div class="msg" id="s_msg" aria-live="polite"></div>
    <p class="hint">この情報と発行した書類は、あなただけが見られる場所に保存されます。</p>
  </div>
</section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');
const num=v=>{const n=parseInt(String(v||'').replace(/[^\d-]/g,''),10);return isNaN(n)?0:n};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const jdate=s=>{if(!s)return '';const [y,m,d]=s.split('-');return y+'年'+(+m)+'月'+(+d)+'日'};
const pad=(n,w)=>String(n).padStart(w,'0');
let db=null,downloads=null,uid=null;
let S={name:'',person:'',zip:'',addr:'',reg:'',bank:'',invnote:'本PDFを原本とします',invmsg:'下記の通りご請求申し上げます。',ninv:1,nrec:1,stamp:'0'};
let HIST=[],BATCH=[],curBatch=-1,tab='receipt';
let R={id:null,no:''},I={id:null,no:'',lines:[{d:'',q:1,u:'式',p:''}]};

// ---------- 紙面 ----------
function issuer(){const z=S.zip?('〒'+S.zip+'\n'):'';return `<div class="iss"><b>${esc(S.name||'（設定で発行者を入力）')}</b>${esc(z+(S.addr||'')).replace(/\n/g,'<br>')}${S.person?'<br>'+esc(S.person):''}${S.reg?'<br>登録番号 '+esc(S.reg):''}</div>`}
function taxIn(total,rate){return rate>0?Math.floor(total*rate/(100+rate)):0}
function receiptHTML(d){const total=num(d.amount),rate=+d.rate||0,tax=taxIn(total,rate),to=d.to?esc(d.to):'　　　　　　';
  const stamp=total>=50000?'<div class="stamp" style="right:auto;left:60px">収入印紙<br>（5万円以上）</div>':(S.stamp==='1'?'<div class="stamp">印</div>':'');
  return `<div class="paper" data-kind="receipt"><div class="meta"><span>No. ${esc(d.no||'（保存時に採番）')}</span><span>${esc(jdate(d.date))}</span></div>
  <h3>領収書</h3>
  <div class="to"><span>${to}</span><small>${esc(d.hon||'')}</small></div>
  <div class="amt"><span>金　額</span><b>${yen(total)}　-</b><i>（税込）</i></div>
  <div class="for">但し　${esc(d.forText||'')}</div>
  <div class="for" style="font-size:13px">上記、正に領収いたしました。${d.pay?'（'+esc(d.pay)+'）':''}</div>
  <div class="row2" style="margin-top:26px"><div style="font-size:12.5px;line-height:1.8">${rate>0?`<div>内訳　税抜金額　${yen(total-tax)}</div><div>　　　消費税（${rate}%）　${yen(tax)}</div>`:'<div>内訳　非課税</div>'}${d.note?`<div class="note" style="margin-top:12px;border:0;padding:0">${esc(d.note)}</div>`:''}</div>${issuer()}</div>${stamp}</div>`}
function invCalc(d){let sub=0;(d.lines||[]).forEach(l=>{sub+=Math.round((+l.q||0)*(num(l.p)))});const tax=Math.floor(sub*0.1);return {sub,tax,total:sub+tax}}
function invoiceHTML(d){const c=invCalc(d),rows=(d.lines||[]).filter(l=>l.d||num(l.p)).map(l=>`<tr><td>${esc(l.d)}</td><td class="r">${esc(l.q)}</td><td class="c">${esc(l.u||'')}</td><td class="r">${yen(num(l.p))}</td><td class="r">${yen(Math.round((+l.q||0)*num(l.p)))}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:#888">明細がありません</td></tr>';
  return `<div class="paper" data-kind="invoice"><div class="meta"><span>請求書番号 ${esc(d.no||'（保存時に採番）')}</span><span>請求日 ${esc(jdate(d.date))}</span></div>
  <h3>請求書</h3>
  <div class="row2"><div style="flex:1;min-width:0"><div class="to" style="width:100%"><span>${esc(d.to||'　　　　　　')}</span><small>${esc(d.hon||'')}</small></div>
    ${d.subject?`<div style="margin-top:8px;font-size:13px">件名：${esc(d.subject)}</div>`:''}<div style="margin-top:10px;font-size:12.5px">${esc(d.msg||'')}</div></div>${issuer()}</div>
  <div class="amt" style="width:62%"><span>ご請求金額</span><b>${yen(c.total)}</b><i>（税込）</i></div>
  ${d.due?`<div style="font-size:13px;margin-bottom:6px">お支払期限　${esc(jdate(d.due))}</div>`:''}
  <table><thead><tr><th style="width:44%">品名</th><th>数量</th><th>単位</th><th>単価</th><th>金額（税抜）</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="tot"><div><span>小計</span><span>${yen(c.sub)}</span></div><div><span>消費税（10%）</span><span>${yen(c.tax)}</span></div><div class="g"><span>合計</span><span>${yen(c.total)}</span></div></div>
  ${S.bank?`<div class="bank"><b>お振込先</b>\n${esc(S.bank)}</div>`:''}
  ${d.note?`<div class="note">${esc(d.note)}</div>`:''}</div>`}

function fit(boxId,scId,html){const box=$(boxId),sc=$(scId);sc.innerHTML=html;const w=box.clientWidth-24||760,k=Math.min(1,w/794);sc.style.transform='scale('+k+')';const p=sc.firstElementChild;sc.style.width='794px';box.style.height=(p?p.offsetHeight*k+24:300)+'px'}

// ---------- フォーム → 書類 ----------
const rDoc=()=>({kind:'receipt',no:R.no,to:$('r_to').value.trim(),hon:$('r_hon').value,amount:num($('r_amount').value),rate:$('r_rate').value,forText:$('r_for').value.trim(),date:$('r_date').value,pay:$('r_pay').value,note:$('r_note').value.trim()});
const iDoc=()=>({kind:'invoice',no:I.no,to:$('i_to').value.trim(),hon:$('i_hon').value,subject:$('i_subject').value.trim(),date:$('i_date').value,due:$('i_due').value,lines:I.lines,msg:$('i_msg2').value.trim(),note:$('i_note').value.trim()});
function renderR(){const d=rDoc();fit('r_stage','r_sc',receiptHTML(d));$('r_warn').innerHTML=num(d.amount)>=50000?'<div class="warn">5万円以上の領収書には収入印紙が必要です。紙に印刷して貼ってください。</div>':''}
function renderI(){fit('i_stage','i_sc',invoiceHTML(iDoc()))}
function renderLines(){$('i_lines').innerHTML=I.lines.map((l,i)=>`<tr><td style="min-width:130px"><input data-k="d" data-i="${i}" value="${esc(l.d)}" aria-label="品名"></td><td style="width:54px"><input data-k="q" data-i="${i}" value="${esc(l.q)}" inputmode="decimal" aria-label="数量"></td><td style="width:50px"><input data-k="u" data-i="${i}" value="${esc(l.u)}" aria-label="単位"></td><td style="width:92px"><input data-k="p" data-i="${i}" value="${esc(l.p)}" inputmode="numeric" aria-label="単価"></td><td><button type="button" class="btn sm del" data-del="${i}" aria-label="この明細を消す">×</button></td></tr>`).join('')}

// ---------- 保存・PDF ----------
async function saveDoc(d,state){if(!db||!uid){return null}
  const col=db.collection('data/users/'+uid+'/docs/items');let id=state.id,no=d.no||state.no;
  if(!no){if(d.kind==='receipt'){no='R-'+pad(S.nrec,4);S.nrec=num(S.nrec)+1}else{no='INV-'+pad(S.ninv,10);S.ninv=num(S.ninv)+1}await db.doc('data/users/'+uid+'/settings').set(Object.assign({},S))}
  const rec=Object.assign({},d,{no,createdAt:state.createdAt||Date.now(),updatedAt:Date.now()});
  if(rec.kind==='receipt'){rec.total=num(rec.amount)}else{rec.total=invCalc(rec).total}
  if(id){await col.doc(id).set(rec)}else{const r=await col.add(rec);id=r.id}
  state.id=id;state.no=no;state.createdAt=rec.createdAt;return rec}
async function makePdf(html,name){
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0;width:794px';host.innerHTML=html;document.body.appendChild(host);
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const cv=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'p'});const W=210,H=cv.height/cv.width*W;
    pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,W,Math.min(H,297));
    const blob=pdf.output('blob');
    if(!downloads)throw {code:'unavailable'};
    await downloads.save({filename:name,data:blob});return true}
  finally{host.remove()}}
const safe=s=>String(s||'').replace(/[\\/:*?"<>|\s]+/g,'_');
async function doPdf(kind,msgId){const m=$(msgId);m.className='msg';m.textContent='作っています…';
  try{const d=kind==='receipt'?rDoc():iDoc(),st=kind==='receipt'?R:I;
    if(kind==='receipt'&&!d.amount){m.className='msg ng';m.textContent='金額を入れてください';return}
    if(!db){m.className='msg ng';m.textContent='保存先が使えません（番号を付けられないため中止しました）';return}
    const rec=await saveDoc(d,st);d.no=st.no;
    if(kind==='receipt')renderR();else renderI();
    const html=kind==='receipt'?receiptHTML(d):invoiceHTML(d);
    await makePdf(html,(kind==='receipt'?'領収書_':'請求書_')+safe(d.to||'宛名なし')+'_'+d.date.replace(/-/g,'')+'_'+st.no+'.pdf');
    m.className='msg ok';m.textContent='保存しました（'+st.no+'）。履歴にも入りました'}
  catch(e){m.className='msg ng';m.textContent=e&&e.code==='declined'?'保存をやめました':'PDFを保存できませんでした：'+(e&&(e.message||e.code)||'不明なエラー')}}

// ---------- まとめて ----------
function parseBatch(){return $('b_txt').value.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/[,\t，、]/);let dt='';const m=(p[2]||'').trim().match(/^(?:(\d{4})[-\/])?(\d{1,2})[-\/](\d{1,2})$/);if(m)dt=(m[1]||new Date().getFullYear())+'-'+pad(m[2],2)+'-'+pad(m[3],2);return {to:(p[0]||'').trim(),amount:num(p[1]),date:dt}}).filter(x=>x.to&&x.amount>0)}
function renderBatch(){$('b_list').innerHTML=BATCH.map((b,i)=>`<button type="button" class="chip" data-b="${i}" aria-pressed="${i===curBatch}">${esc(b.to)}　${yen(b.amount)}${b.date?'　'+esc(b.date.slice(5).replace('-','/')):''}${b.done?' ✓':''}</button>`).join('');$('b_all').disabled=!BATCH.length}
async function batchAll(){const m=$('b_msg');if(!db){m.className='msg ng';m.textContent='保存先が使えません';return}
  let n=0;for(let i=0;i<BATCH.length;i++){const b=BATCH[i];if(b.done)continue;
    $('r_to').value=b.to;$('r_amount').value=b.amount;if(b.date)$('r_date').value=b.date;curBatch=i;R={id:null,no:''};renderR();renderBatch();m.className='msg';m.textContent=(i+1)+' / '+BATCH.length+' 枚めを作っています…';
    try{const d=rDoc();await saveDoc(d,R);d.no=R.no;fit('r_stage','r_sc',receiptHTML(d));await makePdf(receiptHTML(d),'領収書_'+safe(d.to)+'_'+d.date.replace(/-/g,'')+'_'+R.no+'.pdf');b.done=true;n++}
    catch(e){m.className='msg ng';m.textContent=(e&&e.code==='declined'?'保存をやめました':'途中で止まりました：'+(e&&(e.message||e.code)||''))+'（'+n+'枚保存ずみ）';renderBatch();return}}
  m.className='msg ok';m.textContent=n+'枚を保存しました。履歴にも入っています';renderBatch()}

// ---------- 履歴 ----------
function renderHist(){const box=$('h_box');if(!HIST.length){box.innerHTML='<div class="empty">まだ発行した書類はありません。PDFで保存すると、ここに並びます。</div>';return}
  box.innerHTML=`<table class="hist"><thead><tr><th>番号</th><th>種類</th><th>宛名</th><th class="num">金額</th><th>日付</th><th></th></tr></thead><tbody>${HIST.map(h=>`<tr><td>${esc(h.no)}</td><td>${h.kind==='receipt'?'領収書':'請求書'}</td><td>${esc(h.to)} ${esc(h.hon||'')}</td><td class="num">${yen(h.total)}</td><td>${esc(jdate(h.date))}</td><td style="white-space:nowrap"><button type="button" class="btn sm" data-open="${esc(h.id)}">開く</button> <button type="button" class="btn sm del" data-rm="${esc(h.id)}">消す</button></td></tr>`).join('')}</tbody></table>`}
function openDoc(h){if(h.kind==='receipt'){R={id:h.id,no:h.no,createdAt:h.createdAt};$('r_to').value=h.to||'';$('r_hon').value=h.hon||'';$('r_amount').value=h.amount;$('r_rate').value=String(h.rate||'10');$('r_for').value=h.forText||'';$('r_date').value=h.date||today();$('r_pay').value=h.pay||'';$('r_note').value=h.note||'';setTab('receipt');renderR()}
  else{I={id:h.id,no:h.no,createdAt:h.createdAt,lines:(h.lines||[]).map(l=>Object.assign({},l))};$('i_to').value=h.to||'';$('i_hon').value=h.hon||'';$('i_subject').value=h.subject||'';$('i_date').value=h.date||today();$('i_due').value=h.due||'';$('i_msg2').value=h.msg||S.invmsg;$('i_note').value=h.note||'';setTab('invoice');renderLines();renderI()}}
let rmArm=null;

// ---------- 設定 ----------
function fillSettings(){$('s_name').value=S.name||'';$('s_person').value=S.person||'';$('s_zip').value=S.zip||'';$('s_reg').value=S.reg||'';$('s_addr').value=S.addr||'';$('s_bank').value=S.bank||'';$('s_invnote').value=S.invnote||'';$('s_invmsg').value=S.invmsg||'';$('s_ninv').value=S.ninv;$('s_nrec').value=S.nrec;$('s_stamp').value=S.stamp||'0'}
async function saveSettings(){const m=$('s_msg');S={name:$('s_name').value.trim(),person:$('s_person').value.trim(),zip:$('s_zip').value.trim(),reg:$('s_reg').value.trim(),addr:$('s_addr').value.trim(),bank:$('s_bank').value.trim(),invnote:$('s_invnote').value.trim(),invmsg:$('s_invmsg').value.trim(),ninv:num($('s_ninv').value)||1,nrec:num($('s_nrec').value)||1,stamp:$('s_stamp').value};
  try{if(!db||!uid)throw {message:'保存先が使えません'};await db.doc('data/users/'+uid+'/settings').set(Object.assign({},S));m.className='msg ok';m.textContent='保存しました'}catch(e){m.className='msg ng';m.textContent='保存できませんでした：'+(e&&e.message||'')}
  renderR();renderI()}

// ---------- タブ ----------
function setTab(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===t)));['receipt','invoice','history','settings'].forEach(k=>$('v-'+k).hidden=k!==t);if(t==='receipt')renderR();if(t==='invoice')renderI();if(t==='history')renderHist()}

function newReceipt(){R={id:null,no:''};$('r_to').value='';$('r_amount').value='';$('r_note').value='';$('r_date').value=today();$('r_msg').textContent='';renderR()}
function newInvoice(){I={id:null,no:'',lines:[{d:'',q:1,u:'式',p:''}]};$('i_to').value='';$('i_subject').value='';$('i_date').value=today();const d=new Date();d.setMonth(d.getMonth()+1);$('i_due').value=d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);$('i_msg2').value=S.invmsg;$('i_note').value=S.invnote;$('i_msg').textContent='';renderLines();renderI()}

function wire(){
  document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
  ['r_to','r_hon','r_amount','r_rate','r_for','r_date','r_pay','r_note'].forEach(id=>$(id).addEventListener('input',()=>{R.no=R.id?R.no:'';renderR()}));
  ['i_to','i_hon','i_subject','i_date','i_due','i_msg2','i_note'].forEach(id=>$(id).addEventListener('input',renderI));
  $('i_lines').addEventListener('input',e=>{const k=e.target.dataset.k,i=e.target.dataset.i;if(k==null)return;I.lines[i][k]=e.target.value;renderI()});
  $('i_lines').addEventListener('click',e=>{const x=e.target.closest('[data-del]');if(!x)return;I.lines.splice(+x.dataset.del,1);if(!I.lines.length)I.lines.push({d:'',q:1,u:'式',p:''});renderLines();renderI()});
  $('i_add').addEventListener('click',()=>{I.lines.push({d:'',q:1,u:'式',p:''});renderLines();renderI()});
  $('r_pdf').addEventListener('click',()=>doPdf('receipt','r_msg'));$('i_pdf').addEventListener('click',()=>doPdf('invoice','i_msg'));
  $('r_save').addEventListener('click',async()=>{const m=$('r_msg');try{if(!db)throw {message:'保存先が使えません'};const d=rDoc();if(!d.amount){m.className='msg ng';m.textContent='金額を入れてください';return}await saveDoc(d,R);renderR();m.className='msg ok';m.textContent='履歴に保存しました（'+R.no+'）'}catch(e){m.className='msg ng';m.textContent='保存できませんでした：'+(e&&e.message||'')}});
  $('i_save').addEventListener('click',async()=>{const m=$('i_msg');try{if(!db)throw {message:'保存先が使えません'};await saveDoc(iDoc(),I);renderI();m.className='msg ok';m.textContent='履歴に保存しました（'+I.no+'）'}catch(e){m.className='msg ng';m.textContent='保存できませんでした：'+(e&&e.message||'')}});
  $('r_new').addEventListener('click',newReceipt);$('i_new').addEventListener('click',newInvoice);
  $('b_make').addEventListener('click',()=>{BATCH=parseBatch();curBatch=-1;renderBatch();$('b_msg').className='msg';$('b_msg').textContent=BATCH.length?BATCH.length+'人ぶん。名前を押すと見本が変わります':'「宛名,金額」の形で入れてください'});
  $('b_list').addEventListener('click',e=>{const x=e.target.closest('[data-b]');if(!x)return;curBatch=+x.dataset.b;const b=BATCH[curBatch];R={id:null,no:''};$('r_to').value=b.to;$('r_amount').value=b.amount;if(b.date)$('r_date').value=b.date;renderBatch();renderR()});
  $('b_all').addEventListener('click',batchAll);
  $('h_box').addEventListener('click',async e=>{const o=e.target.closest('[data-open]'),r=e.target.closest('[data-rm]');
    if(o){const h=HIST.find(x=>x.id===o.dataset.open);if(h)openDoc(h);return}
    if(r){const id=r.dataset.rm;if(rmArm!==id){rmArm=id;r.textContent='本当に消す';$('h_msg').textContent='もう一度押すと、この記録だけが消えます（番号は戻りません）';return}rmArm=null;try{await db.collection('data/users/'+uid+'/docs/items').doc(id).delete();$('h_msg').textContent='消しました'}catch(err){$('h_msg').className='msg ng';$('h_msg').textContent='消せませんでした'}}});
  $('s_save').addEventListener('click',saveSettings);
  addEventListener('resize',()=>{if(tab==='receipt')renderR();if(tab==='invoice')renderI()});
}

async function boot(){
  $('r_date').value=today();newInvoice();renderR();
  wire();fillSettings();
  const claude=window.claude;if(!claude)return;
  try{db=await claude.use('db')}catch(e){}try{downloads=await claude.use('downloads')}catch(e){}
  try{const u=await claude.use('user');if(u){uid=await u.id()}}catch(e){}
  $('who').textContent=db&&uid?'':'（保存先につながっていません。PDFの番号づけと履歴は使えません）';
  if(db&&uid){try{const s=await db.doc('data/users/'+uid+'/settings').get();if(s&&s.exists){S=Object.assign(S,typeof s.data==='function'?s.data():s.data)}}catch(e){}
    try{const pf=await db.doc('data/users/'+uid+'/prefill').get();if(pf&&pf.exists){const pd=typeof pf.data==='function'?pf.data():pf.data;if(pd&&pd.batch&&!$('b_txt').value){$('b_txt').value=pd.batch;$('b_make').click()}}}catch(e){}
    fillSettings();$('i_msg2').value=S.invmsg;$('i_note').value=S.invnote;renderR();renderI();
    try{db.collection('data/users/'+uid+'/docs/items').onSnapshot(snap=>{HIST=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));if(tab==='history')renderHist()},()=>{})}catch(e){}}
  if(!downloads){const b=[$('r_pdf'),$('i_pdf'),$('b_all')];b.forEach(x=>{x.title='この画面ではPDFを保存できません'})}
}
boot();
})();
</script>
