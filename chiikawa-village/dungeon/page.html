<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ちいかわ ダンジョン</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* layout: fixed 1100x800 stage (top bar / battle field / message + commands), scaled to fit the viewport */
:root {
  color-scheme: dark;
  --ground: #07081a;
  --ink: #1b1530;
  --paper: #f1e8d4;
  --paper-2: #e2d5b6;
  --night: #11122c;
  --line: #d9cfae;
  --red: #c8402e;
  --gold: #e0a52a;
  --good: #3a8f5c;
  --hp: #4fb86a;
  --font: 'DotGothic16', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', monospace;
}
html, body { height: auto; }
body { margin: 0; background: var(--ground); color: var(--paper); font-family: var(--font); font-size: 18px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
* { box-sizing: border-box; }
button { font-family: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#wrap { width: 100%; max-width: 1600px; margin: 0 auto; position: relative; overflow: hidden; }
#stage { width: 1100px; height: 800px; position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--night); border: 6px solid #0a0a1c; box-shadow: 0 0 0 3px #3a3a6a; overflow: hidden; }
#stage { image-rendering: pixelated; }

/* top bar */
#top { height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: linear-gradient(#1a1a40, #101030); border-bottom: 4px solid #070718; }
#dungeonbtn { display: flex; align-items: baseline; gap: 10px; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); padding: 4px 14px; box-shadow: 0 3px 0 #070718; }
#dname { font-size: 22px; } #dfloor { font-size: 26px; color: var(--red); } #dfloors { font-size: 14px; opacity: .7; }
#runinfo { flex: 1; display: flex; gap: 18px; font-size: 16px; justify-content: flex-end; }
#runinfo b { color: #ffd23a; font-weight: normal; }
.hint { font-size: 14px; opacity: .65; }
@keyframes blink { 50% { opacity: .35; } }

/* stage track */
#track { height: 54px; display: flex; align-items: center; justify-content: center; gap: 6px; background: #0b0b24; border-bottom: 4px solid #070718; padding: 0 14px; }
.nd { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 15px; border: 3px solid #070718; background: #23234c; color: #8a88b8; position: relative; }
.nd.enemy { border-radius: 50%; } .nd.chest { background: #3a2a14; color: #e0a52a; transform: scale(.8); } .nd.boss { width: 48px; height: 38px; background: #4a1420; color: #ff9a8a; border-color: #c8402e; }
.nd.done { background: var(--gold); color: #3a2a08; } .nd.chest.done { background: #8a6a1c; }
.nd.now { background: var(--red); color: #fff; animation: blink 1s steps(2) infinite; }
.nd.now::after { content: '▼'; position: absolute; top: -17px; left: 50%; transform: translateX(-50%); color: #ffd23a; font-size: 14px; }
.lnk { width: 10px; height: 4px; background: #23234c; } .lnk.done { background: var(--gold); }

/* field */
#field { position: relative; width: 1100px; height: 410px; overflow: hidden; }
#bg { position: absolute; left: 0; top: -130px; width: 1100px; height: 580px; image-rendering: pixelated; }
.spr { position: absolute; image-rendering: pixelated; }
#enemy { width: 340px; height: 340px; left: 660px; top: 64px; transform-origin: 50% 96%; animation: breathe 2.4s ease-in-out infinite; filter: drop-shadow(0 0 16px rgba(10, 8, 30, .55)); }
.ally { width: 216px; height: 216px; left: 150px; top: 168px; transform-origin: 50% 96%; animation: bob 1.4s steps(2) infinite; }
@keyframes breathe { 50% { transform: scale(1.012, 1.03); } }
@keyframes bob { 50% { transform: translateY(-5px); } }
.walk { animation-duration: .35s !important; }
.lunge { animation: lunge .42s ease-out !important; }
@keyframes lunge { 0% { transform: translate(0, 0); } 40% { transform: translate(440px, -50px) scale(.92); } 100% { transform: translate(0, 0); } }
.cast { animation: cast .5s ease-out !important; }
@keyframes cast { 0% { transform: translateY(0); } 40% { transform: translateY(-28px) scale(1.06); filter: brightness(1.4); } 100% { transform: translateY(0); } }
.hurt { animation: hurt .35s steps(6) !important; }
@keyframes hurt { 0% { filter: brightness(3) saturate(0); transform: translateX(-10px); } 40% { transform: translateX(12px); } 100% { transform: translateX(0); } }
.die { animation: die 1.2s steps(12) forwards !important; }
@keyframes die { 0% { filter: brightness(2.4); } 30% { transform: translateX(-8px); filter: brightness(1.6) saturate(0); } 60% { transform: translateX(8px) scaleY(.9); opacity: .8; } 100% { transform: translateY(40px) scaleY(.2); opacity: 0; filter: brightness(3); } }
.fall { animation: fall 1s steps(10) forwards !important; }
@keyframes fall { 100% { transform: translateY(30px) rotate(80deg); opacity: .3; filter: grayscale(1); } }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; } #flash.go { animation: fl .35s ease-out; }
@keyframes fl { 0% { opacity: .75; } 100% { opacity: 0; } }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; } #fade.on { opacity: 1; }
#fx { position: absolute; inset: 0; pointer-events: none; } #pfx { position: absolute; left: 0; top: 0; width: 1100px; height: 410px; pointer-events: none; image-rendering: pixelated; }
.shake { animation: shake .4s steps(8); } @keyframes shake { 0% { transform: translate(0, 0); } 15% { transform: translate(var(--sh), calc(var(--sh) * -.6)); } 30% { transform: translate(calc(var(--sh) * -1), calc(var(--sh) * .5)); } 45% { transform: translate(calc(var(--sh) * .7), calc(var(--sh) * .6)); } 60% { transform: translate(calc(var(--sh) * -.6), calc(var(--sh) * -.4)); } 100% { transform: translate(0, 0); } }
#toast { position: absolute; left: 50%; top: 140px; transform: translate(-50%, -20px); background: var(--paper); color: var(--ink); border: 4px solid var(--ink); padding: 8px 22px; font-size: 22px; text-align: center; opacity: 0; pointer-events: none; transition: all .3s; box-shadow: 0 5px 0 rgba(0, 0, 0, .5); z-index: 5; } #toast.show { opacity: 1; transform: translate(-50%, 0); } #toast small { font-size: 15px; }
.dmg { position: absolute; font-size: 44px; color: #fff; text-shadow: 3px 3px 0 #1b1530, -2px -2px 0 #1b1530, 2px -2px 0 #1b1530, -2px 2px 0 #1b1530; animation: rise 1.2s ease-out forwards; white-space: nowrap; }
.dmg.crit { color: #ffd23a; font-size: 56px; } .dmg.heal { color: #9af0b0; } .dmg.hurtp { color: #ff8a7a; } .dmg.good { color: #9af0b0; font-size: 32px; } .dmg.info { color: #cfe0ff; font-size: 30px; }
@keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { transform: translateY(-10px) scale(1.15); opacity: 1; } 100% { transform: translateY(-70px) scale(1); opacity: 0; } }

#map { position: absolute; left: 0; top: 0; width: 1101px; height: 411px; image-rendering: pixelated; }
.fieldmode #bg, .fieldmode #enemy, .fieldmode #hero { display: none; } .battlemode #map, .battlemode #dpad, .battlemode #obj { display: none; }
#obj { left: 690px; top: 10px; width: 392px; padding: 5px 14px 6px; border-radius: 14px 14px 6px 14px; } #obj .prow { display: none; } #objtxt { font-size: 16px !important; margin: 0 !important; }
.fieldmode #pplate { left: 14px; top: 10px; width: 330px; padding: 4px 12px 6px; border-radius: 14px 14px 6px 14px; } .fieldmode #pplate .pname { font-size: 17px; } .fieldmode #pplate .push { display: none; } .fieldmode #pplate .hpbar { height: 13px; margin-top: 3px; } .fieldmode #pplate .hptext { font-size: 13px; margin-top: 1px; }
#mini { position: absolute; right: 14px; top: 58px; width: 288px; height: 104px; background: rgba(5,6,16,.7); border: 3px solid #cfc8ee; image-rendering: pixelated; }
.battlemode #mini { display: none; }
#dpad { position: absolute; left: 18px; bottom: 14px; width: 150px; height: 108px; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; touch-action: none; opacity: .75; }
#dpad button { background: rgba(241,232,212,.85); color: var(--ink); border: 3px solid var(--ink); font-size: 18px; padding: 0; touch-action: none; }
#dpad [data-d=up] { grid-column: 2; grid-row: 1; } #dpad [data-d=left] { grid-column: 1; grid-row: 2; } #dpad [data-d=down] { grid-column: 2; grid-row: 2; } #dpad [data-d=right] { grid-column: 3; grid-row: 2; }
/* plates */
.plate { position: absolute; background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 18px 18px 18px 6px; box-shadow: 0 5px 0 rgba(0, 0, 0, .45); padding: 8px 16px 10px; }
#eplate { left: 612px; top: 12px; width: 470px; } #pplate { left: 18px; top: 12px; width: 500px; border-radius: 18px 18px 6px 18px; }
.prow { display: flex; align-items: baseline; gap: 10px; } .pname { font-size: 24px; }
.chip { font-size: 13px; padding: 1px 8px; border: 2px solid var(--ink); background: var(--paper-2); } .chip.rare { background: #f4d86a; } .chip.warn { background: #f08a7a; }
.push { margin-left: auto; font-size: 16px; }
.hpbar { margin-top: 5px; height: 20px; background: #2b2540; border: 3px solid var(--ink); position: relative; overflow: hidden; }
.hpfill { height: 100%; background: linear-gradient(var(--hp), #2f8a4a); transition: width .5s steps(12); } .hpfill.low { background: linear-gradient(#f0a03a, #c8402e); } .hpfill.foe { background: linear-gradient(#e0605a, #a02a2a); }
.hptext { font-size: 15px; margin-top: 3px; display: flex; justify-content: space-between; gap: 8px; }
.sp { letter-spacing: 3px; color: #2a6ad8; }

/* bottom */
#bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 280px; background: linear-gradient(#0d0d26, #0a0a1c); border-top: 4px solid #070718; padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 6px; }
#row1 { display: grid; grid-template-columns: 1fr 520px; gap: 12px; height: 98px; flex: none; }
#msgbox { border: 4px double #cfc8ee; background: #12123a; padding: 8px 16px; font-size: 20px; line-height: 1.45; color: #f3f0ff; overflow: hidden; }
#cmds { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; }
.cmd { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px; padding: 2px 12px; text-align: left; box-shadow: 0 3px 0 #070718; display: flex; flex-direction: column; justify-content: center; line-height: 1.15; }
.cmd b { font-size: 20px; font-weight: normal; } .cmd small { font-size: 12px; opacity: .75; }
.cmd:hover:not(:disabled) { background: #fff6dc; transform: translateY(1px); } .cmd:disabled { opacity: .4; cursor: not-allowed; }
.cmd.main { border-color: var(--red); background: #fff1d8; } .cmd.main b::after { content: ' ▶'; color: var(--red); animation: blink 1s steps(2) infinite; }
#mhead { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; color: #cfc8ee; flex: none; }
#mlog { color: #9af0b0; } #mhead button { font-size: 13px; background: #23234c; border: 2px solid #4a4a8a; padding: 1px 10px; }
#metrics { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; flex: 1; min-height: 0; }
.mc { background: #15153a; border: 3px solid #2e2e6a; padding: 6px 10px 6px; display: flex; flex-direction: column; min-width: 0; position: relative; }
.mc.up { animation: pulse .9s ease-out; } @keyframes pulse { 0% { background: #2e6a46; border-color: #9af0b0; } 100% { background: #15153a; border-color: #2e2e6a; } }
.mc .ml { font-size: 14px; color: #a8a6d8; } .mc .mv { font-size: 26px; color: #fff; line-height: 1.1; } .mc .mv small { font-size: 13px; margin-left: 3px; color: #a8a6d8; }
.mc .md { font-size: 12px; color: #9af0b0; } .mc .me { margin-top: auto; font-size: 14px; color: #ffd23a; border-top: 2px dotted #3a3a7a; padding-top: 3px; }
.mc .mp { position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; background: #23234c; border: 2px solid #4a4a8a; font-size: 15px; line-height: 1; padding: 0; }

/* modals */
.modal { position: absolute; inset: 56px 0 0 0; display: none; align-items: center; justify-content: center; background: rgba(4, 4, 16, .72); }
.modal.open { display: flex; }
.mpanel { width: 760px; max-height: 660px; overflow: auto; background: var(--paper); color: var(--ink); border: 5px solid var(--ink); border-radius: 18px; padding: 14px 22px 18px; box-shadow: 0 8px 0 rgba(0, 0, 0, .5); }
.mpanel.wide { width: 980px; }
.mhead { display: flex; justify-content: space-between; align-items: center; font-size: 24px; margin-bottom: 4px; }
.mclose { background: var(--paper-2); border: 3px solid var(--ink); padding: 2px 14px; font-size: 16px; }
.mnote { font-size: 15px; opacity: .8; margin: 6px 0 8px; line-height: 1.5; }
.tlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.trow { display: grid; grid-template-columns: 56px 1fr 120px 104px; gap: 10px; align-items: center; background: #fff8e6; border: 3px solid var(--ink); padding: 6px 10px; font-size: 18px; }
.trow.done { opacity: .5; text-decoration: line-through; }
.tkind { font-size: 13px; text-align: center; border: 2px solid var(--ink); padding: 1px 0; }
.tkind.main { background: #f4d86a; } .tkind.add { background: #bfe3f0; }
.treward { font-size: 14px; color: #6a2a20; }
.tbtn, .mbtn { background: var(--ink); color: var(--paper); border: 3px solid var(--ink); padding: 4px 12px; font-size: 16px; box-shadow: 0 3px 0 #000; }
.mbtn { font-size: 20px; padding: 8px 18px; }
.mbtn.sub { background: var(--paper-2); color: var(--ink); }
.mbtn:disabled { opacity: .35; cursor: not-allowed; }
.tdone { font-size: 14px; text-align: center; text-decoration: none; }
.tsep { margin: 12px 0 6px; font-size: 16px; border-bottom: 3px dotted var(--ink); }
.tadd { display: flex; gap: 8px; margin-top: 12px; }
.tadd input { flex: 1; font-family: inherit; font-size: 17px; padding: 6px 10px; border: 3px solid var(--ink); background: #fff; color: var(--ink); }
.fgrid { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: center; margin-top: 8px; }
.ficon { background: #2b2a52; border: 4px solid var(--ink); height: 200px; display: flex; align-items: center; justify-content: center; }
.ficon canvas, .dicon canvas { image-rendering: pixelated; }
.fname { font-size: 26px; } .fstat { font-size: 18px; margin-top: 6px; } .fbtns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; align-items: flex-start; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.slot { border: 3px solid var(--ink); background: #fff8e6; padding: 6px 8px; font-size: 14px; min-height: 52px; } .slot i { display: block; font-style: normal; font-size: 12px; opacity: .6; } .slot.on { background: #f4d86a; }
b.r-SR { background: #7a38c8; color: #fff; padding: 0 6px; font-weight: normal; font-size: 15px; } b.r-R { background: #2a6ad8; color: #fff; padding: 0 6px; font-weight: normal; font-size: 15px; } b.r-C { background: #8a8a98; color: #fff; padding: 0 6px; font-weight: normal; font-size: 15px; }
.dgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
.dcard { border: 4px solid var(--ink); padding: 12px; text-align: left; color: #fff; display: flex; flex-direction: column; gap: 6px; min-height: 250px; font-size: 16px; text-shadow: 2px 2px 0 rgba(0, 0, 0, .7); }
.dcard.sel { outline: 4px solid var(--gold); outline-offset: 2px; }
.th-cave { background: linear-gradient(#0b1030, #1a2a58 60%, #141c3a); } .th-tower { background: linear-gradient(#17104a, #5a3e98 60%, #2c2850); } .th-ruins { background: linear-gradient(#3a1c14, #b0702e 60%, #5a3c24); }
.dc-name { font-size: 22px; } .dc-floor { font-size: 34px; color: #ffd23a; } .dc-floor small { font-size: 14px; color: #fff; }
.dc-pips { display: flex; gap: 2px; } .dc-pips i { flex: 1; height: 10px; background: rgba(0, 0, 0, .5); border: 2px solid #000; } .dc-pips i.on { background: var(--gold); } .dc-pips i.now { background: var(--red); }
.dc-gap { margin-top: auto; background: rgba(0, 0, 0, .55); padding: 4px 8px; }
.dropbox { background: var(--paper); color: var(--ink); border: 5px solid var(--ink); padding: 18px 40px 22px; text-align: center; border-radius: 18px; }
.dtitle { font-size: 30px; color: var(--red); } .dicon { margin: 8px auto; width: 170px; height: 170px; background: #2b2a52; border: 4px solid var(--ink); display: flex; align-items: center; justify-content: center; } .dname2 { font-size: 28px; } .dsub { font-size: 16px; margin: 8px 0 14px; }

@media (prefers-reduced-motion: reduce) { #enemy, .ally, .nd.now { animation: none; } }
</style>
<div id="wrap">

    <div id="top">

      <button id="mute" aria-label="音楽の入切" style="font-size:14px;background:#23234c;border:2px solid #4a4a8a;padding:3px 10px">♪ ON</button><span class="hint">▲ ダンジョン一覧</span>
    </div>

<script>
/* 封札モンスターズ — PIXKIT v3: toolkit for SFC-quality monster battle sprites.
 *
 * Monster modules register:   PIXMON[id] = function (k) { ...draw with k... };
 * The game calls:             PIXKIT.render(id)  -> cached PNG dataURL (80x80, transparent)
 *
 * Model: shapes paint a MATERIAL (7-tone hue-shifted ramp) into an indexed buffer and belong to a PART (a volume).
 * finish(): per-part form shading from an upper-left light (dome normals from distance-to-edge) quantised into
 * 5 body tones with checker-dithered transitions, reflected light on shadow rims and specular dots; then texture
 * and hand-shading passes, black seams between different materials, and a 1px outline (near-black, coloured on
 * lit top/left edges). See PIXMON_STYLE.md.
 */
(function () {
  'use strict';
  var W = 80, H = 80, N = W * H;
  var T = 7; // tones per ramp: 0 deepest, 1-2 shadows, 3 base, 4-5 lights, 6 highlight/specular

  var RAMPS = {
    fire: ['#2a0816', '#6a1230', '#a8203a', '#e04a24', '#ff8a2a', '#ffc450', '#fff2a8'],
    flame: ['#6a1020', '#b82a1a', '#f05a18', '#ff9020', '#ffc03a', '#ffe880', '#fffce0'],
    magma: ['#1e0612', '#561030', '#9a1a2a', '#e0401a', '#ff7a1e', '#ffbe40', '#fff29a'],
    water: ['#0a0a30', '#1e1e70', '#2a3aa8', '#2a6ad8', '#3aa2ee', '#80d8fa', '#e0fcff'],

  var KINDS = {
    chibi: { ears: 'cat', body: '#dcdce2', eyeY: 8, face: 'cat' },

    if (e.target.closest('[data-retry]')) { closeModal(); startRun(cur()); S.busy = false; render(); say('もういちど ' + cur().floor + 'F の はじめから！ ' + cur().hname + 'は 回復した。'); }
    else if (e.target.closest('[data-prep]')) { closeModal(); startRun(cur()); S.busy = false; render(); openTasks(); }
    else if (e.target.closest('[data-next]')) { closeModal(); startRun(cur()); S.busy = false; render(); say(cur().floor + 'F に ふみこんだ。 敵が 強くなっている気がする…'); }
  });

  // ---------- tasks / forge / list / detail ----------
  function openTasks() {
    if (S.busy) return; var d = cur();
    function row(t) { return '<li class="trow ' + ((HOST.on ? t.used : t.done) ? 'done' : '') + '"><span class="tkind ' + t.type + '">' + (t.type === 'main' ? '本隊' : '増援') + '</span><span class="tname">' + esc(t.t) + '</span><span class="treward">' + (t.type === 'main' ? '強化チャンス +1' : '素材 +1') + '</span>' + (HOST.on ? (t.used ? '<span class="tdone">反映ずみ</span>' : t.done ? '<button class="tbtn" data-claim="' + esc(t.id) + '">力にする</button>' : '<span class="tdone" style="opacity:.6">未完了</span>') : (t.done ? '<span class="tdone">完了</span>' : '<button class="tbtn" data-done="' + t.id + '">終わった！</button>')) + '</li>'; }
    openModal('<div class="mpanel"><div class="mhead"><b>' + esc(d.name) + ' のタスク</b><button class="mclose" data-close>とじる</button></div>' +
      '<p class="mnote">' + (HOST.on ? 'ちいかわ株式会社で完了にした仕事を「力にする」と、戦う力になる。本隊は「強化チャンス」、増援（ざこ）は「素材」。未完了のものは、会社側で完了にすると ここで使える。' : 'タスクを終わらせると 戦う力になる。本隊は「強化チャンス」、あとから足した増援（ざこ）は「素材」。どちらも「タスク完了」の実績に入って 最大HPが上がる。') + '</p>' +
      '<ul class="tlist">' + d.tasks.filter(function (t) { return t.type === 'main'; }).map(row).join('') + '</ul><div class="tsep">増援（ざこ）</div><ul class="tlist">' + d.tasks.filter(function (t) { return t.type === 'add'; }).map(row).join('') + '</ul>' +
      (HOST.on ? '' : '<form class="tadd" id="tform"><input id="tin" maxlength="24" placeholder="あとから足す用事（増援として入る）" aria-label="増援を足す"><button class="tbtn" type="submit">増援を呼ぶ</button></form>') + '</div>');
    if (!HOST.on) $('#tform').addEventListener('submit', function (e) { e.preventDefault(); var v = $('#tin').value.trim(); if (!v) return; d.tasks.push({ id: 'n' + (S.uid++), t: v, type: 'add', done: false }); SFX.tick(); say('増援が あらわれた！ 倒せば 素材になる。'); openTasks(); });
  }
  function bump(key, n, why) {
    var before = stats(), m = DATA.metrics.filter(function (x) { return x.k === key; })[0]; M[key].val += n; var after = stats();
    var diff = after[m.stat] - before[m.stat], unit = m.stat === 'CRIT' || m.stat === 'LUCK' ? '%' : '';
    var dv = unit ? '+' + (Math.round(diff * 10) / 10) + '%' : '+' + fmt(diff);
    S.log = '最近の強化： ' + m.label + (why ? '（' + why + '）' : ' +' + (m.fmt ? m.fmt(n) : n + m.unit)) + ' → ' + m.stat + ' ' + dv;
    if (m.stat === 'HP' && S.run) S.run.hp += diff;
    render(); var el = $('#mc_' + key); if (el) anim(el, 'up'); return S.log;
  }
  modal.addEventListener('click', function (e) {
    var c = e.target.closest('[data-claim]'); if (!c || !HOST.on) return;
    var id = c.getAttribute('data-claim'), d = cur(), t = d.tasks.filter(function (x) { return x.id === id; })[0]; if (!t || !t.done || t.used || S.used[id]) return;
    t.used = true; S.used[id] = 1; SFX.done(); if (t.type === 'main') S.charges++; else S.mats++;
    S.log = '最近の強化： 「' + t.t + '」を力にした → ' + (t.type === 'main' ? '強化チャンス +1' : '素材 +1'); render();
    toHost('taskUsed', { id: id, kind: t.type, dungeon: d.id });
    say('「' + t.t + '」を力にした！ ' + (t.type === 'main' ? '強化チャンス +1。' : '素材 +1。')); openTasks();
  });
  modal.addEventListener('click', function (e) {
    var b = e.target.closest('[data-done]'); if (!b) return;
    var d = cur(), t = d.tasks.filter(function (x) { return x.id === b.getAttribute('data-done'); })[0]; if (!t || t.done) return;
    t.done = true; SFX.done(); if (t.type === 'main') S.charges++; else S.mats++;
    bump('tasks', 1, '「' + t.t + '」'); say('「' + t.t + '」を終わらせた！ ' + (t.type === 'main' ? '強化チャンス +1。' : '素材 +1。') + ' 最大HPも のびた。'); openTasks();
  });
  function toast(it, eq) { var t = $('#toast'); t.innerHTML = '<b class="r-' + it.rare + '">' + it.rare + '</b> ' + SLOTJ[it.slot] + '：' + it.name + '<br><small>' + itemDesc(it) + (eq ? '　▶ そうびした！' : '　（見送り）') + '</small>'; t.className = 'show'; clearTimeout(toast.h); toast.h = setTimeout(function () { t.className = ''; }, 2600); }
  function openForge() {
    if (S.busy) return; var w = S.weapon, st = stats();
    openModal('<div class="mpanel forge"><div class="mhead"><b>鍛冶屋</b><button class="mclose" data-close>とじる</button></div>' +
      '<div class="fgrid"><div class="ficon" id="ficon"></div><div class="finfo"><div class="fname">' + w.name + ' <b class="r-' + w.rare + '">' + w.rare + '</b></div>' +
      '<div class="fstat">攻撃力 <b>' + fmt(st.ATK) + '</b>　（剣 ' + fmt(w.base) + ' ＋ 強化 ' + fmt(S.enh * DATA.enhStep) + ' ＋ 売上 ' + fmt(st.salesATK) + '）</div>' +
      '<div class="fstat">強化チャンス <b>' + S.charges + '</b> 回　／　素材 <b>' + S.mats + '</b></div>' +
      '<div class="fbtns"><button class="mbtn" id="fenh"' + (S.charges ? '' : ' disabled') + '>強化する（ATK +' + fmt(DATA.enhStep) + '）</button><button class="mbtn sub" id="fmat"' + (S.mats >= DATA.matsPerChance ? '' : ' disabled') + '>素材' + DATA.matsPerChance + 'つ → 強化チャンス+1</button></div>' +
      '<p class="mnote">強化は かならず 成功する。たおした敵の素材も 強化チャンスになる。</p></div></div></div>');
    var ic = makeSword(w.ramp); ic.style.width = '180px'; ic.style.height = '180px'; $('#ficon').appendChild(ic);
    $('#fenh').addEventListener('click', function () { S.charges--; S.enh++; SFX.crit(); S.log = '最近の強化： 武器を強化 → ATK +' + fmt(DATA.enhStep); say('強化せいこう！ 攻撃力が ' + fmt(DATA.enhStep) + ' あがった！'); render(); openForge(); });
    $('#fmat').addEventListener('click', function () { S.mats -= DATA.matsPerChance; S.charges++; SFX.done(); say('素材を鍛えて 強化チャンスを1回ぶん つくった！'); render(); openForge(); });
  }
  function openList() {
    if (S.busy) return;
    var cards = D.map(function (d, i) {
      return '<button class="dcard th-' + d.theme + (i === S.idx ? ' sel' : '') + '" data-dun="' + i + '"><span class="dc-name">' + esc(d.name) + '</span><span class="dc-floor">' + d.floor + 'F <small>/ ' + d.floors + 'F</small></span>' +
        '<span class="dc-boss">ボス: ' + d.boss + '</span><span class="dc-key">ベスト ' + d.best + ' / ' + C.minions + '体　挑戦 ' + d.tries + '回</span><span class="dc-gap">未完了タスク ' + d.tasks.filter(function (t) { return !t.done; }).length + '</span></button>';
    }).join('');
    openModal('<div class="mpanel wide"><div class="mhead"><b>ダンジョン一覧</b><button class="mclose" data-close>とじる</button></div><div class="dgrid">' + cards + '</div></div>');
  }
  modal.addEventListener('click', function (e) {
    var b = e.target.closest('[data-dun]'); if (!b) return;
    var i = +b.getAttribute('data-dun'); closeModal();
    if (i !== S.idx) { S.idx = i; startRun(cur()); enemyImg.style.opacity = 0; equipArt(); if (AC) musicNow(); }
    render(); say(cur().name + 'に はいった！ ' + cur().floor + 'F の ざこを ' + C.minions + '体 たおして ボスを めざそう。');
  });
  function openDetail() {
    var s = stats();
    var rows = [['ATK 攻撃力', fmt(s.ATK), '剣 ' + fmt(S.weapon.base) + ' ＋ 強化 ' + fmt(S.enh * DATA.enhStep) + ' ＋ 売上 ' + fmt(s.salesATK)], ['そうび', S.weapon.name + '／' + (S.gear.armor ? S.gear.armor.name : '防具なし') + '／' + (S.gear.acc ? S.gear.acc.name : 'かざりなし'), '敵のドロップで入手。強いものは自動でそうび'], ['MAG スキル', fmt(s.MAG), '記事公開 ' + M.articles.val + '本'], ['HP 最大体力', fmt(s.HP), 'タスク完了 ' + M.tasks.val + '件'], ['DEF ぼうぎょ', fmt(s.DEF), '連続稼働 ' + M.streak.val + '日（被ダメ -' + Math.round((1 - E.reduce(s.DEF)) * 100) + '%）'], ['CRIT 会心率', Math.round(s.CRIT) + '%', '動画公開 ' + M.videos.val + '本'], ['LUCK 素材運', Math.round(s.LUCK) + '%', '新規登録 ' + M.signups.val + '人']];
    openModal('<div class="mpanel"><div class="mhead"><b>' + cur().hname + 'のステータス</b><button class="mclose" data-close>とじる</button></div><p class="mnote">' + (HOST.on ? 'ちいかわ株式会社の実績が そのまま 戦う力になっている。数字は会社側で更新される。' : '数字は すべて サンプル。ほんとうの実績をつなぐと、仕事の成果が そのまま 戦う力になる。') + '</p><ul class="tlist">' +
      rows.map(function (r) { return '<li class="trow" style="grid-template-columns:150px 130px 1fr"><span>' + r[0] + '</span><b>' + r[1] + '</b><span class="treward">' + r[2] + '</span></li>'; }).join('') + '</ul>' + (HOST.on ? '' : '<div class="tsep">データ</div><button class="mbtn sub" data-reset>セーブを消して はじめから</button>') + '</div>');
  }
  modal.addEventListener('click', function (e) { if (e.target.closest('[data-reset]')) { openModal('<div class="dropbox"><div class="dtitle">ほんとうに 消す？</div><div class="dsub">いまの進みぐあい（強化・装備・実績・タスク）が すべて 消えます。<br>元には 戻せません。</div><div style="display:flex;gap:10px;justify-content:center"><button class="mbtn" data-close>やめる</button><button class="mbtn sub" data-reset2>消す</button></div></div>', 'center'); } else if (e.target.closest('[data-reset2]')) resetSave(); });

  // ---------- wiring ----------
  $('#cmds').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cmd]'); if (!b || b.disabled) return; SFX.tick(); var c = b.getAttribute('data-cmd');
    if (c === 'tasks') openTasks(); else if (c === 'forge') openForge(); else if (c === 'list') openList(); else if (c === 'detail') openDetail(); else act(c);
  });
  $('#metrics').addEventListener('click', function (e) { var b = e.target.closest('[data-mp]'); if (!b) return; var k = b.getAttribute('data-mp'), m = DATA.metrics.filter(function (x) { return x.k === k; })[0]; SFX.done(); say(bump(k, m.step)); });
  $('#mdetail').addEventListener('click', function () { SFX.tick(); openDetail(); });
  $('#dungeonbtn').addEventListener('click', function () { SFX.tick(); openList(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal.classList.contains('open') && !S.busy) { closeModal(); render(); } });
  function fit() { var s = Math.min(1.45, Math.max(0.3, $('#wrap').clientWidth / 1100)); $('#stage').style.transform = 'scale(' + s + ')'; $('#wrap').style.height = (800 * s) + 'px'; }
  window.addEventListener('resize', fit);

  // ---------- audio start (needs a user gesture) + mute ----------
  function kick() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); musicNow(); } catch (e) { } }
  ['pointerdown', 'keydown'].forEach(function (ev) { document.addEventListener(ev, function once() { kick(); document.removeEventListener(ev, once); }); });
  $('#mute').addEventListener('click', function () { setMute(!BGM.muted); });
  document.addEventListener('keydown', function (e) { if ((e.key === 'm' || e.key === 'M') && !(e.target && e.target.tagName === 'INPUT')) setMute(!BGM.muted); });
  setMute(BGM.muted);
  // ---------- input ----------
  var KM = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Shift') keys.run = true;
    var d = KM[e.key]; if (d && !e.metaKey && !e.ctrlKey && S.view === 'field' && !modal.classList.contains('open') && !(e.target && e.target.tagName === 'INPUT')) { e.preventDefault(); keys[d] = true; lastDir = d; }
  });
  document.addEventListener('keyup', function (e) { if (e.key === 'Shift') keys.run = false; var d = KM[e.key]; if (d) { keys[d] = false; if (lastDir === d) lastDir = null; } });
  window.addEventListener('blur', function () { keys.up = keys.down = keys.left = keys.right = keys.run = false; lastDir = null; });
  document.querySelectorAll('#dpad [data-d]').forEach(function (b) {
    var d = b.getAttribute('data-d');
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); keys[d] = true; lastDir = d; });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, function () { keys[d] = false; if (lastDir === d) lastDir = null; }); });
  });

  // ---------- host bridge (postMessage) ----------
  // When embedded in another page (e.g. ちいかわ株式会社), the parent sends real work data and persists the save.
  //   game -> host : {src:'chii-dungeon', v:1, type:'ready'|'save'|'taskUsed'|'floorClear', ...}
  //   host -> game : {src:'chii-host', v:1, type:'data', metrics, dungeons, activeId, save}
  function toHost(type, extra) { if (!HOST.framed) return; try { var m = { src: 'chii-dungeon', v: 1, type: type }; for (var k in extra) m[k] = extra[k]; window.parent.postMessage(m, '*'); } catch (e) { } }
  function num(v, d) { v = +v; return isFinite(v) ? v : d; }
  function txt(v, n) { return String(v == null ? '' : v).slice(0, n); }
  function freshProgress() {
    S.weapon = { name: 'ひのきの剣', rare: 'C', base: 0.6e6, ramp: 'wood' }; S.enh = 0; S.charges = 0; S.mats = 0; S.gear = { armor: null, acc: null }; S.log = ''; S.uid = 100; S.used = {};
  }
  var hostFirst = true;
  function ingest(p) {
    if (!p || typeof p !== 'object') return;
    var prevId = HOST.on && D[S.idx] ? D[S.idx].id : null, first = hostFirst; hostFirst = false;
    if (!HOST.on) { HOST.on = true; freshProgress(); }
    var sv = first && p.save && typeof p.save === 'object' ? p.save : null, PROG = {};
    if (sv) {
      if (sv.weapon && typeof sv.weapon === 'object') S.weapon = sv.weapon; S.enh = num(sv.enh, 0); S.charges = num(sv.charges, 0); S.mats = num(sv.mats, 0);
      if (sv.gear) S.gear = sv.gear; S.log = txt(sv.log, 80); S.uid = num(sv.uid, 100); S.used = (sv.used && typeof sv.used === 'object') ? sv.used : {};
      (Array.isArray(sv.P) ? sv.P : []).forEach(function (x) { if (x && x.id) PROG[x.id] = x; });
    }
    // metrics: host values replace the sample ones
    DATA.metrics.forEach(function (m) { // metrics the host does not send show 0 (never the sample numbers)
      var x = p.metrics && typeof p.metrics === 'object' ? p.metrics[m.k] : null, ok = x && typeof x === 'object';
      M[m.k].val = ok ? Math.max(0, num(x.val, 0)) : 0; m.d = ok && x.note != null ? txt(x.note, 24) : '';
    });
    // dungeons
    var list = Array.isArray(p.dungeons) ? p.dungeons.slice(0, 12) : [];
    if (!list.length) list = [{ id: 'none', slot: 'cave', name: 'プロジェクトが まだ ありません', floors: 1, tasks: [] }];
    var prev = {}; D.forEach(function (d) { prev[d.id] = d; });
    var next = list.map(function (h, i) {
      var slot = TEMPL[h.slot] ? h.slot : SLOTS[i % 3], t = TEMPL[slot], id = txt(h.id || ('p' + i), 40), old = prev[id];
      var d = old || { id: id, hero: t.hero, hname: t.hname, sprite: t.sprite, theme: t.theme, boss: t.boss, rare: t.rare, drop: t.drop, floors: t.floors, floor: 1, cleared: 0, best: 0, tries: 0, last: null, tasks: [] };
      if (!old && PROG[id]) { var q = PROG[id]; d.floor = Math.max(1, num(q.floor, 1)); d.cleared = num(q.cleared, 0); d.best = num(q.best, 0); d.tries = num(q.tries, 0); d.last = q.last == null ? null : q.last; }
      d.name = txt(h.name, 24) || t.hname; d.floors = Math.max(1, Math.min(99, Math.round(num(h.floors, t.floors)))); d.floor = Math.min(d.floor, d.floors);
      d.tasks = (Array.isArray(h.tasks) ? h.tasks : []).slice(0, 60).map(function (x, j) {
        var tid = txt(x && x.id != null ? x.id : (id + ':' + j), 60);
        return { id: tid, t: txt(x && x.title, 40), type: x && x.kind === 'add' ? 'add' : 'main', done: !!(x && x.done), used: !!(x && x.used) || !!S.used[tid] };
      });
      return d;
    });
    D.length = 0; next.forEach(function (d) { D.push(d); });
    var ai = -1; if (p.activeId != null) D.forEach(function (d, i) { if (d.id === String(p.activeId)) ai = i; });
    if (first && ai < 0 && sv && Number.isInteger(sv.idx) && sv.idx < D.length) ai = sv.idx;
    if (ai < 0) { D.forEach(function (d, i) { if (d.id === prevId) ai = i; }); }
    S.idx = ai >= 0 ? ai : 0;
    HOST.exp = p.expedition && typeof p.expedition === 'object' ? { max: Math.max(1, num(p.expedition.max, 3)), left: Math.max(0, num(p.expedition.left, 3)), next: txt(p.expedition.next, 8) } : null;
    document.documentElement.classList.add('hosted');
    var w = document.getElementById('hostwait'); if (w) w.remove();
    if (first || cur().id !== prevId) { startRun(cur()); enemyImg.style.opacity = 0; equipArt(); if (AC) musicNow(); }
    if (first) kick(); // 親のボタンで開いた直後なら、ゲームの中をさわる前でも曲を始められることがある（だめなら最初のクリック／キーで始まる）
    render(); if (first) say(cur().name + '。矢印キー（WASD）か 十字ボタンで あるこう。 ざこを ' + C.minions + '体 たおすと 奥の扉が ひらく！');
  }
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || e.data.src !== 'chii-host' || e.data.type !== 'data') return;
    try { ingest(e.data); } catch (err) { toHost('error', { message: String(err && err.message).slice(0, 120) }); }
  });
  function hostHello() {
    if (!HOST.framed) return;
    var st = document.createElement('style'); st.textContent = '.hosted .mp{display:none!important}#hostwait{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:#10142b;color:#fbf7ef;font:16px DotGothic16,sans-serif}'; document.head.appendChild(st);
    var w = document.createElement('div'); w.id = 'hostwait'; w.textContent = 'ちいかわ株式会社と つなぎ中…'; document.body.appendChild(w);
    (function ping() { if (HOST.on) return; if (HOST.tries++ >= 6) { w.textContent = 'サンプル表示（親アプリと つながっていません）'; setTimeout(function () { if (!HOST.on && w.parentNode) w.remove(); }, 1800); return; } toHost('ready', {}); setTimeout(ping, 500); })();
  }

  // ---------- boot ----------
  var resumed = load(); equipArt(); startRun(cur()); if (resumed) cur().tries = Math.max(1, cur().tries); enemyImg.style.opacity = 0; render(); fit();
  say(cur().floor + 'F。矢印キー（WASD）か 十字ボタンで あるこう。 ざこを ' + C.minions + '体 たおすと 奥の扉が ひらく！');
  requestAnimationFrame(frame);
  hostHello();
  window.__G = { HOST: HOST, ingest: ingest, BGM: BGM, tick: tick, keys: keys, S: S, D: D, M: M, E: E, render: render, fmt: fmt, act: act, stats: stats, bump: bump, openTasks: openTasks, openForge: openForge, openList: openList, openDetail: openDetail, closeModal: closeModal };
})();
</script>
