<title>はしぐち村</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* layout: 1カラム。村のドット画面 → 会話窓 → 提案 → 会議 → ほうこく箱 → そーやんの仕事 */
:root{--bg:#fbf5e8;--panel:#fffdf7;--ink:#3a3330;--sub:#857a70;--line:#e9dcc6;--accent:#e9829b;--good:#5f9d5a;--warn:#c98a1c;
  --win:#2b2a3a;--win-edge:#6b6a86;--win-ink:#fbf7ef;--win-hi:#fff3b0;--bub:#ffffff;--bub-ink:#3a3330;
  --dot:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;--body:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a18;--panel:#2a2522;--ink:#f3ebe3;--sub:#b3a79c;--line:#41382f;--good:#8fd18a;--warn:#e7b04a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1a18;--panel:#2a2522;--ink:#f3ebe3;--sub:#b3a79c;--line:#41382f;--good:#8fd18a;--warn:#e7b04a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--dot)}
.app{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .date{font-size:12px;color:var(--sub)}
.hud{display:flex;gap:6px;align-items:center}
.pill{font-size:13px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn-s{font:inherit;font-size:12px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;white-space:nowrap}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{position:relative;border:3px solid #3b3533;border-radius:6px 6px 0 0;overflow:hidden;background:#a6d37f}
.stage canvas{display:block;width:100%;max-width:100%;image-rendering:pixelated}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--bub);color:var(--bub-ink);border:1.5px solid #3b3533;border-radius:6px;
  padding:1px 5px;font-size:clamp(9px,2.5vw,11px);line-height:1.35;white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
  box-shadow:0 1px 0 rgba(0,0,0,.15);transition:opacity .2s}
.bub.soyan{background:#fff6d6}
.bub[data-empty="1"]{opacity:0}
.floater{position:absolute;transform:translate(-50%,-100%);font-size:14px;color:#fff;text-shadow:0 1px 0 #3b3533,1px 0 0 #3b3533,-1px 0 0 #3b3533,0 -1px 0 #3b3533;pointer-events:none;animation:up 1.2s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-220%);opacity:0}}
.win{background:var(--win);color:var(--win-ink);border:3px solid #3b3533;border-top:0;border-radius:0 0 6px 6px;padding:12px 14px;min-height:172px;position:relative;box-shadow:inset 0 0 0 3px var(--win-edge)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--win-edge);border-radius:6px;padding:2px 8px 2px 4px;margin-bottom:8px}
.tag img{width:20px;height:20px;image-rendering:pixelated}
.head{font-size:11px;color:#c9c5e6;letter-spacing:.06em}
.ttl{font-size:16px;margin:2px 0 4px;color:var(--win-hi);text-wrap:balance}
.txt{font-size:14px;line-height:1.75;white-space:pre-wrap;min-height:3.5em;cursor:pointer;overflow-wrap:anywhere}
.more{position:absolute;right:14px;bottom:10px;animation:blink 1s steps(2) infinite;font-size:12px}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.more{animation:none}.floater{animation-duration:.01s}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts button,.acts a{font:inherit;font-size:13px;border-radius:8px;padding:6px 12px;border:2px solid var(--win-ink);background:transparent;color:var(--win-ink);cursor:pointer;text-decoration:none}
.acts .ok{background:#f19bb0;border-color:#f19bb0;color:var(--win)}
.acts .ok[aria-pressed="true"]{background:#8fd18a;border-color:#8fd18a}
.acts .choice{border-color:var(--win-hi);color:var(--win-hi)}
.acts .choice[aria-pressed="true"]{background:var(--win-hi);color:var(--win)}
.box{margin-top:16px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px 14px}
.box h2{font-size:15px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box h2 small{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;font-weight:400}
.box h3{font-size:13px;margin:14px 0 2px;color:var(--sub);font-weight:400;letter-spacing:.04em}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}
.item{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px;padding:9px 0;border-top:1px dashed var(--line)}
.item input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:#6aa56a}
.item .t{font-size:14px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
a.t:hover{text-decoration:underline}
.item.done .t{color:var(--sub);text-decoration:line-through}
.item p,.card p{margin:3px 0 0;font-size:12.5px;color:var(--sub);line-height:1.6;font-family:var(--body);overflow-wrap:anywhere;white-space:pre-wrap}
.item .ans{display:inline-block;margin-top:4px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.sched{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sched span{font-size:12px;border:2px solid var(--line);border-radius:6px;padding:2px 7px}
.empty{font-size:13px;color:var(--sub);padding:10px 0;font-family:var(--body);line-height:1.6;margin:0}
.card{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px dashed var(--line)}
.card:first-of-type{border-top:0}
.card .ava{width:40px;height:40px;border-radius:8px;background:var(--bg);display:grid;place-items:center}
.card .ava img{width:32px;height:32px;image-rendering:pixelated}
.card .who{font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;border-radius:999px;padding:1px 8px;border:1.5px solid var(--line)}
.chip.proposed{border-color:var(--warn);color:var(--warn)}
.chip.approved,.chip.doing{border-color:var(--accent);color:var(--accent)}
.chip.done{border-color:var(--good);color:var(--good)}
.card .t{font-size:15px;margin:2px 0 0}
.card .plan{margin-top:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.row button{font:inherit;font-size:12.5px;border-radius:8px;padding:5px 10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.row button.yes{border-color:var(--good);background:var(--good);color:var(--panel)}
.row input{flex:1;min-width:0;font-family:var(--body);font-size:13px;padding:6px 8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.result{margin-top:8px;border-left:3px solid var(--good);padding:4px 0 4px 10px}
.result summary{cursor:pointer;font-size:13px;color:var(--good)}
.mtg .line{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;align-items:start;margin-top:6px;font-family:var(--body);font-size:13px;line-height:1.55}
.mtg .line img{width:20px;height:20px;image-rendering:pixelated}
.mtg .dec{margin-top:10px;font-size:13px}
.mtg .dec li{font-family:var(--body);color:var(--sub);line-height:1.6}
form.add{display:flex;gap:6px;margin:6px 0 4px}
form.add input{flex:1;min-width:0;font:inherit;font-family:var(--body);font-size:14px;padding:7px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
form.add button{font:inherit;font-size:13px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:0 12px;cursor:pointer}
.note{font-size:11px;color:var(--sub);margin-top:14px;line-height:1.6;font-family:var(--body)}
</style>

<div class="app">
  <header>
    <div><h1>はしぐち村</h1><div class="date" id="date"></div></div>
    <div class="hud"><span class="pill" id="coin">🌰 0</span><button class="btn-s" id="replay" type="button">ほうこくをきく</button><button class="btn-s" id="wake" type="button" aria-label="画面をつけっぱなしにする">💡</button></div>
  </header>
  <div class="stage" id="stage"><canvas id="cv" width="224" height="140" aria-label="はしぐち村のようす"></canvas></div>
  <div class="win" id="win">
    <div class="tag"><img id="tagImg" alt=""><span id="tagName">ちいかわ</span></div>
    <div class="head" id="dHead"></div>
    <div class="ttl" id="dTitle"></div>
    <div class="txt" id="dText">（村とつながっています…）</div>
    <div class="acts" id="dActs"></div>
    <span class="more" id="more" hidden>▼</span>
  </div>

  <section class="box" aria-labelledby="h-prop">
    <h2 id="h-prop">💡 なかまの提案 <small id="pcnt"></small></h2>
    <div id="props"><p class="empty">なかまが「これやろうと思うんだけど、どう？」と相談しにきます。</p></div>
  </section>

  <section class="box mtg" aria-labelledby="h-mtg">
    <h2 id="h-mtg">🪵 なかまの会議 <small id="mtime"></small></h2>
    <div id="mtg"><p class="empty">なかまが集まって話し合うと、ここに議事録が届きます。</p></div>
  </section>

  <section class="box" aria-labelledby="h-box">
    <h2 id="h-box">📮 ほうこく箱 <small id="cnt"></small></h2>
    <div class="prog"><i id="bar"></i></div>
    <div class="sched" id="sched"></div>
    <div id="att"><p class="empty">ちいかわからのほうこくがここに届きます。</p></div>
    <h3>片づいたこと</h3>
    <div id="res"></div>
  </section>

  <section class="box" aria-labelledby="h-mine">
    <h2 id="h-mine">🧑‍🌾 そーやんの仕事 <small id="mcnt"></small></h2>
    <form class="add" id="addForm"><input id="taskIn" placeholder="いまからやること（例：アンケートに答える）" aria-label="やることを追加" autocomplete="off"><button type="submit">追加</button></form>
    <div id="mine"><p class="empty">やることを追加して、終わったらチェック。なかまが一緒によろこびます。</p></div>
  </section>
  <p class="note" id="note"></p>
</div>

function update(dt){

  AGENTS.forEach(id=>{const e=ent[id];
    if(e.st==='walkIn'){e.walking=true;e.pose='idle';if(stepTo(e,SPEAK.x,SPEAK.y,dt)){e.walking=false;e.face=-1;e.st='arrive';e.t=0}}
    else if(e.st==='arrive'&&e.t>0.7){e.st='talk';if(scene&&speaker===id)showPage()}
    else if(e.st==='walkOut'){e.walking=true;e.pose='idle';const h=homeOf(id);if(stepTo(e,h.x,h.y,dt)){e.walking=false;e.face=h.face;e.st='home';e.t=0}}
    else if(e.st==='toMeet'){e.walking=true;e.pose='idle';const m=MEET[id];if(stepTo(e,m.x,m.y,dt)){e.walking=false;e.face=m.face;e.st='meet';if(scene&&scene.type==='meeting'&&!scene.started&&AGENTS.every(k=>ent[k].st==='meet')){scene.started=true;pi=0;showPage()}}}

}

function goPage(){const p=pages[pi];if(!p)return;
  if(scene.type==='talk'&&p.who&&p.who!==speaker){if(speaker&&ent[speaker].st!=='home')ent[speaker].st='walkOut';speaker=p.who;
    speakerLabel=scene.label||'✉️ ほうこく';speakerIcon=scene.icon||'letter';const e=ent[speaker];e.st='walkIn';
    setText('','',`（${NAMES[speaker]}がやってくる…）`,speaker);$('dActs').innerHTML='';$('more').hidden=true;return}
  showPage()}

  typing=setInterval(()=>{n+=2;$('dText').textContent=full.slice(0,n);if(n>=full.length){clearInterval(typing);typing=null;renderActs(true)}},26)}
function renderActs(ready){const a=$('dActs'),p=pages[pi];if(!ready||!p){a.innerHTML='';return}
  let h='';const r=p.rid&&REPORTS.find(x=>x.id===p.rid),pr=p.pid&&PROPS.find(x=>x.id===p.pid);
  if(r&&r.kind==='question'&&Array.isArray(r.choices))h+=r.choices.map((c,i)=>`<button type="button" class="choice" data-act="ans" data-i="${i}" aria-pressed="${r.answer===c}">${esc(c)}</button>`).join('');
  else if(r)h+=`<button type="button" class="ok" data-act="done" aria-pressed="${!!r.done}">${r.done?'✅ やった！':'✅ やった'}</button>`;
  if(pr&&pr.status==='proposed')h+=`<button type="button" class="ok" data-act="yes">👍 やってみて</button><button type="button" data-act="no">🙅 今回はなし</button>`;
  else if(pr&&p.ask)h+=`<button type="button" class="choice" aria-pressed="true" disabled>${pr.status==='rejected'?'🙅 今回はなし':'👍 おねがいした'}</button>`;
  const link=safeUrl((r&&r.link)||(p.link));if(link)h+=`<a href="${esc(link)}" target="_blank" rel="noopener">ひらく ↗</a>`;
  h+=p.end?`<button type="button" data-act="close">とじる</button>`:`<button type="button" data-act="next">つぎへ ▶</button>`;
  a.innerHTML=h;$('more').hidden=!!p.end}
function next(){if(typing){clearInterval(typing);typing=null;$('dText').textContent=full;renderActs(true);return}
  if(pi<pages.length-1){pi++;goPage();if(pages[pi]&&pages[pi].end&&speaker){ent[speaker].pose='happy';ent[speaker].jump=1;setTimeout(()=>{if(ent[speaker||'chiikawa'])ent[speaker||'chiikawa'].pose='idle'},900)}}else endScene()}

  if(scene.type==='meeting')AGENTS.forEach(id=>{ent[id].st='walkOut'});else if(speaker)ent[speaker].st='walkOut';
  speaker=null;scene=null;nextScene()}

  if(act==='ans'&&p.rid){const r=REPORTS.find(x=>x.id===p.rid);await setReport(p.rid,{answer:r.choices[+b.dataset.i],done:true});renderActs(true);flash('わかった…！ つたえておく…！')}
  if((act==='yes'||act==='no')&&p.pid){await decide(p.pid,act==='yes'?'approved':'rejected');renderActs(true);flash(act==='yes'?'ありがと！ やってみる！':'わかった！ またほかのこと考えるね')}});
function flash(t){const keep=full;$('dText').textContent=t;setTimeout(()=>{if(pages[pi]&&!typing)$('dText').textContent=keep},1500)}

// ---------- 場面をつくる ----------
function briefScene(force){const list=attention().filter(r=>!r.done);if(!force&&!list.length&&!resolved().length)return null;
  const p=[{who:'chiikawa',text:STATUS.greeting||'そーやん…！ ほうこく、もってきた…！'}];
  if(STATUS.schedule&&STATUS.schedule.length)p.push({who:'chiikawa',head:'きょうのよてい',text:STATUS.schedule.map(s=>`${s.time}  ${s.title}`).join('\n')});
  list.forEach((r,i)=>p.push({who:'chiikawa',head:r.kind==='question'?'ちいかわからのしつもん':`きにかけたいこと ${i+1}/${list.length}`,title:r.title,text:r.body,rid:r.id}));
  if(!list.length)p.push({who:'chiikawa',text:'いま、きにかけることはない…！'});
  const res=resolved();if(res.length)p.push({who:'chiikawa',head:'いいしらせ',text:'かたづいたことも、あった…！\n'+res.map(r=>'・'+r.title).join('\n')});
  p.push({who:'chiikawa',text:'ほうこく、おわり…！',end:true});return {type:'talk',pages:p,label:'✉️ ほうこく'}}
function reportScene(list){const p=[{who:'chiikawa',text:'そーやん…！ あたらしいほうこく…！'}];
  list.forEach((r,i)=>p.push({who:'chiikawa',head:r.kind==='question'?'ちいかわからのしつもん':`あたらしいほうこく ${i+1}/${list.length}`,title:r.title,text:r.body,rid:r.id}));
  p.push({who:'chiikawa',text:'ほうこく、おわり…！',end:true});return {type:'talk',pages:p,label:'✉️ ほうこく'}}
function propScene(list){const p=[];list.forEach(x=>{
  p.push({who:x.agent,head:`${NAMES[x.agent]||''}からの相談`,title:x.title,text:`${x.why||''}${x.plan?`\n\nやること：${x.plan}`:''}\n\nこれやろうと思うんだけど、どうかな？`,pid:x.id,ask:true})});
  p.push({who:list[list.length-1].agent,text:'きいてくれて、ありがと！',end:true});return {type:'talk',pages:p,label:'💡 そうだん',icon:'bulb'}}
function resultScene(list){const p=[];list.forEach(x=>{p.push({who:x.agent,head:'できたよ！',title:x.title,text:x.result||'できあがりました。',link:x.link});});
  p.push({who:list[list.length-1].agent,text:'つぎもがんばる！',end:true});return {type:'talk',pages:p,label:'🎁 できた！',onEnd:()=>list.forEach(x=>markSeen('done:'+x.id))}}
function meetingScene(m){const lines=(m.lines||[]).filter(l=>NAMES[l.who]&&ent[l.who]);if(!lines.length)return null;
  const p=lines.map(l=>({who:l.who,head:'🪵 '+(m.title||'なかまの会議'),text:l.text}));
  if(m.decisions&&m.decisions.length)p.push({who:'hachiware',head:'きまったこと',text:m.decisions.map(d=>'・'+d).join('\n')});
  p.push({who:'hachiware',text:'会議おわり！ それぞれの仕事にもどろー！',end:true});return {type:'meeting',pages:p,onEnd:()=>markSeen('m:'+m.id)}}

// ---------- 書き込み ----------
async function write(col,id,patch){if(!db||!canWrite)return;try{await db.collection(col).doc(id).update(patch)}catch(e){if(e&&e.code==='invalid_argument'){canWrite=false;$('note').textContent='この画面では保存できません。'}}}
function cheer(id,big){const e=ent[id];if(!e)return;e.jump=1;const prev=e.pose;e.pose='happy';setTimeout(()=>{if(e.pose==='happy')e.pose=e.st==='home'?'work':'idle'},1000);floater('+10🌰',e);
  if(big)AGENTS.forEach(k=>{if(k!==id){ent[k].jump=1}})}
function floater(text,e){const f=document.createElement('div');f.className='floater';f.textContent=text;f.style.left=(e.x/W*100)+'%';f.style.top=((e.y-24)/H*100)+'%';stage.appendChild(f);setTimeout(()=>f.remove(),1300)}
async function setReport(id,patch){const r=REPORTS.find(x=>x.id===id);if(!r)return;Object.assign(r,patch);if(patch.done)cheer('chiikawa');renderBox();await write('reports',id,patch)}
async function decide(id,status,reply){const x=PROPS.find(p=>p.id===id);if(!x)return;const patch={status,decidedAt:Date.now()};if(reply)patch.reply=reply.slice(0,300);Object.assign(x,patch);
  if(status==='approved')cheer(x.agent);renderProps();await write('proposals',id,patch)}
async function setTask(id,patch){const t=TASKS.find(x=>x.id===id);if(!t)return;Object.assign(t,patch);if(patch.done)cheer('soyan',true);renderMine();$('coin').textContent='🌰 '+coins();await write('tasks',id,patch)}
$('addForm').addEventListener('submit',async e=>{e.preventDefault();const v=$('taskIn').value.trim();if(!v)return;$('taskIn').value='';
  const t={title:v.slice(0,120),done:false,createdAt:Date.now()};
  if(db&&canWrite){try{const ref=await db.collection('tasks').add(t);if(!TASKS.find(x=>x.id===ref.id)){TASKS.push({id:ref.id,...t});renderMine()}}catch(err){TASKS.push({id:'local'+Date.now(),...t});renderMine()}}
  else{TASKS.push({id:'local'+Date.now(),...t});renderMine()}floater('📝',ent.soyan)});

// ---------- 一覧の描画 ----------
const tlink=r=>{const u=safeUrl(r.link);return u?`<a class="t" href="${esc(u)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:`<span class="t">${esc(r.title)}</span>`};
const CHIP={proposed:'相談中',approved:'おねがいした',doing:'とりかかり中',done:'できた',rejected:'見送り'};
function fmt(ms){if(!ms)return '';const d=new Date(ms);return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`}
function renderProps(){const list=PROPS.filter(p=>p.status!=='rejected').sort((a,b)=>{const o={proposed:0,approved:1,doing:1,done:2};return (o[a.status]??3)-(o[b.status]??3)||(b.createdAt||0)-(a.createdAt||0)}).slice(0,12);
  $('pcnt').textContent=PROPS.filter(p=>p.status==='proposed').length?`${PROPS.filter(p=>p.status==='proposed').length}件 相談中`:'';
  $('props').innerHTML=list.length?list.map(p=>`<div class="card"><div class="ava"><img src="${ICON[p.agent]||ICON.chiikawa}" alt=""></div><div style="min-width:0">
    <div class="who">${esc(NAMES[p.agent]||p.agent)}<span class="chip ${esc(p.status)}">${esc(CHIP[p.status]||p.status)}</span><span>${fmt(p.createdAt)}</span></div>
    <div class="t">${esc(p.title)}</div><p>${esc(p.why||'')}</p>${p.plan?`<p class="plan">やること：${esc(p.plan)}</p>`:''}
    ${p.status==='proposed'?`<div class="row"><button type="button" class="yes" data-p="${esc(p.id)}" data-s="approved">👍 やってみて</button><button type="button" data-p="${esc(p.id)}" data-s="rejected">🙅 今回はなし</button></div>
      <div class="row"><input id="rp-${esc(p.id)}" placeholder="ひとこと添える（任意）" aria-label="ひとこと"><button type="button" data-p="${esc(p.id)}" data-s="approved" data-r="1">これでおねがい</button></div>`:''}
    ${p.reply?`<p>そーやん：${esc(p.reply)}</p>`:''}
    ${p.status==='done'&&p.result?`<details class="result"><summary>できたものを見る</summary><p>${esc(p.result)}</p>${safeUrl(p.link)?`<p><a href="${esc(p.link)}" target="_blank" rel="noopener">ひらく ↗</a></p>`:''}</details>`:''}
  </div></div>`).join(''):'<p class="empty">なかまが「これやろうと思うんだけど、どう？」と相談しにきます。</p>'}
$('props').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(!b)return;const id=b.dataset.p;const inp=document.getElementById('rp-'+id);
  decide(id,b.dataset.s,b.dataset.r&&inp?inp.value.trim():'');if(pages[pi]&&pages[pi].pid===id)renderActs(!typing)});
function renderMeeting(){const m=MEETS.slice().sort(byTime).pop();if(!m){return}
  $('mtime').textContent=fmt(m.createdAt);
  $('mtg').innerHTML=`<div class="t" style="font-size:15px">${esc(m.title||'なかまの会議')}</div>`+
    (m.lines||[]).slice(0,8).map(l=>`<div class="line"><img src="${ICON[l.who]||ICON.chiikawa}" alt="${esc(NAMES[l.who]||'')}"><div>${esc(l.text)}</div></div>`).join('')+
    (m.decisions&&m.decisions.length?`<div class="dec">きまったこと<ul>${m.decisions.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`:'')+
    `<div class="row"><button type="button" id="watchMtg">▶ 会議のようすを見る</button></div>`;
  $('watchMtg').onclick=()=>enqueue(meetingScene(m))}
function renderBox(){const att=attention(),res=resolved();
  $('sched').innerHTML=(STATUS.schedule||[]).map(s=>`<span>⏰ ${esc(s.time)} ${esc(s.title)}</span>`).join('');
  $('att').innerHTML=att.length?att.map(r=>`<div class="item${r.done?' done':''}"><input type="checkbox" id="r-${esc(r.id)}" data-r="${esc(r.id)}" ${r.done?'checked':''} aria-label="やった：${esc(r.title)}">
    <div>${tlink(r)}<p>${esc(r.body||'')}</p>${r.answer?`<span class="ans">こたえ：${esc(r.answer)}</span>`:''}</div></div>`).join(''):'<p class="empty">ちいかわからのほうこくがここに届きます。</p>';
  $('res').innerHTML=res.length?res.map(r=>`<div class="item done"><span aria-hidden="true">✔</span><div>${tlink(r)}<p>${esc(r.body||'')}</p></div></div>`).join(''):'<p class="empty">まだありません。</p>';
  const n=att.filter(r=>r.done).length;$('cnt').textContent=`${n} / ${att.length} 片づいた`;
  $('bar').style.width=(att.length?n/att.length*100:0)+'%';$('coin').textContent='🌰 '+coins()}
function renderMine(){const ts=TASKS.slice().sort(byTime);
  $('mine').innerHTML=ts.length?ts.map(t=>`<div class="item${t.done?' done':''}"><input type="checkbox" id="t-${esc(t.id)}" data-t="${esc(t.id)}" ${t.done?'checked':''} aria-label="できた：${esc(t.title)}"><div><span class="t">${esc(t.title)}</span></div></div>`).join(''):'<p class="empty">やることを追加して、終わったらチェック。なかまが一緒によろこびます。</p>';
  const n=ts.filter(t=>t.done).length;$('mcnt').textContent=ts.length?`${n} / ${ts.length} できた`:''}
function renderStatus(){const d=new Date();$('date').textContent=STATUS.dateLabel||`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  $('note').textContent=(STATUS.note||'')+(STATUS.updatedAt?`　最終更新：${fmt(STATUS.updatedAt)}`:'');renderBox()}
$('att').addEventListener('change',e=>{const id=e.target.dataset.r;if(id){const r=REPORTS.find(x=>x.id===id);setReport(id,{done:!r.done});if(pages[pi]&&pages[pi].rid===id)renderActs(!typing)}});
$('mine').addEventListener('change',e=>{const id=e.target.dataset.t;if(id){const t=TASKS.find(x=>x.id===id);setTask(id,{done:!t.done})}});
$('replay').addEventListener('click',()=>enqueue(briefScene(true)));
let lock=null;$('wake').addEventListener('click',async()=>{try{if(lock){await lock.release();lock=null;$('wake').textContent='💡'}else{lock=await navigator.wakeLock.request('screen');$('wake').textContent='🔆'}}catch(e){lock=null;$('wake').textContent='💡'}});
renderStatus();renderMine();idle();

// ---------- つながる ----------
(async()=>{const cl=window.claude;db=cl?await cl.use('db'):null;
  if(!db){setText('','','（この画面では村のデータを読めません。Claudeのアプリかブラウザで開いてください）','chiikawa');$('dActs').innerHTML='';return}
  try{const u=await cl.use('user');if(u){const w=await u.can('data.write');if(w===false)canWrite=false}}catch(e){}
  const ready={reports:false,proposals:false,meetings:false};let booted=false;
  function boot(){if(booted||!Object.values(ready).every(Boolean))return;booted=true;
    enqueue(briefScene(false));
    const m=MEETS.slice().sort(byTime).pop();if(m&&!seen['m:'+m.id]&&Date.now()-(m.createdAt||0)<36*3600e3)enqueue(meetingScene(m));
    const dn=PROPS.filter(p=>p.status==='done'&&!seen['done:'+p.id]);if(dn.length)enqueue(resultScene(dn));
    const pend=PROPS.filter(p=>p.status==='proposed').sort(byTime);if(pend.length)enqueue(propScene(pend));
    if(!scene)idle()}
  const live=(s)=>s.docChanges().filter(c=>!c.doc.metadata.hasPendingWrites);
  db.doc('status/now').onSnapshot(s=>{STATUS=s.exists?s.data():{};renderStatus()},()=>{});
  db.collection('tasks').onSnapshot(s=>{TASKS=s.docs.map(d=>({id:d.id,...d.data()}));renderMine();$('coin').textContent='🌰 '+coins()},()=>{});
  db.collection('reports').onSnapshot(s=>{REPORTS=s.docs.map(d=>({id:d.id,...d.data()})).sort(byTime);renderBox();
    if(!ready.reports){if(!s.metadata.fromCache||REPORTS.length){ready.reports=true;boot()}return}
    const add=live(s).filter(c=>c.type==='added').map(c=>({id:c.doc.id,...c.doc.data()})).filter(r=>r.kind!=='resolved');if(add.length)enqueue(reportScene(add))},()=>{});
  db.collection('proposals').onSnapshot(s=>{PROPS=s.docs.map(d=>({id:d.id,...d.data()}));renderProps();$('coin').textContent='🌰 '+coins();
    if(!ready.proposals){if(!s.metadata.fromCache||PROPS.length){ready.proposals=true;boot()}return}
    const ch=live(s).map(c=>({type:c.type,...c.doc.data(),id:c.doc.id}));
    const np=ch.filter(c=>c.type==='added'&&c.status==='proposed');if(np.length)enqueue(propScene(np));
    const dn=ch.filter(c=>c.status==='done'&&!seen['done:'+c.id]);if(dn.length)enqueue(resultScene(dn))},()=>{});
  db.collection('meetings').onSnapshot(s=>{MEETS=s.docs.map(d=>({id:d.id,...d.data()}));renderMeeting();
    if(!ready.meetings){if(!s.metadata.fromCache||MEETS.length){ready.meetings=true;boot()}return}
    live(s).filter(c=>c.type==='added').forEach(c=>{const m={id:c.doc.id,...c.doc.data()};if(!seen['m:'+m.id])enqueue(meetingScene(m))})},()=>{});
  setTimeout(()=>{ready.reports=ready.proposals=ready.meetings=true;boot()},6000);
})();
</script>
