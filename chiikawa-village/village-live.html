<title>ちいかわ株式会社</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* layout: 1カラム。会社の敷地（ドット）→ 会話窓 → ダイジェスト → 例外カード → タスクボード → 記録監査 → つぶやき → 自分の仕事 → 役割名簿 → 決定記録 */
:root{--bg:#fbf5e8;--panel:#fffdf7;--ink:#3a3330;--sub:#857a70;--line:#e9dcc6;--accent:#e9829b;--good:#4f8f4a;--warn:#b7791f;--bad:#c2463d;--info:#3f6fd8;
  --win:#2b2a3a;--win-edge:#6b6a86;--win-ink:#fbf7ef;--win-hi:#fff3b0;--bub:#ffffff;--bub-ink:#3a3330;
  --dot:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;--body:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a18;--panel:#2a2522;--ink:#f3ebe3;--sub:#b3a79c;--line:#41382f;--good:#8fd18a;--warn:#e7b04a;--bad:#f08a80;--info:#8fb0f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1a18;--panel:#2a2522;--ink:#f3ebe3;--sub:#b3a79c;--line:#41382f;--good:#8fd18a;--warn:#e7b04a;--bad:#f08a80;--info:#8fb0f5;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--dot)}
.app{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .date{font-size:12px;color:var(--sub)}
.hud{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.btn-s,.pill a{font:inherit;font-size:12px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;white-space:nowrap;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{position:relative;border:3px solid #3b3533;border-radius:6px 6px 0 0;overflow:hidden;background:#a6d37f}
.stage canvas{display:block;width:100%;max-width:100%;image-rendering:pixelated}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--bub);color:var(--bub-ink);border:1.5px solid #3b3533;border-radius:6px;padding:1px 5px;font-size:clamp(9px,2.5vw,11px);line-height:1.35;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .2s}
.bub.soyan{background:#fff6d6}.bub.bench{background:#eef0f4;color:#5b6070}
.bub[data-empty="1"]{opacity:0}
.plc{position:absolute;transform:translate(-50%,0);font-size:clamp(8px,2.1vw,10px);color:#2f3a24;background:rgba(255,255,255,.55);border-radius:4px;padding:0 3px;pointer-events:none;white-space:nowrap}
.floater{position:absolute;transform:translate(-50%,-100%);font-size:14px;color:#fff;text-shadow:0 1px 0 #3b3533,1px 0 0 #3b3533,-1px 0 0 #3b3533,0 -1px 0 #3b3533;pointer-events:none;animation:up 1.2s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-220%);opacity:0}}
.win{background:var(--win);color:var(--win-ink);border:3px solid #3b3533;border-top:0;border-radius:0 0 6px 6px;padding:12px 14px;min-height:160px;position:relative;box-shadow:inset 0 0 0 3px var(--win-edge)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--win-edge);border-radius:6px;padding:2px 8px 2px 4px;margin-bottom:8px}
.tag img{width:20px;height:20px;image-rendering:pixelated}
.tag .role{font-size:10px;border-radius:999px;padding:0 7px;color:#fff;background:var(--rc,#857a70)}
.head{font-size:11px;color:#c9c5e6;letter-spacing:.06em}
.ttl{font-size:16px;margin:2px 0 4px;color:var(--win-hi);text-wrap:balance}
.txt{font-size:14px;line-height:1.75;white-space:pre-wrap;min-height:3em;cursor:pointer;overflow-wrap:anywhere}
.more{position:absolute;right:14px;bottom:10px;animation:blink 1s steps(2) infinite;font-size:12px}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.more{animation:none}.floater{animation-duration:.01s}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts button,.acts a{font:inherit;font-size:13px;border-radius:8px;padding:6px 12px;border:2px solid var(--win-ink);background:transparent;color:var(--win-ink);cursor:pointer;text-decoration:none}
.acts .choice{border-color:var(--win-hi);color:var(--win-hi)}
.acts .choice[aria-pressed="true"]{background:var(--win-hi);color:var(--win)}
.box{margin-top:16px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px 14px}
.box h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box h2 small{font-size:12px;color:var(--sub);font-weight:400;font-variant-numeric:tabular-nums}
.empty{font-size:13px;color:var(--sub);padding:6px 0;font-family:var(--body);line-height:1.6;margin:0}
.dg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:420px){.dg{grid-template-columns:minmax(0,1fr)}}
.dgc{border:2px solid var(--line);border-radius:8px;padding:8px 10px;border-left:5px solid var(--c)}
.dgc b{font-size:13px;display:flex;justify-content:space-between}
.dgc ul{margin:4px 0 0;padding-left:16px;font-family:var(--body);font-size:12.5px;line-height:1.6;color:var(--ink)}
.dgc .none{font-family:var(--body);font-size:12px;color:var(--sub);margin-top:4px}
.xc{border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.xc.done{opacity:.7}
.xc .q{font-size:15px}
.xc p{margin:4px 0 0;font-family:var(--body);font-size:12.5px;color:var(--sub);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.xc .opts{display:grid;gap:6px;margin-top:8px}
.xc .opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;text-align:left;font:inherit;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:6px 8px;cursor:pointer}
.xc .opt b{font-size:14px;text-align:center}
.xc .opt span{font-family:var(--body);font-size:12.5px;line-height:1.55}
.xc .opt[aria-pressed="true"]{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.xc .rec{font-size:12px;color:var(--info);margin-top:6px;font-family:var(--body)}
.lanes{display:grid;gap:10px}
.lane h3{font-size:12.5px;margin:0 0 4px;color:var(--sub);font-weight:400;display:flex;gap:6px;align-items:center}
.lane h3 i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c)}
.tk{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.tk img{width:24px;height:24px;image-rendering:pixelated}
.tk .t{font-size:14px;overflow-wrap:anywhere}
.tk .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:10.5px;border-radius:999px;padding:0 7px;border:1.5px solid var(--line);color:var(--sub);white-space:nowrap}
.chip.pass{border-color:var(--good);color:var(--good)}.chip.fail{border-color:var(--bad);color:var(--bad)}.chip.inc{border-color:var(--warn);color:var(--warn)}
.chip.appr{border-color:var(--bad);color:var(--bad)}.chip.so{border-color:var(--info);color:var(--info)}
.tk p{margin:3px 0 0;font-family:var(--body);font-size:12px;color:var(--sub);line-height:1.55;overflow-wrap:anywhere}
.tk a{color:var(--info)}
.au h4{font-size:12.5px;margin:10px 0 2px;color:var(--sub);font-weight:400}
.au p{margin:0;font-family:var(--body);font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.item{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px;padding:8px 0;border-top:1px dashed var(--line)}
.item input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:#6aa56a}
.item .t{font-size:14px;overflow-wrap:anywhere}
.item.done .t{color:var(--sub);text-decoration:line-through}
form.add{display:flex;gap:6px;margin:6px 0 4px}
form.add input{flex:1;min-width:0;font-family:var(--body);font-size:14px;padding:7px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.bt{font:inherit;font-size:13px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:0 12px;cursor:pointer}
.notef{display:grid;gap:6px}
.notef textarea{width:100%;min-height:70px;resize:vertical;font-family:var(--body);font-size:14px;line-height:1.6;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.notef .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.notef select{font-family:var(--body);font-size:13px;padding:6px 8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.notef .bt{padding:6px 12px}
.nt{padding:9px 0;border-top:1px dashed var(--line)}
.nt .meta{font-size:11px;color:var(--sub)}
.nt .q{font-family:var(--body);font-size:13.5px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.nt .rep{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;margin-top:6px;font-family:var(--body);font-size:12.5px;line-height:1.55}
.nt .rep img{width:20px;height:20px;image-rendering:pixelated}
.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:420px){.roster{grid-template-columns:minmax(0,1fr)}}
.mem{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;border:2px solid var(--line);border-radius:10px;padding:8px}
.mem.bench{opacity:.72}
.mem img{width:32px;height:32px;image-rendering:pixelated}
.mem .nm{font-size:14px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.role{font-size:10.5px;border-radius:999px;padding:0 7px;color:#fff;background:var(--rc,#857a70);white-space:nowrap}
.mem .ask{font-size:11.5px;color:var(--sub);font-family:var(--body);line-height:1.5;margin-top:2px}
.mem .now{font-size:11px;font-family:var(--body);margin-top:3px}
.so-list{margin:10px 0 0;padding:0;list-style:none;font-family:var(--body);font-size:12.5px;line-height:1.6}
.so-list li{padding:4px 0;border-top:1px dashed var(--line)}
.dec{padding:7px 0;border-top:1px dashed var(--line)}
.dec .t{font-size:13.5px}
.dec p{margin:2px 0 0;font-family:var(--body);font-size:12px;color:var(--sub);line-height:1.55}
.note{font-size:11px;color:var(--sub);margin-top:14px;line-height:1.6;font-family:var(--body)}
.note a{color:var(--info)}
</style>

<div class="app">
  <header>
    <div><h1>ちいかわ株式会社</h1><div class="date" id="date"></div></div>
    <div class="hud"><span class="pill" id="phase">フェーズ0</span><button class="btn-s" id="replay" type="button">ダイジェストをきく</button><button class="btn-s" id="wake" type="button" aria-label="画面をつけっぱなしにする">💡</button></div>
  </header>
  <div class="stage" id="stage"><canvas id="cv" width="224" height="140" aria-label="ちいかわ株式会社の敷地のようす"></canvas></div>
  <div class="win" id="win">
    <div class="tag"><img id="tagImg" alt=""><span id="tagName">ちいかわ</span><span class="role" id="tagRole"></span></div>
    <div class="head" id="dHead"></div>
    <div class="ttl" id="dTitle"></div>
    <div class="txt" id="dText">（会社とつながっています…）</div>
    <div class="acts" id="dActs"></div>
    <span class="more" id="more" hidden>▼</span>
  </div>

  <section class="box" aria-labelledby="h-dg"><h2 id="h-dg">📬 きょうのダイジェスト <small id="dgTime"></small></h2><div class="dg" id="digest"></div></section>
  <section class="box" aria-labelledby="h-xc"><h2 id="h-xc">🃏 判断してほしいこと <small id="xcCnt"></small></h2><div id="xcs"><p class="empty">判断が必要なことがあると、ちいかわが例外カードを届けます。</p></div></section>
  <section class="box" aria-labelledby="h-bd"><h2 id="h-bd">📋 タスクボード <small id="bdCnt"></small></h2><div class="lanes" id="board"><p class="empty">ハチワレが起票したタスクがここに並びます。</p></div></section>
  <section class="box au" aria-labelledby="h-au"><h2 id="h-au">🗂 記録監査（シーサー） <small id="auTime"></small></h2><div id="audit"><p class="empty">シーサーが毎週、Notion の記録と実際の進み具合を点検します。</p></div></section>
  <section class="box" aria-labelledby="h-nt">
    <h2 id="h-nt">💭 つぶやき箱 <small id="ntCnt"></small></h2>
    <form class="notef" id="noteForm"><textarea id="noteIn" placeholder="悩んでいること、思いついたこと、頼みたいこと。なんでもどうぞ。" aria-label="つぶやき"></textarea>
      <div class="row"><label for="noteTo" style="font-size:12px;color:var(--sub)">だれに：</label><select id="noteTo"></select><button type="submit" class="bt">とどける</button></div></form>
    <div id="notes"></div>
  </section>
  <section class="box" aria-labelledby="h-mine">
    <h2 id="h-mine">🧑‍🌾 そーやんの仕事 <small id="mcnt"></small></h2>
    <form class="add" id="addForm"><input id="taskIn" placeholder="いまからやること" aria-label="やることを追加" autocomplete="off"><button type="submit" class="bt">追加</button></form>
    <div id="mine"><p class="empty">自分の仕事を書いておくと、ハチワレが段取りに入れます。</p></div>
  </section>
  <section class="box" aria-labelledby="h-rs"><h2 id="h-rs">👥 役割名簿</h2><div class="roster" id="roster"></div>
    <h2 style="margin-top:14px">📋 常時発注リスト <small>確認なしで進める仕事</small></h2><ul class="so-list" id="standing"></ul></section>
  <section class="box" aria-labelledby="h-dc"><h2 id="h-dc">🧾 決定記録</h2><div id="decs"><p class="empty">決まったことがここに残ります。</p></div></section>
  <p class="note" id="note"></p>
</div>

  const live=s=>s.docChanges().filter(c=>!c.doc.metadata.hasPendingWrites);
  db.doc('status/now').onSnapshot(s=>{STATUS=s.exists?s.data():{};renderStatus();if(!ready.status&&(!s.metadata.fromCache||s.exists)){ready.status=true;boot()}},()=>{});
  db.collection('board').onSnapshot(s=>{BOARD=s.docs.map(d=>({id:d.id,...d.data()}));renderBoard()},()=>{});
  db.collection('exceptions').onSnapshot(s=>{XCS=s.docs.map(d=>({id:d.id,...d.data()}));renderXcs();
    if(!ready.ex){if(!s.metadata.fromCache||XCS.length){ready.ex=true;boot()}return}
    const add=live(s).filter(c=>c.type==='added').map(c=>({id:c.doc.id,...c.doc.data()})).filter(x=>x.status!=='answered');if(add.length)enqueue(xcScene(add))},()=>{});
  db.collection('audits').onSnapshot(s=>{AUDITS=s.docs.map(d=>({id:d.id,...d.data()}));renderAudit()},()=>{});
  db.collection('decisions').onSnapshot(s=>{DECS=s.docs.map(d=>({id:d.id,...d.data()}));renderDecs()},()=>{});
  db.collection('notes').onSnapshot(s=>{NOTES=s.docs.map(d=>({id:d.id,...d.data()}));renderNotes()},()=>{});
  db.collection('tasks').onSnapshot(s=>{TASKS=s.docs.map(d=>({id:d.id,...d.data()}));renderMine()},()=>{});
  setTimeout(()=>{ready.status=ready.ex=true;boot()},6000);
})();
</script>
