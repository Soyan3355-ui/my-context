<title>はしぐち村</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* layout: 1カラム。上に村のドット画面、その下にRPGの会話窓、ほうこく箱、そーやんの仕事 */
:root{--bg:#fbf5e8;--panel:#fffdf7;--ink:#3a3330;--sub:#857a70;--line:#e9dcc6;--accent:#e9829b;--good:#5f9d5a;--win:#2b2a3a;--win-edge:#6b6a86;--win-ink:#fbf7ef;--win-hi:#fff3b0;--dot:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;--body:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a18;--panel:#2a2522;--ink:#f3ebe3;--sub:#b3a79c;--line:#41382f;--good:#8fd18a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1a18;--panel:#2a2522;--ink:#f3ebe3;--sub:#b3a79c;--line:#41382f;--good:#8fd18a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--dot)}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .date{font-size:12px;color:var(--sub)}
.hud{display:flex;gap:6px;align-items:center}
.pill{font-size:13px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn-s{font:inherit;font-size:12px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;white-space:nowrap}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.doing{font-size:12px;color:var(--sub);margin:0 0 6px;min-height:1.4em}
.doing b{color:var(--ink);font-weight:400}
.stage{position:relative;border:3px solid #3b3533;border-radius:6px 6px 0 0;overflow:hidden;background:#a6d37f}
.stage canvas{display:block;width:100%;max-width:100%;image-rendering:pixelated}
.floater{position:absolute;transform:translate(-50%,-100%);font-size:14px;color:#fff;text-shadow:0 1px 0 #3b3533,1px 0 0 #3b3533,-1px 0 0 #3b3533,0 -1px 0 #3b3533;pointer-events:none;animation:up 1.2s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-220%);opacity:0}}
.win{background:var(--win);color:var(--win-ink);border:3px solid #3b3533;border-top:0;border-radius:0 0 6px 6px;padding:12px 14px;min-height:170px;position:relative;box-shadow:inset 0 0 0 3px var(--win-edge)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--win-edge);border-radius:6px;padding:2px 8px 2px 4px;margin-bottom:8px}
.tag img{width:20px;height:20px;image-rendering:pixelated}
.head{font-size:11px;color:#c9c5e6;letter-spacing:.06em}
.ttl{font-size:16px;margin:2px 0 4px;color:var(--win-hi);text-wrap:balance}
.txt{font-size:14px;line-height:1.75;white-space:pre-wrap;min-height:3.5em;cursor:pointer}
.more{position:absolute;right:14px;bottom:10px;animation:blink 1s steps(2) infinite;font-size:12px}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.more{animation:none}.floater{animation-duration:.01s}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts button,.acts a{font:inherit;font-size:13px;border-radius:8px;padding:6px 12px;border:2px solid var(--win-ink);background:transparent;color:var(--win-ink);cursor:pointer;text-decoration:none}
.acts .ok{background:#f19bb0;border-color:#f19bb0;color:var(--win)}
.acts .ok[aria-pressed="true"]{background:#8fd18a;border-color:#8fd18a}
.acts .choice{border-color:var(--win-hi);color:var(--win-hi)}
.acts .choice[aria-pressed="true"]{background:var(--win-hi);color:var(--win)}
.box{margin-top:18px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px 14px}
.box h2{font-size:15px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box h2 small{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.box h3{font-size:13px;margin:14px 0 2px;color:var(--sub);font-weight:400;letter-spacing:.04em}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}
.item{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px;padding:9px 0;border-top:1px dashed var(--line)}
.item input{width:18px;height:18px;margin:2px 0 0;accent-color:#6aa56a}
.item .t{font-size:14px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
a.t:hover{text-decoration:underline}
.item.done .t{color:var(--sub);text-decoration:line-through}
.item p{margin:3px 0 0;font-size:12.5px;color:var(--sub);line-height:1.6;font-family:var(--body);overflow-wrap:anywhere}
.item .ans{display:inline-block;margin-top:4px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.sched{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sched span{font-size:12px;border:2px solid var(--line);border-radius:6px;padding:2px 7px}
.empty{font-size:13px;color:var(--sub);padding:10px 0;font-family:var(--body);line-height:1.6}
form.add{display:flex;gap:6px;margin:6px 0 4px}
form.add input{flex:1;min-width:0;font:inherit;font-family:var(--body);font-size:14px;padding:7px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
form.add button{font:inherit;font-size:13px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:0 12px;cursor:pointer}
.note{font-size:11px;color:var(--sub);margin-top:14px;line-height:1.6;font-family:var(--body)}
</style>

<div class="app">
  <header>
    <div><h1>はしぐち村</h1><div class="date" id="date"></div></div>
    <div class="hud"><span class="pill" id="coin">🌰 0</span><button class="btn-s" id="replay" type="button">もう一回きく</button><button class="btn-s" id="wake" type="button" aria-label="画面をつけっぱなしにする">💡</button></div>
  </header>
  <p class="doing" id="doing"></p>
  <div class="stage" id="stage"><canvas id="cv" width="192" height="120" aria-label="はしぐち村のようす"></canvas></div>
  <div class="win" id="win">
    <div class="tag"><img id="tagImg" alt=""><span>ちいかわ</span></div>
    <div class="head" id="dHead"></div>
    <div class="ttl" id="dTitle"></div>
    <div class="txt" id="dText">（村とつながっています…）</div>
    <div class="acts" id="dActs"></div>
    <span class="more" id="more" hidden>▼</span>
  </div>

  <section class="box" aria-labelledby="h-box">
    <h2 id="h-box">📮 ほうこく箱 <small id="cnt"></small></h2>
    <div class="prog"><i id="bar"></i></div>
    <div class="sched" id="sched"></div>
    <div id="att"><p class="empty">ちいかわからのほうこくがここに届きます。</p></div>
    <h3>片づいたこと</h3>
    <div id="res"></div>
  </section>

  <section class="box" aria-labelledby="h-mine">
    <h2 id="h-mine">🧑‍🌾 そーやんの仕事 <small id="mcnt"></small></h2>
    <form class="add" id="addForm"><input id="taskIn" placeholder="いまからやること（例：アンケートに答える）" aria-label="やることを追加" autocomplete="off"><button type="submit">追加</button></form>
    <div id="mine"><p class="empty">やることを追加して、終わったらチェック。なかまが一緒によろこびます。</p></div>
  </section>
  <p class="note" id="note"></p>
</div>

<script>
const SPR={"chiikawa": ["....kkk......kkk....", "...kwwwk....kwwwk...", "...kwwwwkkkkwwwwk...", "..kwwwwwwwwwwwwwwk..", ".kwwwwwwwwwwwwwwwwk.", "kwwwwwwwwwwwwwwwwwwk", "kwwwwwwwwwwwwwwwwwwk", "kwwwwweewwwweewwwwwk", "kwwwwweewwwweewwwwwk", "kwwwwweewwwweewwwwwk", "kwwppwwwwwwwwwwppwwk", "kwwwwwwwwkkwwwwwwwwk", ".kwwwwwwwwwwwwwwwwk.", "..kwwwwwwwwwwwwwwk..", "...kkwwwwwwwwwwkk...", "....kwwwwwwwwwwk....", "...kwwkwwwwwwkwwk...", "....kwwwwwwwwwwk....", "....kwwwwwwwwwwk....", ".....kwwwkkwwwk.....", "......kkk..kkk......"], "hachiware": ["...k............k...", "...kk..........kk...", "...kbk........kbk...", "..kbbbkkkkkkkkbbbk..", ".kbbbbbbbwwbbbbbbbk.", "kbbbbbbbwwwwbbbbbbbk", "kbbbbbbwwwwwwbbbbbbk", "kwbbbbwwwwwwwwbbbbwk", "kwwwwweewwwweewwwwwk", "kwwwwweewwwweewwwwwk", "kwwppweewwwweewppwwk", "kwwwwwwwkwwkwwwwwwwk", ".kwwwwwwwkkwwwwwwwk.", "..kwwwwwwwwwwwwwwk..", "...kkwwwwwwwwwwkk...", "....kwwwwwwwwwwk....", "...kwwkwwwwwwkwwk...", "....kwwwwwwwwwwk....", "....kwwwwwwwwwwk....", ".....kwwwkkwwwk.....", "......kkk..kkk......"], "usagi": [".....kkk....kkk.....", ".....kyk....kyk.....", ".....kyk....kyk.....", ".....kyk....kyk.....", ".....kyk....kyk.....", "....kkyykkkkyykk....", "...kyyyyyyyyyyyyk...", "..kyyyyyyyyyyyyyyk..", ".kyyyyyyyyyyyyyyyyk.", ".kyyyyeyyyyyyeyyyyk.", ".kyyyyeyyyyyyeyyyyk.", ".kyppyyykkkkyyyppyk.", ".kyyyyykrrrrkyyyyyk.", "..kyyyyykkkkyyyyyk..", "...kkyyyyyyyyyykk...", "....kyyyyyyyyyyk....", "...kyykyyyyyykyyk...", "....kyyyyyyyyyyk....", "....kyyyyyyyyyyk....", ".....kyyykkyyyk.....", "......kkk..kkk......"], "rakko": ["......kkkkkkkk......", "....kkllllllllkk....", "...kllllllllllllk...", "..kllllllllllllllk..", ".kllllllllllllllllk.", "kllllllllllllllllllk", "kllllleelllleelllllk", "kllllleelllleelllllk", "klllpplLLLLLLlpplllk", "klllllLLLkkLLLlllllk", ".klllllLLLLLLlllllk.", "..kllllllllllllllk..", "...kkllllllllllkk...", "...kllllllllllllk...", "..kllkllllllllkllk..", "...kllllllllllllk...", "...kllllllllllllk...", "....kllllkkllllk....", ".....kkk....kkk....."], "kuri": [".........kk.........", "........kNNk........", ".......kNNNNk.......", ".....kkNNNNNNkk.....", "....kNNNNNNNNNNk....", "...kNNNNNNNNNNNNk...", "..kNNNNNNNNNNNNNNk..", ".kNNNNNNNNNNNNNNNNk.", ".kcccccccccccccccck.", "kcccccccccccccccccck", "kcccceecccccceecccck", "kcccccccccccccccccck", "kccppcccckkccccppcck", "kccccccckcckccccccck", ".kcccccccccccccccck.", "..kcccccccccccccck..", "...kkcccccccccckk...", ".....kkkkkkkkkk.....", "......kk....kk......"], "momonga": ["..kkk..........kkk..", ".kvvvk........kvvvk.", ".kvvvvkkkkkkkkvvvvk.", ".kvvvvvvvvvvvvvvvvk.", "kvvvvvvvvvvvvvvvvvvk", "kvvvvwwwwwwwwwwvvvvk", "kvvwwwwwwwwwwwwwwvvk", "kwwweeewwwwwweeewwwk", "kwwwewewwwwwwewewwwk", "kwwweeewwwwwweeewwwk", "kwwppwwwwkkwwwwppwwk", ".kwwwwwwwwwwwwwwwwk.", "..kwwwwwwwwwwwwwwk..", "...kkwwwwwwwwwwkk...", "....kwwwwwwwwwwk....", "...kwwkwwwwwwkwwk...", "....kwwwwwwwwwwk....", ".....kwwwkkwwwk.....", "......kkk..kkk......"], "shisa": ["....kkkkkkkkkkkk....", "..kkMMMMMMMMMMMMkk..", ".kMMMMMMMMMMMMMMMMk.", "kMMMMMMMMMMMMMMMMMMk", "kMMMOOOOOOOOOOOOMMMk", "kMMOOOOOOOOOOOOOOMMk", "kMMOOOeeOOOOeeOOOMMk", "kMMOOOeeOOOOeeOOOMMk", "kMMOOppOOkkOOppOOMMk", "kMMOOOOkrrrrkOOOOMMk", "kMMMOOOOOOOOOOOOMMMk", ".kMMMMMMMMMMMMMMMMk.", "..kkMMMMMMMMMMMMkk..", "....kOOOOOOOOOOk....", "...kOOkOOOOOOkOOk...", "....kOOOOOOOOOOk....", "....kOOOOOOOOOOk....", ".....kOOOkkOOOk.....", "......kkk..kkk......"], "soyan": ["......kkkkkkkk......", ".....khhhhhhhhk.....", ".....khhhhhhhhk.....", "....kRRRRRRRRRRk....", ".khhhhhhhhhhhhhhhhk.", ".kkkkkkkkkkkkkkkkkk.", "...kHHHHHHHHHHHHk...", "...kssssssssssssk...", "...ksseesssseessk...", "...ksppssssssppsk...", "...ksssskkkkssssk...", "....kssssssssssk....", "...kggggggggggggk...", "..kggddddddddddggk..", "..kssddddddddddssk..", "...kddddddddddddk...", "....kddddkkddddk....", "....kddddkkddddk....", "....kkkkk..kkkkk...."]};
const HAPPY={"chiikawa": {"7": "kwwwwwwwwwwwwwwwwwwk", "8": "kwwwwweewwwweewwwwwk", "9": "kwwwwewwewwewwewwwwk", "11": "kwwwwwwwkrrkwwwwwwwk", "16": "..kwwkwwwwwwwwkwwk.."}, "hachiware": {"8": "kwwwwwwwwwwwwwwwwwwk", "9": "kwwwwweewwwweewwwwwk", "10": "kwwppewwewwewwewppwk", "11": "kwwwwwwwkrrkwwwwwwwk", "16": "..kwwkwwwwwwwwkwwk.."}, "usagi": {"9": ".kyyyyeyyyyyyeyyyyk.", "10": ".kyyyeyeyyyyeyeyyyk.", "12": ".kyyyyykrrrrkyyyyyk.", "13": ".kyyyyykrrrrkyyyyyk.", "14": "..kyyyyykkkkyyyyyk..", "16": "..kyykyyyyyyyykyyk.."}};
const PAL={k:'#3b3533',w:'#ffffff',p:'#f7a7b9',e:'#2a2422',b:'#4b5572',y:'#f5e2a0',r:'#e36d72',
  l:'#e4ebf2',L:'#b8c5d3',N:'#8a5a33',c:'#f4dfae',v:'#cfc5e8',M:'#d98639',O:'#f7c86e',h:'#e9c66b',R:'#c9544b',H:'#4a3a33',s:'#f3cfa6',g:'#6f9f5e',d:'#4f73a8',
  G:'#3f8a3a',n:'#8a5a35',m:'#9b7fd0',B:'#6d8fd6',Y:'#ffd84a',E:'#f6efe0'};
const W=192,H=120;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toC(rows){const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const g=c.getContext('2d');
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch!=='.'){g.fillStyle=PAL[ch];g.fillRect(x,y,1,1)}}));return c}
const apply=(rows,d)=>rows.map((r,i)=>d&&d[i]!==undefined?d[i]:r);
function crouch(rows){const r=rows.slice();r.splice(rows.length-3,1);r.unshift('.'.repeat(rows[0].length));return r}
const IMG={};for(const id in SPR)IMG[id]={idle:toC(SPR[id]),work:toC(crouch(SPR[id])),happy:toC(apply(SPR[id],HAPPY[id]))};
const P={
  weed:toC(["..G.G..",".GgGgG.","..GgG..","...G...","..nnn.."]),
  book:toC(["kkkkkkkkk","kEEEBEEEk","kEEEBEEEk","kkkkkkkkk"]),
  stick:toC(["......n","....nn.","...nn..","..nn...",".nn....","nn....."]),
  letter:toC(["kkkkkkkkk","kEkEEEkEk","kEEkEkEEk","kEEEkEEEk","kkkkkkkkk"]),
  bang:toC(["kYk","kYk","kYk","...","kYk"]),
  spark:toC(["..Y..","..Y..","YYYYY","..Y..","..Y.."]),
  mon:toC(["...kkkk...","..kmmmmk..",".kmmmmmmk.","kmmkmmkmmk","kmmwmmwmmk","kmkkkkkkmk",".kmmmmmmk.","..k.kk.k.."])};

// ---------- 背景 ----------
const bg=document.createElement('canvas');bg.width=W;bg.height=H;(()=>{const g=bg.getContext('2d');
  g.fillStyle='#a6d37f';g.fillRect(0,0,W,H);
  for(let i=0;i<140;i++){g.fillStyle=i%2?'#97c670':'#b6dd91';g.fillRect((i*53+i*i)%W,(i*29+i*7)%H,1,1)}
  g.fillStyle='#ead9a8';g.fillRect(0,62,W,7);g.fillRect(92,69,8,14);g.fillRect(150,38,8,24);
  // 掲示板
  g.fillStyle='#7a5230';g.fillRect(14,14,2,14);g.fillRect(32,14,2,14);g.fillStyle='#c8995a';g.fillRect(11,8,26,12);
  g.fillStyle='#7a5230';g.fillRect(11,8,26,1);g.fillRect(11,19,26,1);g.fillStyle='#fff';g.fillRect(14,10,6,5);g.fillRect(22,11,5,6);g.fillRect(29,10,5,4);
  // 家
  g.fillStyle='#d9695f';g.fillRect(134,6,44,10);g.fillStyle='#b8544b';g.fillRect(134,15,44,2);
  g.fillStyle='#f6e7c9';g.fillRect(138,17,36,20);g.fillStyle='#8a5a35';g.fillRect(151,25,8,12);
  g.fillStyle='#bfe3ff';g.fillRect(141,21,7,6);g.fillRect(163,21,7,6);
  // 木
  g.fillStyle='#7a5230';g.fillRect(64,20,4,10);g.fillStyle='#5f9e4f';g.fillRect(56,4,20,16);g.fillRect(54,8,24,10);g.fillStyle='#74b562';g.fillRect(59,6,8,5);
  // 草むしり畑
  g.fillStyle='#b08f5f';g.fillRect(6,86,58,30);g.fillStyle='#c7a574';g.fillRect(7,87,56,28);
  // 討伐エリア
  g.fillStyle='#93c26f';g.fillRect(128,74,64,46);g.fillStyle='#9a948c';g.fillRect(186,108,5,4);g.fillRect(131,112,6,4);
  // 花
  [[8,60],[26,59],[44,60],[110,59],[124,60],[176,60]].forEach(([x,y],i)=>{g.fillStyle=['#f7a7b9','#fff','#ffd84a'][i%3];g.fillRect(x,y,1,1);g.fillRect(x-1,y+1,3,1);g.fillRect(x,y+2,1,1)});
})();
const WEEDS=[[12,92],[26,98],[40,92],[52,100],[18,106],[36,108]];

// ---------- キャラ ----------
const ent={
  chiikawa:{x:152,y:40,face:-1,pose:'idle',st:'wait',t:0,weeds:6,jump:0},
  hachiware:{x:44,y:44,face:1,pose:'work'},
  usagi:{x:150,y:94,face:1,pose:'work'},
  soyan:{x:96,y:98,face:1,pose:'idle'}};
const SOYAN_SIDE={x:118,y:98};
function stepTo(e,tx,ty,dt,sp=26){const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);if(d<1){e.x=tx;e.y=ty;return true}
  const k=Math.min(1,sp*dt/d);e.x+=dx*k;e.y+=dy*k;if(Math.abs(dx)>0.5)e.face=dx>0?1:-1;return false}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function draw(id,e,t){const im=IMG[id][e.pose];let dy=0,dx=0;
  if(e.pose==='idle'&&!e.walking)dy=Math.floor(t*2+e.x)%2;
  if(e.walking)dy=Math.floor(t*8)%2;
  if(e.jump>0)dy=-Math.round(Math.sin(e.jump*Math.PI)*8);
  if(id==='usagi')dx=Math.floor(t*3)%2?3:0;
  const x=Math.round(e.x-im.width/2+dx),y=Math.round(e.y-im.height+dy);
  ctx.save();if(e.face<0){ctx.translate(Math.round(e.x)*2,0);ctx.scale(-1,1)}
  ctx.drawImage(im,x,y);
  if(e.pose==='work'){const ph=Math.floor(t*3)%2;
    if(id==='chiikawa')ctx.drawImage(P.weed,x+15,y+13-(ph?3:0));
    if(id==='hachiware')ctx.drawImage(P.book,x+5,y+15+(Math.floor(t)%4===0?1:0));
    if(id==='usagi')ctx.drawImage(P.stick,x+15,y+6+(ph?2:0));}
  ctx.restore();
  return {x,y,w:im.width}}

let T=0,last=0;
function update(dt){const c=ent.chiikawa;c.t+=dt;if(c.jump>0)c.jump=Math.max(0,c.jump-dt*1.6);
  if(c.st==='walkIn'){c.walking=true;c.pose='idle';if(stepTo(c,SOYAN_SIDE.x,SOYAN_SIDE.y,dt)){c.walking=false;c.face=-1;c.st='arrive';c.t=0}}
  else if(c.st==='arrive'&&c.t>0.8){c.st='report';openDialog()}
  else if(c.st==='walkOut'){c.walking=true;const w=WEEDS[Math.min(5,6-c.weeds)]||WEEDS[0];if(stepTo(c,w[0]+12,w[1]+6,dt)){c.walking=false;c.st='weed';c.t=0;c.face=-1}}
  else if(c.st==='weed'){c.pose='work';if(c.t>4){c.t=0;c.weeds--;if(c.weeds<=0){c.weeds=6;c.jump=1;c.pose='happy';setTimeout(()=>{if(c.st==='weed')c.pose='work'},900)}
    const w=WEEDS[6-c.weeds]||WEEDS[0];c.x=w[0]+12;c.y=w[1]+6}}}
function render(t){ctx.drawImage(bg,0,0);
  const c=ent.chiikawa;WEEDS.forEach(([x,y],i)=>{if(i>=6-c.weeds||c.st!=='weed')ctx.drawImage(P.weed,x,y)});
  // そーやんの机
  ctx.drawImage(P.mon,172,86+(Math.floor(t*2)%2));
  const order=Object.entries(ent).sort((a,b)=>a[1].y-b[1].y);let cpos;
  order.forEach(([id,e])=>{const r=draw(id,e,t);if(id==='chiikawa')cpos=r;
    if(id==='soyan'){ctx.fillStyle='#a8743f';ctx.fillRect(84,94,26,6);ctx.fillStyle='#7a5230';ctx.fillRect(84,100,2,4);ctx.fillRect(108,100,2,4);
      ctx.fillStyle='#cfd3d9';ctx.fillRect(90,89,12,6);ctx.fillStyle=Math.floor(t*1.5)%2?'#8fd18a':'#cfd3d9';ctx.fillRect(95,91,2,2)}});
  if(c.st==='walkIn')ctx.drawImage(P.letter,Math.round(c.x-4),cpos.y-7);
  if(c.st==='arrive')ctx.drawImage(P.bang,Math.round(c.x-1),cpos.y-8);
  if(c.pose==='happy'&&Math.floor(t*4)%2){ctx.drawImage(P.spark,cpos.x-5,cpos.y+2);ctx.drawImage(P.spark,cpos.x+cpos.w,cpos.y+6)}}
function loop(ts){const dt=Math.min(0.1,(ts-last)/1000||0);last=ts;T+=dt;update(dt);render(T);requestAnimationFrame(loop)}
requestAnimationFrame(loop);


// ---------- 共有データ（db） ----------
const $=id=>document.getElementById(id);
$('tagImg').src=IMG.chiikawa.idle.toDataURL();
let REPORTS=[],TASKS=[],STATUS={},db=null,canWrite=true,firstReports=true;
const byTime=(a,b)=>(a.createdAt||0)-(b.createdAt||0);
const attention=()=>REPORTS.filter(r=>r.kind!=='resolved');
const resolved=()=>REPORTS.filter(r=>r.kind==='resolved');
const coins=()=>(REPORTS.filter(r=>r.kind!=='resolved'&&r.done).length+TASKS.filter(t=>t.done).length)*10;

// ---------- 会話 ----------
let pages=[],pi=0,typing=null,full='';
function reportPage(r,i,n){return {head:r.kind==='question'?`ちいかわからのしつもん`:`きにかけたいこと ${i+1}/${n}`,title:r.title,text:r.body||'',id:r.id}}
function briefPages(){const list=attention().filter(r=>!r.done),p=[];
  p.push({text:STATUS.greeting||'そーやん…！ ほうこく、もってきた…！'});
  if(STATUS.schedule&&STATUS.schedule.length)p.push({head:'きょうのよてい',text:STATUS.schedule.map(s=>`${s.time}  ${s.title}`).join('\n')});
  list.forEach((r,i)=>p.push(reportPage(r,i,list.length)));
  if(!list.length)p.push({text:'いま、きにかけることはない…！'});
  const res=resolved();if(res.length)p.push({head:'いいしらせ',text:'かたづいたことも、あった…！\n'+res.map(r=>'・'+r.title).join('\n')});
  p.push({text:'ほうこく、おわり…！\nちいかわ、草むしりしてくる…！',end:true});return p}
function callChiikawa(p){pages=p;pi=0;const c=ent.chiikawa;if(c.st==='report'){showPage();return}
  c.st='walkIn';setText('','','（ちいかわがやってくる…）');$('dActs').innerHTML=''}
function openDialog(){pi=0;showPage()}
function setText(h,t,x){$('dHead').textContent=h;$('dTitle').textContent=t;$('dText').textContent=x}
function showPage(){const p=pages[pi];if(!p)return;setText(p.head||'',p.title||'','');full=p.text;let n=0;clearInterval(typing);$('more').hidden=true;renderActs(false);
  typing=setInterval(()=>{n+=2;$('dText').textContent=full.slice(0,n);if(n>=full.length){clearInterval(typing);typing=null;renderActs(true)}},28)}
function renderActs(ready){const a=$('dActs'),p=pages[pi];if(!ready||!p){a.innerHTML='';return}
  const r=p.id&&REPORTS.find(x=>x.id===p.id);let h='';
  if(r&&r.kind==='question'&&r.choices)h+=r.choices.map((c,i)=>`<button type="button" class="choice" data-act="ans" data-i="${i}" aria-pressed="${r.answer===c}">${esc(c)}</button>`).join('');
  else if(r){h+=`<button type="button" class="ok" data-act="done" aria-pressed="${!!r.done}">${r.done?'✅ やった！':'✅ やった'}</button>`}
  if(r&&r.link)h+=`<a href="${esc(r.link)}" target="_blank" rel="noopener">ひらく ↗</a>`;
  h+=p.end?`<button type="button" data-act="close">とじる</button>`:`<button type="button" data-act="next">つぎへ ▶</button>`;
  a.innerHTML=h;$('more').hidden=!!p.end}
function next(){if(typing){clearInterval(typing);typing=null;$('dText').textContent=full;renderActs(true);return}
  if(pi<pages.length-1){pi++;showPage();if(pages[pi].end){ent.chiikawa.pose='happy';ent.chiikawa.jump=1}}else close()}
function close(){const c=ent.chiikawa;c.pose='idle';c.st='walkOut';setText('','',STATUS.chiikawa?`（ちいかわは「${STATUS.chiikawa}」をしている…）`:'（ちいかわは草むしりをしている…）');
  $('dActs').innerHTML='<button type="button" data-act="replay">もう一回きく</button>';$('more').hidden=true}
$('dText').addEventListener('click',()=>{if(ent.chiikawa.st==='report')next()});
$('dActs').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const act=b.dataset.act,p=pages[pi];
  if(act==='next')next();if(act==='close')close();if(act==='replay')callChiikawa(briefPages());
  if(act==='done'&&p.id){const r=REPORTS.find(x=>x.id===p.id);await setReport(p.id,{done:!r.done});renderActs(true)}
  if(act==='ans'&&p.id){const r=REPORTS.find(x=>x.id===p.id);const c=r.choices[+b.dataset.i];await setReport(p.id,{answer:c,done:true});renderActs(true);
    say('わかった…！ つたえておく…！')}});
function say(t){const keep=full;setText(pages[pi]?.head||'',pages[pi]?.title||'',t);setTimeout(()=>{if(ent.chiikawa.st==='report')$('dText').textContent=keep},1600)}

// ---------- 演出 ----------
function floater(text,e){const s=$('stage'),f=document.createElement('div');f.className='floater';f.textContent=text;
  f.style.left=(e.x/W*100)+'%';f.style.top=((e.y-24)/H*100)+'%';s.appendChild(f);setTimeout(()=>f.remove(),1300)}
function cheer(who){const c=ent.chiikawa;c.jump=1;const back=c.st==='weed'?'work':'idle';c.pose='happy';setTimeout(()=>{if(c.pose==='happy')c.pose=c.st==='weed'?'work':'idle'},1000);
  if(who==='soyan'){['hachiware','usagi'].forEach(k=>{ent[k].pose='happy';setTimeout(()=>ent[k].pose='work',1400)});ent.soyan.pose='happy';ent.soyan.jump=1;setTimeout(()=>ent.soyan.pose='idle',1200);floater('+10🌰',ent.soyan)}
  else floater('+10🌰',c)}
ent.soyan.jump=0;ent.hachiware.jump=0;ent.usagi.jump=0;
const _upd=update;update=function(dt){_upd(dt);['soyan','hachiware','usagi'].forEach(k=>{const e=ent[k];if(e.jump>0)e.jump=Math.max(0,e.jump-dt*1.6)})};

// ---------- 書き込み ----------
async function setReport(id,patch){const r=REPORTS.find(x=>x.id===id);if(!r)return;Object.assign(r,patch);if(patch.done)cheer('chiikawa');renderBox();
  if(db&&canWrite){try{await db.collection('reports').doc(id).update(patch)}catch(e){if(e&&e.code==='invalid_argument')canWrite=false}}}
async function setTask(id,patch){const t=TASKS.find(x=>x.id===id);if(!t)return;Object.assign(t,patch);if(patch.done)cheer('soyan');renderMine();$('coin').textContent='🌰 '+coins();
  if(db&&canWrite){try{await db.collection('tasks').doc(id).update(patch)}catch(e){if(e&&e.code==='invalid_argument')canWrite=false}}}
$('addForm').addEventListener('submit',async e=>{e.preventDefault();const v=$('taskIn').value.trim();if(!v)return;$('taskIn').value='';
  const t={title:v.slice(0,120),done:false,createdAt:Date.now()};
  if(db&&canWrite){try{const ref=await db.collection('tasks').add(t);if(!TASKS.find(x=>x.id===ref.id)){TASKS.push({id:ref.id,...t});renderMine()}}
    catch(err){TASKS.push({id:'local'+Date.now(),...t});renderMine();$('note').textContent='この画面では保存できません（ほかの人の村を見ているとき）。'}}
  else{TASKS.push({id:'local'+Date.now(),...t});renderMine()}
  const s=ent.soyan;floater('📝',s)});

// ---------- 描画 ----------
function link(r){return r.link?`<a class="t" href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:`<span class="t">${esc(r.title)}</span>`}
function renderBox(){const att=attention(),res=resolved();
  $('sched').innerHTML=(STATUS.schedule||[]).map(s=>`<span>⏰ ${esc(s.time)} ${esc(s.title)}</span>`).join('');
  $('att').innerHTML=att.length?att.map(r=>`<div class="item${r.done?' done':''}"><input type="checkbox" id="r-${esc(r.id)}" data-r="${esc(r.id)}" ${r.done?'checked':''} aria-label="やった：${esc(r.title)}">
    <div>${link(r)}<p>${esc(r.body||'')}</p>${r.answer?`<span class="ans">こたえ：${esc(r.answer)}</span>`:''}</div></div>`).join(''):'<p class="empty">ちいかわからのほうこくがここに届きます。</p>';
  $('res').innerHTML=res.length?res.map(r=>`<div class="item done"><span aria-hidden="true">✔</span><div>${link(r)}<p>${esc(r.body||'')}</p></div></div>`).join(''):'<p class="empty">まだありません。</p>';
  const n=att.filter(r=>r.done).length;$('cnt').textContent=`${n} / ${att.length} 片づいた`;
  $('bar').style.width=(att.length?n/att.length*100:0)+'%';$('coin').textContent='🌰 '+coins()}
function renderMine(){const ts=TASKS.slice().sort(byTime);
  $('mine').innerHTML=ts.length?ts.map(t=>`<div class="item${t.done?' done':''}"><input type="checkbox" id="t-${esc(t.id)}" data-t="${esc(t.id)}" ${t.done?'checked':''} aria-label="できた：${esc(t.title)}"><div><span class="t">${esc(t.title)}</span></div></div>`).join(''):'<p class="empty">やることを追加して、終わったらチェック。なかまが一緒によろこびます。</p>';
  const n=ts.filter(t=>t.done).length;$('mcnt').textContent=ts.length?`${n} / ${ts.length} できた`:''}
function renderStatus(){$('date').textContent=STATUS.dateLabel||'';$('note').textContent=STATUS.note||'';
  $('doing').innerHTML=STATUS.chiikawa?`🤍 ちいかわ：<b>${esc(STATUS.chiikawa)}</b>`:'';renderBox()}
$('att').addEventListener('change',e=>{const id=e.target.dataset.r;if(id){const r=REPORTS.find(x=>x.id===id);setReport(id,{done:!r.done});if(pages[pi]&&pages[pi].id===id)renderActs(!typing)}});
$('mine').addEventListener('change',e=>{const id=e.target.dataset.t;if(id){const t=TASKS.find(x=>x.id===id);setTask(id,{done:!t.done})}});
$('replay').addEventListener('click',()=>callChiikawa(briefPages()));
let lock=null;$('wake').addEventListener('click',async()=>{try{if(lock){await lock.release();lock=null;$('wake').textContent='💡'}else{lock=await navigator.wakeLock.request('screen');$('wake').textContent='🔆'}}catch(e){lock=null;$('wake').textContent='💡'}});
renderBox();renderMine();

// ---------- つながる ----------
(async()=>{const cl=window.claude;db=cl?await cl.use('db'):null;
  if(!db){setText('','','（この画面では村のデータを読めません。Claudeのアプリかブラウザで開いてください）');return}
  try{const u=await cl.use('user');if(u){const w=await u.can('data.write');if(w===false)canWrite=false}}catch(e){}
  db.doc('status/now').onSnapshot(s=>{STATUS=s.exists?s.data():{};renderStatus()},()=>{});
  db.collection('tasks').onSnapshot(s=>{TASKS=s.docs.map(d=>({id:d.id,...d.data()}));renderMine();$('coin').textContent='🌰 '+coins()},()=>{});
  db.collection('reports').onSnapshot(s=>{REPORTS=s.docs.map(d=>({id:d.id,...d.data()})).sort(byTime);renderBox();
    if(firstReports){if(!s.metadata.fromCache||REPORTS.length){firstReports=false;setTimeout(()=>callChiikawa(briefPages()),500)}return}
    const added=s.docChanges().filter(c=>c.type==='added'&&!c.doc.metadata.hasPendingWrites).map(c=>({id:c.doc.id,...c.doc.data()})).filter(r=>r.kind!=='resolved');
    if(added.length){const p=[{text:'そーやん…！ あたらしいほうこく…！'}];added.forEach((r,i)=>p.push(reportPage(r,i,added.length)));p.push({text:'ほうこく、おわり…！',end:true});
      if(ent.chiikawa.st==='report'){pages.splice(pages.length-1,0,...p.slice(1,-1))}else callChiikawa(p)}
  },()=>{setText('','','（村とのつながりが切れました。ページを開きなおしてください）')});
})();
</script>
