<title>封札モンスターズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#161934; --night2:#20244a; --night3:#2d3264; --line:#3b4178;
  --paper:#f3ecdc; --paper2:#e4d8bd; --ink:#2b2440;
  --shu:#d8432c; --shu2:#f06a4f; --gold:#e6b34f;
  --text:#eeeaf8; --muted:#a3a5cc; --good:#5ecb8a; --warn:#f2c14e; --bad:#ef5b5b;
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-dot:"DotGothic16","Osaka-Mono","MS Gothic",monospace;
}
html,body{height:100%}
body{
  background:var(--night);
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%,#ffffff55 50%,transparent 51%),
    radial-gradient(1px 1px at 72% 8%,#ffffff66 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 42%,#ffffff44 50%,transparent 51%),
    radial-gradient(1px 1px at 33% 62%,#ffffff44 50%,transparent 51%),
    radial-gradient(1px 1px at 58% 88%,#ffffff55 50%,transparent 51%),
    radial-gradient(120% 60% at 50% 0%,#262a5a 0%,transparent 70%);
  background-attachment:fixed;
  color:var(--text); font-family:var(--f-body); font-size:15px; line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding-inline:16px;padding-bottom:96px;min-height:100%}
#app.nonav{padding-bottom:24px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:10px;background:linear-gradient(var(--night) 70%,transparent)}
.top .brand{font-family:var(--f-disp);font-size:15px;letter-spacing:.04em;margin-right:auto;white-space:nowrap}
.top .brand b{color:var(--shu2);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--night2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .coin{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--gold) 60%,#a8772a);box-shadow:inset 0 0 0 2px #00000022}
.iconbtn{background:var(--night2);border:1px solid var(--line);border-radius:999px;width:32px;height:28px;cursor:pointer;font-size:12px;color:var(--muted)}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:#10122a;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:520px}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;background:none;border:0;cursor:pointer;color:var(--muted);font-size:11px;font-weight:700;border-radius:10px}
.tab i{font-style:normal;font-family:var(--f-disp);font-size:17px;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;border:1.5px solid currentColor}
.tab.on{color:var(--paper)}
.tab.on i{background:var(--shu);border-color:var(--shu);color:#fff;transform:rotate(-4deg)}

/* common */
.sec{font-family:var(--f-disp);font-weight:400;font-size:18px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;text-wrap:balance}
.sec small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:12px;padding:8px 16px;font-weight:900;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.shu{background:var(--shu);color:#fff}
.btn.dark{background:var(--night3);color:var(--text);border-color:#0c0d1e;box-shadow:0 3px 0 #0c0d1e}
.btn.big{font-size:17px;padding:12px 22px;width:100%}
.btn.sm{font-size:13px;padding:5px 12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:#0e1026;overflow:hidden;border:1px solid #0000004d}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--good);transition:width .5s ease,background-color .3s}
.bar.exp>i{background:#6fb6ff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-weight:900;border:2px solid var(--ink);border-radius:12px;padding:8px 14px;z-index:80;box-shadow:0 6px 20px #0008;max-width:calc(100% - 32px);text-align:center}

/* ===== card ===== */
.card{container-type:inline-size;position:relative;width:100%;aspect-ratio:5/7;border-radius:7%/5%}
.card .ci{position:absolute;inset:0;display:flex;flex-direction:column;gap:2.4cqw;padding:5cqw;background:var(--paper);color:var(--ink);border:1.6cqw solid var(--frame,var(--ink));border-radius:6cqw;box-shadow:0 1.5cqw 0 #00000040,0 4cqw 10cqw #00000040;overflow:hidden}
.card.r2{--frame:#9aa6be}
.card.r3{--frame:#c79a38}
.card.r4{--frame:#e86fb4}
.c-head{display:flex;justify-content:space-between;align-items:center}
.c-no{font-family:var(--f-dot);font-size:7.5cqw;letter-spacing:.05em}
.c-type{width:12cqw;height:12cqw;display:grid;place-items:center;border-radius:50%;background:var(--tc);color:#fff;font-weight:900;font-size:7.5cqw;border:.8cqw solid var(--ink)}
.c-art{position:relative;flex:1;min-height:0;border-radius:4cqw;border:.9cqw solid var(--ink);background:radial-gradient(circle at 50% 62%,var(--tc2) 0%,var(--tc) 85%);overflow:hidden}
.c-art::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 110%,#ffffff1f 0 3cqw,transparent 3cqw 6cqw)}
.c-art svg{position:absolute;inset:0;width:100%;height:100%}
.c-name{font-family:var(--f-disp);font-size:10cqw;line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{display:flex;justify-content:space-between;align-items:center;font-size:7.5cqw;font-weight:900;border-top:.6cqw dashed #2b244055;padding-top:1.6cqw}
.c-stars{letter-spacing:-.05em;color:#8b8499}
.r2 .c-stars{color:#6d7fa6}.r3 .c-stars{color:#c28a1e}.r4 .c-stars{color:#e0509f}
.c-seal{position:absolute;right:3cqw;bottom:3cqw;width:17cqw;height:17cqw;display:grid;place-items:center;font-family:var(--f-disp);font-size:10.5cqw;color:var(--shu);border:1cqw solid var(--shu);border-radius:2cqw;background:#fff9;transform:rotate(-10deg);line-height:1}
.c-badge{position:absolute;top:-2cqw;left:-2cqw;z-index:3;font-size:7cqw;font-weight:900;padding:.6cqw 3cqw;border-radius:99px;background:linear-gradient(90deg,#ff7ad9,#7ae0ff,#b9ff7a);color:var(--ink);border:.7cqw solid var(--ink)}
.v-gold .c-badge{background:linear-gradient(90deg,#fff1b0,#e6b34f);}
.c-foil{position:absolute;inset:0;border-radius:6cqw;pointer-events:none;opacity:0;z-index:2}
.v-holo .c-foil{opacity:.55;mix-blend-mode:color-dodge;background:linear-gradient(115deg,transparent 18%,#ff6fd8 30%,#6fe3ff 42%,#b6ff6f 54%,#ffe66f 66%,transparent 80%);background-size:260% 260%;background-position:var(--mx,0%) var(--my,50%);animation:foil 5s linear infinite}
.v-gold .ci{background:linear-gradient(160deg,#fff6d2,#f0cf72 48%,#fff1bd 70%,#e7bd57);--frame:#b07e1c}
.v-gold .c-foil{opacity:.7;mix-blend-mode:overlay;background:linear-gradient(120deg,transparent 30%,#fff 45%,transparent 60%);background-size:300% 300%;background-position:var(--mx,0%) var(--my,50%);animation:foil 3.2s linear infinite}
.r4 .c-foil{opacity:.45;mix-blend-mode:color-dodge;background:conic-gradient(from 0deg at 50% 50%,#ff7ad9,#7ae0ff,#b9ff7a,#ffe66f,#ff7ad9);animation:none}
.tilted .c-foil{animation:none}
@keyframes foil{0%{background-position:0% 50%}100%{background-position:260% 50%}}
.sil svg{filter:brightness(0) opacity(.55)}
.card.slot .ci{background:#2a2e5a;color:var(--muted);border-color:#3b4178;box-shadow:none}
.card.slot .c-art{background:#20244a;border-color:#3b4178}
.card.slot .c-art::before{display:none}
.card.slot.seen .c-art{background:radial-gradient(circle,#3a3f78,#20244a)}
.c-art.q{display:grid;place-items:center;font-family:var(--f-disp);font-size:22cqw;color:#3b4178}
.card.slot .c-meta{border-color:#3b4178}
/* back */
.card.back .ci{background:
  repeating-linear-gradient(45deg,#ffffff0a 0 4cqw,transparent 4cqw 8cqw),
  radial-gradient(circle at 50% 45%,#3a3f82,#1d2048);border-color:var(--gold);align-items:center;justify-content:center;gap:6cqw}
.bk-ring{width:48cqw;height:48cqw;border-radius:50%;border:1.4cqw double var(--gold);display:grid;place-items:center;box-shadow:0 0 0 3cqw #e6b34f22}
.bk-ring span{font-family:var(--f-disp);font-size:24cqw;color:var(--gold);line-height:1}
.bk-txt{font-family:var(--f-dot);color:var(--gold);font-size:6.5cqw;letter-spacing:.25em}

/* ===== title / starter ===== */
.hero{padding-block:22px 6px;text-align:left}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--gold);font-weight:900;margin:0}
.logo{font-family:var(--f-disp);font-weight:400;font-size:clamp(34px,10vw,48px);line-height:1.05;margin:6px 0 12px;letter-spacing:.02em}
.logo span{display:block;font-size:.55em;color:var(--paper);letter-spacing:.12em}
.logo em{font-style:normal;color:var(--shu2)}
.lead{color:#cfd0ee;margin:0;max-width:34em}
.starters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.pick{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;transition:transform .2s}
.pick .card{transition:transform .2s,filter .2s;filter:saturate(.7) brightness(.8)}
.pick.on .card{transform:translateY(-6px) rotate(-2deg);filter:none}
.pick .desc{font-size:11px;color:var(--muted);font-weight:700}
.pick.on .desc{color:var(--paper)}

/* ===== adventure ===== */
.buddy{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;background:var(--night2);border:1px solid var(--line);border-radius:16px;padding:12px}
.buddy .card{width:92px}
.buddy h3{margin:0;font-family:var(--f-disp);font-weight:400;font-size:18px}
.buddy .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.buddy .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.areas{display:flex;flex-direction:column;gap:10px}
.area{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 12px 12px 16px;border-radius:14px;background:linear-gradient(100deg,var(--g1) 0%,var(--g2) 100%);color:var(--ink);border:2px solid var(--ink);position:relative;overflow:hidden}
.area h3{margin:0;font-family:var(--f-disp);font-weight:400;font-size:17px}
.area p{margin:2px 0 6px;font-size:12px;font-weight:700;opacity:.8}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{font-size:11px;font-weight:900;padding:1px 7px;border-radius:99px;background:var(--c);color:#fff;border:1.5px solid var(--ink)}
.chip.lv{background:#fff8;color:var(--ink)}
.area.locked{filter:grayscale(1) brightness(.6)}
.area .lockmsg{font-size:12px;font-weight:900;text-align:right;max-width:7em}
.tip{margin-top:18px;font-size:13px;color:var(--muted);background:#ffffff08;border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.tip b{color:var(--paper)}

/* ===== battle ===== */
.battle{padding-top:6px;display:flex;flex-direction:column;gap:10px}
.bhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:700}
.field{position:relative;height:clamp(280px,78vw,340px);border-radius:18px;border:3px solid var(--ink);overflow:hidden;background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 62%,var(--g2) 100%)}
.field::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(#ffffff00,#00000022)}
.plat{position:absolute;border-radius:50%;background:#00000026;border:2px solid #0000001a}
.plat.f{right:6%;top:40%;width:44%;height:12%}
.plat.m{left:2%;bottom:6%;width:52%;height:13%}
.sprite{position:absolute;z-index:2}
.sprite svg{width:100%;height:100%;display:block;overflow:visible}
.sprite.f{right:9%;top:6%;width:38%;aspect-ratio:1}
.sprite.m{left:6%;bottom:6%;width:44%;aspect-ratio:1}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.plate{position:absolute;z-index:3;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:6px 10px;width:48%;min-width:0;box-shadow:0 3px 0 #0003}
.plate.f{left:4%;top:6%}
.plate.m{right:4%;bottom:10%}
.plate .nm{display:flex;justify-content:space-between;gap:6px;align-items:baseline;font-weight:900;font-size:14px;white-space:nowrap}
.plate .nm span:first-child{overflow:hidden;text-overflow:ellipsis}
.plate .lv{font-family:var(--f-dot);font-size:13px}
.plate .hpl{display:flex;align-items:center;gap:6px;margin-top:3px}
.plate .hpl b{font-family:var(--f-dot);font-size:10px;color:#fff;background:var(--ink);padding:0 4px;border-radius:4px;font-weight:400}
.plate .hpl .bar{flex:1;background:#d8cfb8}
.plate .hpn{font-family:var(--f-dot);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.tchip{display:inline-block;font-size:10px;font-weight:900;padding:0 6px;border-radius:99px;background:var(--c);color:#fff;vertical-align:middle;margin-left:4px}
.pop{position:absolute;z-index:6;font-family:var(--f-disp);font-size:24px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke;pointer-events:none}
.pop.crit{color:#ffd84a}
.flying{position:absolute;z-index:5;width:40px;left:0;top:0;pointer-events:none}
.msg{position:relative;min-height:74px;background:#141633;border:3px double #e9e4ff;border-radius:12px;padding:12px 34px 12px 14px;font-family:var(--f-dot);font-size:17px;line-height:1.5;cursor:pointer;color:#fff}
.msg .caret{position:absolute;right:12px;bottom:8px;font-style:normal;font-size:12px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.cmd{display:grid;grid-template-columns:1fr 1fr;gap:8px;transition:opacity .2s}
.cmd.busy{opacity:.35;pointer-events:none}
.cbtn{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;padding:9px 12px;border-radius:12px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;min-width:0}
.cbtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.cbtn b{font-size:16px;font-weight:900;display:flex;align-items:center;gap:6px;width:100%}
.cbtn small{font-size:11px;font-weight:700;opacity:.7}
.cbtn.shu{background:var(--shu);color:#fff}
.cbtn.wide{grid-column:1/-1;align-items:center}
.cbtn.ghost{background:transparent;color:var(--muted);border-color:var(--line);box-shadow:none;padding:6px}
.cbtn:disabled{opacity:.45;cursor:not-allowed}
.cbtn .rate{margin-left:auto;font-family:var(--f-dot);font-size:13px;font-weight:400}
.fchip{width:18px;height:24px;border-radius:3px;border:2px solid var(--ink);background:var(--fc);flex:none;position:relative}
.fchip::after{content:"";position:absolute;left:3px;right:3px;top:5px;bottom:5px;border:1px solid #2b244066}

/* ===== grids ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.gcell{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:5px;text-align:center;min-width:0}
.gcell .sub{font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center}
.gcell .sub .bar{flex:1;height:5px}
.gcell.inparty .card{outline:3px solid var(--shu);outline-offset:3px;border-radius:6%}
.pips{display:flex;justify-content:center;gap:4px}
.pips i{font-style:normal;font-size:10px;font-weight:900;width:18px;height:18px;display:grid;place-items:center;border-radius:5px;background:#ffffff0d;color:#ffffff40;border:1px solid #ffffff1a}
.pips i.on{background:var(--paper);color:var(--ink)}
.pips i.on.h{background:linear-gradient(135deg,#ff9ee6,#8fe8ff,#d2ff8f)}
.pips i.on.g{background:linear-gradient(135deg,#fff1b0,#e6b34f)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slotempty{aspect-ratio:5/7;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:700;text-align:center;padding:8px}
.lead-tag{font-size:10px;font-weight:900;background:var(--shu);color:#fff;border-radius:99px;padding:0 6px}
.progress{display:grid;gap:10px;background:var(--night2);border:1px solid var(--line);border-radius:16px;padding:14px}
.prow{display:grid;grid-template-columns:5.5em 1fr 4.5em;gap:10px;align-items:center;font-size:13px;font-weight:700}
.prow span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-dot)}
.prow .bar{height:10px}
.prow.h .bar>i{background:linear-gradient(90deg,#ff7ad9,#7ae0ff,#b9ff7a)}
.prow.g .bar>i{background:linear-gradient(90deg,#fff1b0,#e6b34f)}

/* ===== shop ===== */
.shop{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--night2);border:1px solid var(--line);border-radius:14px;padding:12px}
.item h3{margin:0;font-size:15px;font-weight:900}
.item p{margin:0;font-size:12px;color:var(--muted)}
.item .own{font-size:11px;color:var(--muted);font-weight:700}
.item .ico{width:34px;height:46px;border-radius:5px;border:2px solid var(--ink);background:var(--fc);position:relative;justify-self:center;box-shadow:0 2px 0 #0006}
.item .ico::after{content:"封";position:absolute;inset:6px 5px;border:1.5px solid #2b244077;display:grid;place-items:center;font-family:var(--f-disp);font-size:11px;color:#2b2440aa}
.item .ico.pot{border-radius:50% 50% 40% 40%;width:34px;height:40px;background:radial-gradient(circle at 40% 35%,#fff,#9be7c4 40%,#3fa57a)}
.item .ico.pot::after{content:"";border:0}
.item .ico.pack{background:linear-gradient(135deg,#3a3f82,#1d2048);border-color:var(--gold)}
.item .ico.pack::after{color:var(--gold);border-color:#e6b34f88}
.price{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.price span{font-family:var(--f-dot);font-size:13px;white-space:nowrap}
.settings{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:700;background:#ef5b5b1f;border:1px solid #ef5b5b66;border-radius:12px;padding:8px 10px}

/* ===== modal ===== */
#modal{position:fixed;inset:0;z-index:60;background:#0a0b1ccc;backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.mbox{width:100%;max-width:440px;margin-block:auto;display:flex;flex-direction:column;gap:14px;align-items:center}
.m-title{font-family:var(--f-disp);font-weight:400;font-size:22px;margin:0;text-align:center;text-wrap:balance}
.m-hint{margin:0;font-size:12px;color:var(--muted);text-align:center}
.m-act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.rv-row{display:grid;gap:12px;width:100%}
.rv-row.n1{grid-template-columns:minmax(0,220px);justify-content:center}
.rv-row.n3{grid-template-columns:repeat(3,1fr)}
.rv{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.flip{background:none;border:0;padding:0;width:100%;perspective:900px;cursor:pointer}
.flipper{position:relative;width:100%;aspect-ratio:5/7;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.flip.open .flipper{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.rv-tag{visibility:hidden;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:22px}
.rv.open .rv-tag{visibility:visible}
.tag{font-size:11px;font-weight:900;padding:1px 8px;border-radius:99px;background:var(--paper);color:var(--ink)}
.tag.new{background:var(--shu);color:#fff}
.tag.h{background:linear-gradient(90deg,#ff9ee6,#8fe8ff,#d2ff8f)}
.tag.g{background:linear-gradient(90deg,#fff1b0,#e6b34f)}
.detail{width:min(250px,70vw);perspective:900px}
.detail .card{transition:transform .15s ease-out}
.dinfo{width:100%;background:var(--night2);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.dinfo .flav{margin:0;font-size:14px;color:#dcdcf5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats div{background:#ffffff0a;border-radius:10px;padding:6px 2px}
.stats small{display:block;font-size:10px;color:var(--muted);font-weight:700}
.stats b{font-family:var(--f-dot);font-size:17px;font-weight:400}
.mvl{display:flex;flex-direction:column;gap:4px;font-size:13px}
.mvl div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.mvl span:last-child{font-family:var(--f-dot);color:var(--muted)}
.varsel{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.lost{font-size:13px;color:var(--muted);text-align:center;margin:0}

@media (prefers-reduced-motion:reduce){
  .bob,.c-foil,.msg .caret{animation:none!important}
  .flipper{transition-duration:.01s}
}

function starPath(cx,cy,R,r,n=5){let d='';for(let i=0;i<n*2;i++){const a=Math.PI/n*i-Math.PI/2,rr=i%2?r:R;d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1)}return d+'Z'}
function flamePath(x,y,s){return `M${x} ${y-14*s} C${x+7*s} ${y-6*s} ${x+8*s} ${y} ${x+4*s} ${y+4*s} L${x-4*s} ${y+4*s} C${x-8*s} ${y} ${x-7*s} ${y-6*s} ${x} ${y-14*s}Z`}
function art(m){
  const a=m.art,T=TYPES[m.t],c1=a.col||T.c,c2=a.col2||T.c2,O='#2b2440';
  const s=SHAPES[a.shape],t=s.top,fy=s.fy,w=s.w,back=[],front=[],tops=a.top||[];
  const dbl=(d,col,wd=5)=>`<path d="${d}" fill="none" stroke="${O}" stroke-width="${wd+4}"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${wd}"/>`;
  if(a.mane){let d='';for(let i=0;i<32;i++){const an=Math.PI*2/32*i,rr=i%2?29:38;d+=(i?'L':'M')+(50+Math.cos(an)*rr).toFixed(1)+' '+(fy+4+Math.sin(an)*rr*.82).toFixed(1)}back.push(`<path d="${d}Z" fill="#ffb347"/>`)}
  // tail
  const tx=50+w-4,ty=fy+20;
  if(a.tail==='flame'){back.push(dbl(`M${tx} ${ty} Q${tx+14} ${ty} ${tx+14} ${ty-12}`,c1)+`<path d="${flamePath(tx+14,ty-16,1)}" fill="#ff9a3c"/><path d="${flamePath(tx+14,ty-14,.5)}" fill="#ffe066" stroke="none"/>`)}
  if(a.tail==='long')back.push(dbl(`M${tx} ${ty} Q${tx+22} ${ty+4} ${tx+15} ${ty-22}`,c1,6));
  if(a.tail==='zigzag')back.push(`<polyline points="${tx},${ty} ${tx+11},${ty-4} ${tx+6},${ty-12} ${tx+18},${ty-19}" fill="none" stroke="${O}" stroke-width="9"/><polyline points="${tx},${ty} ${tx+11},${ty-4} ${tx+6},${ty-12} ${tx+18},${ty-19}" fill="none" stroke="#ffd84a" stroke-width="5"/>`);
  if(a.tail==='fish')back.push(`<path d="M${tx-2} ${ty} L${tx+14} ${ty-11} L${tx+11} ${ty} L${tx+14} ${ty+10}Z" fill="${c2}"/>`);
  if(a.tail==='leaf')back.push(dbl(`M${tx} ${ty} Q${tx+12} ${ty} ${tx+13} ${ty-10}`,c1,4)+`<path d="M${tx+13} ${ty-10} C${tx+6} ${ty-16} ${tx+10} ${ty-26} ${tx+18} ${ty-28} C${tx+22} ${ty-20} ${tx+20} ${ty-12} ${tx+13} ${ty-10}Z" fill="#7fd36e"/>`);
  for(const d of[-1,1]){
    // wings
    if(a.wings==='bat'){const x=50+d*(w-3),wc=a.wingCol||'#5b4a8f';back.push(`<path d="M${x} ${fy} L${x+d*19} ${fy-16} L${x+d*15} ${fy-3} L${x+d*22} ${fy+3} L${x+d*11} ${fy+8} L${x+d*13} ${fy+16} L${x} ${fy+14}Z" fill="${wc}"/>`)}
    if(a.wings==='feather'){const x=50+d*(w+4);back.push(`<ellipse cx="${x}" cy="${fy+2}" rx="13" ry="7" transform="rotate(${-d*30} ${x} ${fy+2})" fill="${c2}"/><ellipse cx="${x+d*2}" cy="${fy+10}" rx="10" ry="5" transform="rotate(${-d*10} ${x+d*2} ${fy+10})" fill="${c2}"/>`)}
    if(a.wings==='bee'){const x=50+d*(w-2);back.push(`<ellipse cx="${x}" cy="${fy-14}" rx="11" ry="6.5" transform="rotate(${-d*35} ${x} ${fy-14})" fill="#eaf8ff" fill-opacity=".9"/>`)}
    if(a.fins)back.push(`<path d="M${50+d*(w-4)} ${fy+6} L${50+d*(w+10)} ${fy+1} L${50+d*(w-1)} ${fy+18}Z" fill="${c2}"/>`);
    // ears
    if(a.ears==='pointy'){const x=50+d*15;back.push(`<path d="M${x-8*d} ${t+12} L${x+4*d} ${t-12} L${x+9*d} ${t+10}Z" fill="${c1}"/><path d="M${x-3*d} ${t+8} L${x+3*d} ${t-4} L${x+5*d} ${t+8}Z" fill="${c2}" stroke="none"/>`)}
    if(a.ears==='round'){const x=50+d*19;back.push(`<circle cx="${x}" cy="${t+4}" r="9" fill="${c1}"/><circle cx="${x}" cy="${t+4}" r="4.5" fill="${c2}" stroke="none"/>`)}
    if(a.ears==='long'){const x=50+d*11,y=t-12;back.push(`<ellipse cx="${x}" cy="${y}" rx="6" ry="17" transform="rotate(${d*14} ${x} ${y})" fill="${c1}"/><ellipse cx="${x}" cy="${y+2}" rx="2.8" ry="11" transform="rotate(${d*14} ${x} ${y})" fill="${c2}" stroke="none"/>`)}
    if(tops.includes('horns'))back.push(`<path d="M${50+d*8} ${t+8} Q${50+d*20} ${t} ${50+d*20} ${t-14} Q${50+d*14} ${t-4} ${50+d*2} ${t+6}Z" fill="#fff3d6"/>`);
    if(tops.includes('antlers'))back.push(`<path d="M${50+d*8} ${t+6} L${50+d*14} ${t-10} L${50+d*22} ${t-16} M${50+d*14} ${t-10} L${50+d*12} ${t-20} M${50+d*11} ${t-1} L${50+d*20} ${t-4}" stroke="${O}" stroke-width="6.5" fill="none"/><path d="M${50+d*8} ${t+6} L${50+d*14} ${t-10} L${50+d*22} ${t-16} M${50+d*14} ${t-10} L${50+d*12} ${t-20} M${50+d*11} ${t-1} L${50+d*20} ${t-4}" stroke="#c89464" stroke-width="3" fill="none"/>`);
    if(tops.includes('antenna'))back.push(`<path d="M${50+d*6} ${t+6} Q${50+d*8} ${t-6} ${50+d*14} ${t-12}" fill="none"/><circle cx="${50+d*14}" cy="${t-13}" r="3.6" fill="${c2}"/>`);
  }
  if(tops.includes('flame'))back.push(`<path d="${flamePath(50,t-4,1.4)}" fill="#ff9a3c"/><path d="${flamePath(50,t+1,.7)}" fill="#ffe066" stroke="none"/>`);
  if(tops.includes('leaf'))back.push(`<path d="M50 ${t+6} L50 ${t-6}" fill="none"/><path d="M50 ${t-6} C42 ${t-6} 36 ${t-12} 34 ${t-18} C42 ${t-18} 48 ${t-14} 50 ${t-6}Z" fill="#7fd36e"/><path d="M50 ${t-6} C58 ${t-6} 64 ${t-12} 66 ${t-18} C58 ${t-18} 52 ${t-14} 50 ${t-6}Z" fill="#7fd36e"/>`);
  if(tops.includes('tuft'))back.push(`<path d="M44 ${t+6} Q41 ${t-8} 47 ${t-11} Q47 ${t-2} 50 ${t+2} Q52 ${t-13} 59 ${t-9} Q54 ${t-2} 56 ${t+6}Z" fill="${c2}"/>`);
  if(tops.includes('horn'))back.push(`<path d="M45 ${t+6} L50 ${t-17} L55 ${t+6}Z" fill="#fff3d6"/>`);
  // belly / shine / marks
  if(s.belly)front.push(`<ellipse cx="50" cy="${fy+17}" rx="${(w*.55).toFixed(1)}" ry="${a.shape==='wide'?9:11}" fill="${c2}" stroke="none" opacity=".92"/>`);
  if(s.shine)front.push(`<ellipse cx="${s.shine[0]}" cy="${s.shine[1]}" rx="3.5" ry="6.5" transform="rotate(25 ${s.shine[0]} ${s.shine[1]})" fill="#fff" opacity=".6" stroke="none"/>`);
  if(a.mark==='spots')front.push(`<circle cx="${50-w*.62}" cy="${fy+6}" r="3.4" fill="${c2}" stroke="none"/><circle cx="${50+w*.66}" cy="${fy+4}" r="2.6" fill="${c2}" stroke="none"/><circle cx="${50+w*.5}" cy="${t+7}" r="2.4" fill="${c2}" stroke="none"/>`);
  if(a.mark==='stripes')front.push(`<path d="M${39} ${t+6} Q50 ${t+10} ${61} ${t+6} M${33} ${t+13} Q50 ${t+18} ${67} ${t+13}" fill="none" stroke="${O}" stroke-width="3"/>`);
  if(a.mark==='zigzag')front.push(`<polyline points="${50-w*.45},${fy+17} ${50-w*.2},${fy+12} 50,${fy+18} ${50+w*.2},${fy+12} ${50+w*.45},${fy+17}" fill="none" stroke="#b37a00" stroke-width="3"/>`);
  if(a.mark==='star')front.push(`<path d="${starPath(50+w*.5,fy+15,5.5,2.4)}" fill="#fff6a8" stroke-width="1.5"/>`);
  if(a.mark==='scales')front.push(`<path d="M44 ${fy+14} q3 3 6 0 q3 3 6 0 M41 ${fy+20} q3 3 6 0 q3 3 6 0 q3 3 6 0" fill="none" stroke="${c1}" stroke-width="1.8"/>`);
  // face
  const ex=a.shape==='wide'?13:10,ey=fy;
  for(const d of[-1,1]){const X=50+d*ex;
    if(a.eye==='round'||a.eye==='sharp')front.push(`<ellipse cx="${X}" cy="${ey}" rx="4.6" ry="${a.eye==='sharp'?5:5.8}" fill="${O}" stroke="none"/><circle cx="${X+1.4}" cy="${ey-2}" r="1.8" fill="#fff" stroke="none"/>`);
    if(a.eye==='sharp')front.push(`<path d="M${X+d*6} ${ey-10} L${X-d*5} ${ey-6.5}" fill="none" stroke-width="2.6"/>`);
    if(a.eye==='happy')front.push(`<path d="M${X-5} ${ey+1.5} Q${X} ${ey-5} ${X+5} ${ey+1.5}" fill="none" stroke-width="2.8"/>`);
    if(a.eye==='glow')front.push(`<ellipse cx="${X}" cy="${ey}" rx="5" ry="5.6" fill="#ffe96b" stroke-width="1.6"/><ellipse cx="${X}" cy="${ey}" rx="1.4" ry="4" fill="${O}" stroke="none"/>`);
    if(a.eye!=='glow')front.push(`<ellipse cx="${50+d*(ex+8)}" cy="${ey+6}" rx="3.6" ry="2.2" fill="#ff6f93" opacity=".5" stroke="none"/>`);
  }
  front.push(a.eye==='sharp'?`<path d="M45 ${ey+8} Q50 ${ey+11} 55 ${ey+8}" fill="none" stroke-width="2"/><path d="M52 ${ey+9} L53.5 ${ey+12.5} L55 ${ey+8.5}Z" fill="#fff" stroke-width="1.2"/>`
    :a.eye==='glow'?`<path d="M45 ${ey+9} L47.5 ${ey+7} L50 ${ey+9} L52.5 ${ey+7} L55 ${ey+9}" fill="none" stroke="#ffe96b" stroke-width="1.8"/>`
    :`<path d="M46 ${ey+7} Q48 ${ey+10} 50 ${ey+7} Q52 ${ey+10} 54 ${ey+7}" fill="none" stroke-width="2"/>`);
  if(tops.includes('flower')){for(let i=0;i<5;i++){const an=Math.PI*2/5*i-Math.PI/2;front.push(`<circle cx="${(62+Math.cos(an)*5).toFixed(1)}" cy="${(t+4+Math.sin(an)*5).toFixed(1)}" r="4" fill="#ff9ec7" stroke-width="1.6"/>`)}front.push(`<circle cx="62" cy="${t+4}" r="2.8" fill="#ffe066" stroke-width="1.4"/>`)}
  if(tops.includes('crown'))front.push(`<path d="M39 ${t+3} L39 ${t-8} L44.5 ${t-2} L50 ${t-12} L55.5 ${t-2} L61 ${t-8} L61 ${t+3}Z" fill="#ffd34d"/>`);
  if(tops.includes('halo'))front.push(`<ellipse cx="50" cy="${t-(tops.includes('crown')?18:10)}" rx="14" ry="4" fill="none" stroke="#ffe27a" stroke-width="3.2"/>`);
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="${O}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">${back.join('')}<g fill="${c1}">${s.body}</g>${front.join('')}</g></svg>`;
}

/* ============ card html ============ */
function cardHTML(c,o={}){
  const m=MON[c.id],T=TYPES[m.t],v=c.v||'normal';
  return `<div class="card r${m.r} v-${v}${o.cls?' '+o.cls:''}" style="--tc:${T.c};--tc2:${T.c2}">
  <div class="ci"><div class="c-head"><span class="c-no">No.${pad3(m.id)}</span><span class="c-type">${T.n}</span></div>
  <div class="c-art">${art(m)}<span class="c-seal">封</span></div>
  <div class="c-name">${m.name}</div>
  <div class="c-meta"><span class="c-stars">${'★'.repeat(m.r)}</span><span>${c.lv?'Lv'+c.lv:RAR[m.r].n}</span></div></div>
  ${v!=='normal'?`<span class="c-badge">${v==='gold'?'GOLD':'キラ'}</span>`:''}<div class="c-foil"></div></div>`;
}
function backHTML(){return `<div class="card back"><div class="ci"><div class="bk-ring"><span>封</span></div><div class="bk-txt">FUDA</div></div></div>`}
function slotHTML(id){
  const m=MON[id],d=S.dex[id];
  if(d)return cardHTML({id,v:d.gold?'gold':d.holo?'holo':'normal'});
  const head=`<div class="c-head"><span class="c-no">No.${pad3(id)}</span></div>`;
  if(S.seen[id])return `<div class="card slot seen"><div class="ci">${head}<div class="c-art sil">${art(m)}</div><div class="c-name">${m.name}</div><div class="c-meta"><span>見かけた</span><span>${RAR[m.r].n}</span></div></div></div>`;
  return `<div class="card slot"><div class="ci">${head}<div class="c-art q">?</div><div class="c-name">？？？</div><div class="c-meta"><span>未発見</span></div></div></div>`;
}

/* ============ render ============ */
function topHTML(){
  return `<header class="top"><div class="brand"><b>封札</b>モンスターズ</div>
  <span class="pill" title="所持金"><i class="coin"></i>${fmt(S.coins)} 両</span>
  <span class="pill" title="図鑑の登録数">図鑑 ${sealedCount()}/${TOTAL}</span>
  <button class="iconbtn" data-act="mute" aria-label="${S.muted?'音を出す':'音を消す'}">${S.muted?'OFF':'♪'}</button></header>`;
}
function navHTML(){
  const T=[['adventure','旅','ぼうけん'],['party','仲','なかま'],['dex','鑑','ずかん'],['shop','店','ふだや']];
  return `<nav class="tabs"><div class="in">${T.map(([k,i,l])=>`<button class="tab${S.tab===k?' on':''}" data-act="tab" data-arg="${k}"><i>${i}</i>${l}</button>`).join('')}</div></nav>`;
}
function render(){
  const app=$('#app');let h='';
  if(!S.started){h=starterView();app.className='nonav';app.innerHTML=h;return}
  if(B){app.className='nonav';app.innerHTML=topHTML()+battleView();renderCmd();return}
  h=topHTML()+({adventure:advView,party:partyView,dex:dexView,shop:shopView}[S.tab]||advView)()+navHTML();
  app.className='';app.innerHTML=h;
}
function starterView(){
  const opts=[[1,'炎・すばやい'],[5,'水・かたい'],[9,'草・バランス']];
  return `<section class="hero"><p class="eyebrow">見習い封札師の旅</p><h1 class="logo"><em>封札</em><span>モンスターズ</span></h1>
  <p class="lead">野生の魔物を弱らせて、白紙の「封札」に封じこめよう。封じたカードは仲間になって一緒に戦ってくれる。キラやゴールドのカードも探してみてね。</p></section>
  <h2 class="sec">最初の相棒をえらぼう</h2>
  <div class="starters">${opts.map(([id,d])=>`<button class="pick${starterPick===id?' on':''}" data-act="pick" data-arg="${id}" aria-pressed="${starterPick===id}">${cardHTML({id,lv:5})}<span class="desc">${d}</span></button>`).join('')}</div>

function advView(){

    <div class="row"><span>HP</span><span>${lead.hp}/${mx}</span></div><div class="bar"><i style="width:${r*100}%;background:${hpColor(r)}"></i></div>
    <div class="row"><span>次のLvまで</span><span>${need(lead.lv)-lead.exp} EXP</span></div><div class="bar exp"><i style="width:${lead.exp/need(lead.lv)*100}%"></i></div>

    ${lock?`<div class="lockmsg">あと${a.need-n}種類<br>封印で解放</div>`:`<button class="btn shu" data-act="explore" data-arg="${i}">探索</button>`}</div>`}).join('');

function partyView(){

function dexView(){

/* ============ modals ============ */
function openModal(html,mount){const m=$('#modal');m.innerHTML=`<div class="mbox">${html}</div>`;m.hidden=false;m.scrollTop=0;mount&&mount(m)}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';ui.confirm=null}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function tilt(root){const wrap=root.querySelector('.detail');if(!wrap)return;const cd=wrap.querySelector('.card');cd.classList.add('tilted');
  wrap.addEventListener('pointermove',e=>{const r=wrap.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    cd.style.transform=`rotateY(${(x-.5)*22}deg) rotateX(${(.5-y)*22}deg)`;cd.style.setProperty('--mx',(x*200)+'%');cd.style.setProperty('--my',(y*200)+'%')});
  wrap.addEventListener('pointerleave',()=>{cd.style.transform='';})}
function cardInfo(uid){
  const c=card(uid);if(!c)return;const m=MON[c.id],st=mstats(c.id,c.lv),inP=S.party.includes(uid),idx=S.party.indexOf(uid);
  const mv=movesOf(c.id,c.lv).map(x=>`<div><span>${x.n}<span class="tchip" style="--c:${TYPES[x.t].c}">${TYPES[x.t].n}</span></span><span>威力${x.p}</span></div>`).join('');
  const nextBig=(c.lv<12&&m.r<3)?`<div><span class="muted">Lv12で「${MV[m.t][1].n}」</span><span></span></div>`:'';
  const sell=ui.confirm==='sell'+uid?`<div class="confirm">${m.name}を手放して ${sellPrice(c)}両 にする？<button class="btn sm shu" data-act="sell" data-arg="${uid}">手放す</button><button class="btn sm" data-act="cinfo" data-arg="${uid}">やめる</button></div>`
    :`<button class="btn sm dark" data-act="asksell" data-arg="${uid}" ${inP?'disabled title="パーティから外すと手放せます"':''}>手放す +${sellPrice(c)}両</button>`;
  openModal(`<div class="detail">${cardHTML(c)}</div>
  <div class="dinfo"><div class="stats"><div><small>HP</small><b>${c.hp}/${st.hp}</b></div><div><small>こうげき</small><b>${st.atk}</b></div><div><small>ぼうぎょ</small><b>${st.def}</b></div><div><small>すばやさ</small><b>${st.spd}</b></div></div>
  <div class="mvl">${mv}${nextBig}</div>
  <div class="m-act">${inP?`${idx>0?`<button class="btn sm" data-act="lead" data-arg="${uid}">先頭にする</button>`:''}<button class="btn sm" data-act="ptoggle" data-arg="${uid}" ${S.party.length<=1?'disabled':''}>パーティから外す</button>`
    :`<button class="btn sm shu" data-act="ptoggle" data-arg="${uid}" ${S.party.length>=3?'disabled':''}>${S.party.length>=3?'パーティが満員':'パーティに入れる'}</button>`}${sell}</div></div>
  <button class="btn" data-act="close">とじる</button>`,tilt);
}
function dexInfo(id,v){
  const d=S.dex[id];if(!d)return;const m=MON[id];const vs=['normal',d.holo&&'holo',d.gold&&'gold'].filter(Boolean);v=v&&vs.includes(v)?v:vs[vs.length-1];
  const own=S.cards.filter(c=>c.id===id).length;
  openModal(`<div class="detail">${cardHTML({id,v})}</div>
  ${vs.length>1?`<div class="varsel">${vs.map(x=>`<button class="btn sm ${x===v?'shu':''}" data-act="dinfo" data-arg="${id}" data-v="${x}">${{normal:'ノーマル',holo:'キラ',gold:'ゴールド'}[x]}</button>`).join('')}</div>`:''}
  <div class="dinfo"><div class="chips"><span class="chip" style="--c:${TYPES[m.t].c}">${TYPES[m.t].n}タイプ</span><span class="chip lv">${RAR[m.r].n}</span><span class="chip lv">封印 ${d.n}回</span><span class="chip lv">手持ち ${own}枚</span></div>
  <p class="flav">${m.flavor}</p></div><button class="btn" data-act="close">とじる</button>`,tilt);
}
function reveal(list,title){
  return new Promise(res=>{
    const tag=x=>`${x.isNew?'<span class="tag new">NEW!</span>':''}${x.c.v==='holo'?'<span class="tag h">キラカード!</span>':x.c.v==='gold'?'<span class="tag g">ゴールド!!</span>':''}<span class="tag">${RAR[MON[x.c.id].r].n}</span>`;
    openModal(`<h2 class="m-title">${title}</h2><div class="rv-row n${list.length}">${list.map((x,i)=>`<div class="rv"><button class="flip" data-i="${i}" aria-label="カードをめくる"><div class="flipper"><div class="face">${backHTML()}</div><div class="face front">${cardHTML(x.c)}</div></div></button><div class="rv-tag">${tag(x)}</div></div>`).join('')}</div>
    <p class="m-hint">${list.length>1?'カードをタップしてめくろう':'&nbsp;'}</p><div class="m-act">${list.length>1?'<button class="btn" id="rvAll">全部めくる</button>':''}<button class="btn shu" id="rvOk" disabled>図鑑に登録</button></div>`,root=>{
      let open=0;const flips=[...root.querySelectorAll('.flip')];
      const flip=b=>{if(b.classList.contains('open'))return;b.classList.add('open');b.parentElement.classList.add('open');open++;const x=list[+b.dataset.i];
        setTimeout(()=>{x.c.v!=='normal'||MON[x.c.id].r>=3?SFX.ok():SFX.flip()},250);if(open===flips.length)root.querySelector('#rvOk').disabled=false};
      flips.forEach(b=>b.addEventListener('click',()=>flip(b)));
      const all=root.querySelector('#rvAll');if(all)all.addEventListener('click',()=>flips.forEach((b,i)=>setTimeout(()=>flip(b),i*180)));
      root.querySelector('#rvOk').addEventListener('click',()=>{closeModal();res()});
      if(list.length===1)setTimeout(()=>flip(flips[0]),450);
    });
  });
}

/* ============ battle ============ */
function U(side){
  if(side==='foe'){const e=B.enemy;return{m:MON[e.id],lv:e.lv,st:e.st,hp:e.hp,set:v=>{e.hp=v}}}
  const c=card(B.active);return{m:MON[c.id],lv:c.lv,st:mstats(c.id,c.lv),hp:c.hp,set:v=>{c.hp=v}}
}
function battleView(){
  const a=AREAS[B.area];
  return `<section class="battle"><div class="bhead"><span>${a.n}</span><span>封札 白${S.items.white}・銀${S.items.silver}・金${S.items.gold}</span></div>
  <div class="field" id="field" style="--g1:${a.g[0]};--g2:${a.g[1]}"><div class="plat f"></div><div class="plat m"></div>
  <div class="sprite f" id="spF"><div class="bob">${art(MON[B.enemy.id])}</div></div>
  <div class="sprite m" id="spM"><div class="bob">${art(MON[card(B.active).id])}</div></div>
  <div class="plate f" id="plF"></div><div class="plate m" id="plM"></div></div>
  <div class="msg" id="msg" data-act="skip" role="status" aria-live="polite"><span>&nbsp;</span></div>
  <div class="cmd" id="cmd"></div></section>`;
}
function hud(){
  if(!B)return;const f=U('foe'),m=U('me');
  const pl=(u,showN)=>{const r=u.hp/u.st.hp;return `<div class="nm"><span>${u.m.name}<span class="tchip" style="--c:${TYPES[u.m.t].c}">${TYPES[u.m.t].n}</span></span><span class="lv">Lv${u.lv}</span></div>
  <div class="hpl"><b>HP</b><span class="bar"><i style="width:${r*100}%;background:${hpColor(r)}"></i></span></div>${showN?`<div class="hpn">${u.hp}/${u.st.hp}</div>`:''}`};
  const pf=$('#plF'),pm=$('#plM');
  if(pf){const bf=pf.querySelector('.bar>i');if(bf){const r=f.hp/f.st.hp;bf.style.width=r*100+'%';bf.style.background=hpColor(r)}else pf.innerHTML=pl(f,false)}
  if(pm){if(pm.dataset.uid!==String(B.active)){pm.innerHTML=pl(m,true);pm.dataset.uid=B.active}else{const r=m.hp/m.st.hp,bi=pm.querySelector('.bar>i');bi.style.width=r*100+'%';bi.style.background=hpColor(r);pm.querySelector('.hpn').textContent=`${m.hp}/${m.st.hp}`}}
}
function sealRate(k){const e=B.enemy;const r=e.hp/e.st.hp;return clamp((1-.72*r)*ITEMS[k].mul*RAR[MON[e.id].r].seal,.03,.97)}
function renderCmd(){
  const el=$('#cmd');if(!el||!B)return;hud();el.classList.toggle('busy',!!B.busy);let h='';
  const back=B.forced?'':`<button class="cbtn wide ghost" data-act="menu" data-arg="main">もどる</button>`;
  if(B.menu==='main'){
    const fc=S.items.white+S.items.silver+S.items.gold;
    h=`<button class="cbtn" data-act="menu" data-arg="moves"><b>たたかう</b><small>技で弱らせる</small></button>
    <button class="cbtn shu" data-act="menu" data-arg="seal"><b>封印する</b><small>封札 のこり${fc}枚</small></button>
    <button class="cbtn" data-act="menu" data-arg="item"><b>どうぐ</b><small>回復の香 ×${S.items.potion}</small></button>
    <button class="cbtn" data-act="menu" data-arg="switch" ${partyCards().filter(c=>c.hp>0&&c.uid!==B.active).length?'':'disabled'}><b>いれかえ</b><small>カードを交代</small></button>
    <button class="cbtn wide ghost" data-act="run">にげる</button>`;
  }else if(B.menu==='moves'){
    const me=U('me');
    h=movesOf(me.m.id,me.lv).map((x,i)=>{const e=eff(x.t,MON[B.enemy.id].t);return `<button class="cbtn" data-act="move" data-arg="${i}"><b>${x.n}</b><small><span class="tchip" style="--c:${TYPES[x.t].c};margin:0">${TYPES[x.t].n}</span> 威力${x.p}${e>1?' ・ばつぐん':e<1?' ・いまひとつ':''}</small></button>`}).join('')+back;
  }else if(B.menu==='seal'){
    h=['white','silver','gold'].map(k=>`<button class="cbtn${k==='white'?' wide':''}" data-act="seal" data-arg="${k}" ${S.items[k]?'':'disabled'}><b><span class="fchip" style="--fc:${ITEMS[k].fc}"></span>${ITEMS[k].n}<span class="rate">${Math.round(sealRate(k)*100)}%</span></b><small>のこり ${S.items[k]}枚</small></button>`).join('')+back;
  }else if(B.menu==='item'){
    const me=U('me');h=`<button class="cbtn wide" data-act="potion" ${S.items.potion&&me.hp<me.st.hp?'':'disabled'}><b>回復の香</b><small>${me.m.name}のHPを半分回復・のこり${S.items.potion}個</small></button>`+back;
  }else if(B.menu==='switch'){
    h=partyCards().filter(c=>c.uid!==B.active).map(c=>{const mx=maxHP(c);return `<button class="cbtn" data-act="switch" data-arg="${c.uid}" ${c.hp>0?'':'disabled'}><b>${MON[c.id].name}</b><small>Lv${c.lv}・HP ${c.hp}/${mx}</small></button>`}).join('')+back;
  }
  el.innerHTML=h;
}
let skipFn=null;
function say(t,ms){const el=$('#msg');if(el)el.innerHTML=`<span>${t}</span><i class="caret">▼</i>`;
  return new Promise(r=>{const done=()=>{clearTimeout(tm);skipFn=null;r()};const tm=setTimeout(done,ms||Math.max(900,420+t.length*48));skipFn=done})}
function spr(side){return $(side==='foe'?'#spF':'#spM')}
function popup(side,txt,crit){const f=$('#field'),s=spr(side);if(!f||!s)return;const fr=f.getBoundingClientRect(),r=s.getBoundingClientRect();
  const p=document.createElement('div');p.className='pop'+(crit?' crit':'');p.textContent=txt;p.style.left=(r.left-fr.left+r.width/2-16)+'px';p.style.top=(r.top-fr.top+r.height*.2)+'px';f.appendChild(p);
  p.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-34px)',opacity:0}],{duration:900,easing:'ease-out',fill:'forwards'});setTimeout(()=>p.remove(),950)}

async function startBattle(ai){
  const alive=partyCards().filter(c=>c.hp>0);
  if(!alive.length){toast('元気なカードがいないよ。キャンプで休もう');return}
  const a=AREAS[ai],id=pickWeighted(a.pool),lv=rnd(a.lv[0],a.lv[1]),st=mstats(id,lv);
  S.seen[id]=true;
  B={area:ai,enemy:{id,lv,st,hp:st.hp},active:alive[0].uid,menu:'main',busy:true,forced:false};
  render();SFX.sel();
  const f=spr('foe');f&&f.animate([{transform:'translateX(60px)',opacity:0},{transform:'none',opacity:1}],{duration:RM?1:450,easing:'ease-out'});
  await say(`あっ！ 野生の ${MON[id].name} が あらわれた！`);
  await say(`いけっ！ ${MON[card(B.active).id].name}！`,800);
  await say(`どうする？`,1);
  B.busy=false;renderCmd();
}
function pickFoeMove(){const L=movesOf(B.enemy.id,B.enemy.lv);if(L.length>2&&Math.random()<.4)return L[2];return L[rnd(0,L.length-1)]}
async function attack(side,mv){
  const other=side==='me'?'foe':'me',A=U(side),D=U(other);
  await say(`${side==='foe'?'野生の ':''}${A.m.name}の ${mv.n}！`,750);
  const s=spr(side);if(s){const dx=side==='me'?24:-24,dy=side==='me'?-14:14;s.animate([{transform:'none'},{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:RM?1:260,easing:'ease-out'})}
  await sleep(200);
  if(Math.random()>mv.acc){await say('しかし はずれた！',800);return}
  const e=eff(mv.t,D.m.t),stab=mv.t===A.m.t?1.2:1,crit=Math.random()<.07?1.5:1;
  const base=((2*A.lv/5+2)*mv.p*A.st.atk/Math.max(1,D.st.def))/50+2;
  const dmg=Math.max(1,Math.floor(base*stab*e*crit*(.85+Math.random()*.15)));
  D.set(Math.max(0,D.hp-dmg));
  const t=spr(other);if(t)t.animate([{transform:'none',opacity:1},{transform:'translateX(-6px)',opacity:.3},{transform:'translateX(6px)',opacity:1},{transform:'translateX(-4px)',opacity:.3},{transform:'none',opacity:1}],{duration:RM?1:380});
  (e>1||crit>1?SFX.crit:SFX.hit)();popup(other,'-'+dmg,e>1||crit>1);hud();await sleep(450);
  if(crit>1)await say('きゅうしょに あたった！',800);
  if(e>1)await say('こうかは ばつぐんだ！',850);else if(e<1)await say('こうかは いまひとつのようだ…',850);
}
async function checkFaint(){
  if(B.enemy.hp<=0){const f=spr('foe');f&&f.animate([{transform:'none',opacity:1},{transform:'translateY(30px)',opacity:0}],{duration:RM?1:500,fill:'forwards'});
    await say(`野生の ${MON[B.enemy.id].name} は たおれた！`);await win();return true}
  const c=card(B.active);
  if(c.hp<=0){const s=spr('me');s&&s.animate([{transform:'none',opacity:1},{transform:'translateY(30px)',opacity:0}],{duration:RM?1:500,fill:'forwards'});
    await say(`${MON[c.id].name} は たおれてしまった…`);
    if(partyCards().some(x=>x.hp>0)){B.forced=true;await say('次に出すカードを えらんでね',1);return true}
    await lose();return true}
  return false;
}
async function giveExp(x){
  for(const c of partyCards()){if(c.hp<=0)continue;const g=c.uid===B.active?x:Math.floor(x*.4);if(!g)continue;const m=MON[c.id];c.exp+=g;
    if(c.uid===B.active)await say(`${m.name} は ${g} けいけんちを もらった！`,900);
    while(c.lv<50&&c.exp>=need(c.lv)){const old=maxHP(c);c.exp-=need(c.lv);c.lv++;c.hp=Math.min(maxHP(c),c.hp+maxHP(c)-old);SFX.lvl();hud();
      await say(`${m.name} は Lv${c.lv} に あがった！`,1000);
      if(c.lv===12&&m.r<3)await say(`${m.name} は 大技「${MV[m.t][1].n}」を おぼえた！`,1200)}}
}
async function win(){
  const e=B.enemy,m=MON[e.id],coins=e.lv*6+rnd(0,e.lv*3);S.coins+=coins;S.wins++;
  await say(`${coins}両 を 手に入れた！`,900);await giveExp(Math.floor(e.lv*RAR[m.r].exp*.7));endBattle();
}
async function lose(){
  const lost=Math.floor(S.coins*.1);S.coins-=lost;
  await say('目の前が まっくらに なった…',1300);
  partyCards().forEach(c=>c.hp=maxHP(c));endBattle();
  openModal(`<h2 class="m-title">キャンプに戻った</h2><p class="lost">カードたちはゆっくり休んで元気になったよ。<br>あわてて逃げたので ${lost}両 落としてしまった。</p><button class="btn shu" data-act="close">もう一度がんばる</button>`);
}
function endBattle(){B=null;skipFn=null;save();render()}
async function seal(k){
  S.items[k]--;save();const I=ITEMS[k],e=B.enemy,m=MON[e.id],p=sealRate(k);
  await say(`${I.n}を 投げた！`,600);
  const f=$('#field'),sf=spr('foe'),sm=spr('me');const fr=f.getBoundingClientRect(),r1=sm.getBoundingClientRect(),r2=sf.getBoundingClientRect();
  const fly=document.createElement('div');fly.className='flying';fly.innerHTML=`<div class="card" style="--tc:#999;--tc2:#eee"><div class="ci" style="background:${I.fc};padding:0;border-width:2px;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:14px">封</div></div>`;f.appendChild(fly);
  const x0=r1.left-fr.left+r1.width*.5-20,y0=r1.top-fr.top+r1.height*.3,x1=r2.left-fr.left+r2.width*.5-20,y1=r2.top-fr.top+r2.height*.5-10;
  SFX.throw();
  await fly.animate([{transform:`translate(${x0}px,${y0}px) rotate(0) scale(.8)`},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-60}px) rotate(360deg) scale(1)`},{transform:`translate(${x1}px,${y1}px) rotate(720deg) scale(1)`}],{duration:RM?1:650,easing:'ease-out',fill:'forwards'}).finished;
  const suck=sf.animate([{transform:'none',filter:'brightness(1)',opacity:1},{transform:'scale(.1) translateY(40px)',filter:'brightness(5)',opacity:0}],{duration:RM?1:450,fill:'forwards'});
  await suck.finished;
  let ok=true,stage=0;const each=Math.pow(p,1/3);
  for(stage=0;stage<3;stage++){await sleep(420);SFX.wob();
    await fly.animate([{transform:`translate(${x1}px,${y1}px) rotate(0)`},{transform:`translate(${x1}px,${y1}px) rotate(-18deg)`},{transform:`translate(${x1}px,${y1}px) rotate(14deg)`},{transform:`translate(${x1}px,${y1}px) rotate(0)`}],{duration:RM?1:420}).finished;
    if(Math.random()>each){ok=false;break}}
  if(!ok){SFX.fail();fly.animate([{opacity:1,transform:`translate(${x1}px,${y1}px) scale(1)`},{opacity:0,transform:`translate(${x1}px,${y1}px) scale(1.8) rotate(30deg)`}],{duration:RM?1:300,fill:'forwards'});
    suck.cancel();sf.animate([{transform:'scale(.3)',filter:'brightness(4)'},{transform:'scale(1.1)',filter:'brightness(1.3)'},{transform:'none',filter:'none'}],{duration:RM?1:380});
    setTimeout(()=>fly.remove(),320);
    await say(['ああっ！ 札から 飛び出してしまった！','おしい！ もう少しで 封じられたのに！','あとちょっとだった…！'][stage]);return false}
  fly.animate([{filter:'brightness(1)'},{filter:'brightness(2.2) drop-shadow(0 0 12px #fff)'},{filter:'brightness(1)'}],{duration:RM?1:600});
  SFX.ok();await say(`やった！ ${m.name} を 封印した！`,1200);
  const before=sealedCount();
  const v=rollVariant(I.holo,I.gold),res=newCard(e.id,e.lv,v);res.c.hp=Math.max(1,Math.floor(maxHP(res.c)*.5));
  const x=Math.floor(e.lv*RAR[m.r].exp*.45);
  save();
  await reveal([res],v==='gold'?'ゴールドカードだ！':v==='holo'?'キラカードだ！':'封印成功！');
  await giveExp(x);
  const na=AREAS.find(a=>a.need>before&&a.need<=sealedCount());
  if(na)await say(`新しいエリア「${na.n}」に 行けるようになった！`,1500);
  endBattle();return true;
}
async function turn(kind,arg){
  if(!B||B.busy)return;B.busy=true;renderCmd();
  try{
    if(kind==='move'){
      const me=U('me'),foe=U('foe'),mv=movesOf(me.m.id,me.lv)[arg],fm=pickFoeMove();
      const first=me.st.spd>foe.st.spd||(me.st.spd===foe.st.spd&&Math.random()<.5);
      if(first){await attack('me',mv);if(await checkFaint())return;await attack('foe',fm);if(await checkFaint())return}
      else{await attack('foe',fm);if(await checkFaint())return;await attack('me',mv);if(await checkFaint())return}
    }else if(kind==='seal'){
      if(await seal(arg))return;await attack('foe',pickFoeMove());if(await checkFaint())return;
    }else if(kind==='potion'){
      const c=card(B.active),mx=maxHP(c),h=Math.min(mx-c.hp,Math.ceil(mx/2));S.items.potion--;c.hp+=h;hud();SFX.lvl();
      await say(`回復の香で ${MON[c.id].name} の HPが ${h} 回復した！`);await attack('foe',pickFoeMove());if(await checkFaint())return;
    }else if(kind==='switch'){
      const was=B.forced;B.forced=false;const prev=card(B.active);B.active=+arg;
      const sm=spr('me');sm.innerHTML=`<div class="bob">${art(MON[card(B.active).id])}</div>`;sm.getAnimations().forEach(a=>a.cancel());
      sm.animate([{transform:'translateX(-40px)',opacity:0},{transform:'none',opacity:1}],{duration:RM?1:350});hud();
      if(!was)await say(`もどれ、${MON[prev.id].name}！`,700);
      await say(`いけっ！ ${MON[card(B.active).id].name}！`,800);
      if(!was){await attack('foe',pickFoeMove());if(await checkFaint())return}
    }else if(kind==='run'){
      const me=U('me'),foe=U('foe');
      if(Math.random()<clamp(.55+(me.st.spd-foe.st.spd)/60,.3,.95)){await say('うまく にげきれた！',900);endBattle();return}
      await say('にげられなかった！',800);await attack('foe',pickFoeMove());if(await checkFaint())return;
    }
    await say('どうする？',1);
  }finally{if(B){B.busy=false;B.menu=B.forced?'switch':'main';renderCmd();save()}}
}

/* ============ actions ============ */
const ACT={
  tab:a=>{S.tab=a;ui.confirm=null;ui.tip=(ui.tip+1)%TIPS.length;save();render();scrollTo(0,0)},
  pick:a=>{starterPick=+a;SFX.sel();render()},
  start:()=>{S.started=true;newCard(starterPick,5,'normal');save();render();SFX.ok();
    const c=S.cards[0];reveal([{c,isNew:true}],'相棒のカードを手に入れた！')},
  mute:()=>{S.muted=!S.muted;save();render()},
  rest:()=>{S.cards.forEach(c=>c.hp=maxHP(c));save();render();SFX.lvl();toast('みんな元気になった！')},
  explore:a=>startBattle(+a),
  skip:()=>{skipFn&&skipFn()},
  menu:a=>{if(B.busy)return;B.menu=a;SFX.sel();renderCmd()},
  move:a=>turn('move',+a),seal:a=>turn('seal',a),potion:()=>turn('potion'),switch:a=>turn('switch',a),run:()=>turn('run'),
  cinfo:a=>{ui.confirm=null;cardInfo(+a)},
  asksell:a=>{ui.confirm='sell'+a;cardInfo(+a)},
  sell:a=>{const c=card(+a);if(!c||S.party.includes(c.uid))return;S.coins+=sellPrice(c);S.cards=S.cards.filter(x=>x.uid!==c.uid);save();closeModal();render();toast(`${sellPrice(c)}両 になった`)},
  ptoggle:a=>{const u=+a;if(S.party.includes(u)){if(S.party.length<=1)return;S.party=S.party.filter(x=>x!==u)}else if(S.party.length<3)S.party.push(u);save();render();cardInfo(u)},
  lead:a=>{const u=+a;S.party=[u,...S.party.filter(x=>x!==u)];save();render();cardInfo(u)},
  dinfo:(a,b)=>dexInfo(+a,b.dataset.v),
  buy:a=>{const I=ITEMS[a];if(S.coins<I.price)return;S.coins-=I.price;S.items[a]++;save();render();SFX.sel();toast(`${I.n}を買った`)},
  pack:async()=>{if(S.coins<PACK_PRICE)return;S.coins-=PACK_PRICE;
    const pool=[];for(let i=1;i<=TOTAL;i++)if(MON[i].r<4)pool.push(i);
    const ids=[pickWeighted(pool),pickWeighted(pool),pickWeighted(pool)];
    if(ids.every(i=>MON[i].r<2))ids[2]=pickWeighted(pool.filter(i=>MON[i].r>=2));
    const got=ids.map(id=>newCard(id,rnd(5,12),rollVariant(.15,.03)));save();render();SFX.throw();
    await reveal(got,'封札パック開封！');render()},
  askreset:()=>{ui.confirm='reset';render()},
  cancel:()=>{ui.confirm=null;render()},
  reset:()=>{S=fresh();B=null;ui.confirm=null;starterPick=1;save();render();scrollTo(0,0)},
  close:()=>{closeModal();render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.arg,b)});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!e.target.querySelector('#rvOk'))closeModal()});
render();
</script>
