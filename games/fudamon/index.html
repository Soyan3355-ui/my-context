<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>封札モンスターズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --night:#14162e;--night2:#1f2347;--night3:#2c3162;--line:#3d4380;
  --paper:#f7f0de;--paper2:#e6d9bb;--ink:#2b2440;
  --shu:#d8432c;--shu2:#f06a4f;--gold:#e6b34f;
  --text:#eeeaf8;--muted:#a7a9d2;--good:#5ecb8a;--warn:#f2c14e;--bad:#ef5b5b;
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-dot:"DotGothic16","Osaka-Mono","MS Gothic",monospace;
  --padh:0px;
}
@media (pointer:coarse),(max-width:700px){:root{--padh:176px}}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#0c0d1f radial-gradient(120% 80% at 50% 0%,#23275a 0%,#0c0d1f 70%) fixed;color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
#game{width:min(100%,1120px,calc((100dvh - var(--padh) - 28px) * 16 / 11));margin:0 auto;padding-top:12px;min-height:100dvh;justify-content:center;box-sizing:border-box;padding-bottom:12px;display:flex;flex-direction:column;gap:10px;padding-inline:0}
@media (max-width:700px){#game{width:min(calc(100% - 16px),calc((100dvh - var(--padh) - 20px) * 16 / 11));padding-top:8px}}
#screen{position:relative;width:100%;aspect-ratio:16/11;container-type:size;overflow:hidden;border-radius:14px;background:#0b0a18;box-shadow:0 0 0 3px #0a0a16,0 0 0 5px #3d4380,0 20px 60px #000a}
#view{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#trans,#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
#fx{z-index:65}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- world HUD ---------- */
#banner{position:absolute;left:2.5cqw;top:2.5cqw;z-index:5;font-family:var(--f-disp);font-size:min(3.4cqw,24px);color:var(--ink);background:var(--paper);padding:.6cqw 2.4cqw .6cqw 1.8cqw;border-radius:.6cqw;border:.4cqw solid var(--ink);opacity:0;transform:translateX(-120%);pointer-events:none;box-shadow:.5cqw .5cqw 0 #0005}
#banner::before{content:"";display:inline-block;width:1.2cqw;height:2.6cqw;background:var(--shu);margin-right:1.2cqw;vertical-align:-.3cqw;border-radius:.2cqw}
#banner.show{animation:banner 2.8s ease forwards}
@keyframes banner{0%{opacity:0;transform:translateX(-120%)}12%{opacity:1;transform:none}80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-20%)}}
#objective{position:absolute;right:2.5cqw;top:2.5cqw;z-index:5;max-width:44cqw;font-size:min(2.3cqw,15px);font-weight:700;color:var(--paper);background:#14162ecc;border:.3cqw solid #e6b34f88;border-radius:1cqw;padding:.8cqw 1.6cqw;pointer-events:none;opacity:0}
#objective small{display:block;color:var(--gold);font-size:.8em;letter-spacing:.15em;font-weight:900}
#objective.show{animation:obj 7s ease forwards}
@keyframes obj{0%{opacity:0;transform:translateY(-10px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;top:14cqh;transform:translateX(-50%);z-index:90;background:var(--paper);color:var(--ink);font-weight:900;border:.4cqw solid var(--ink);border-radius:1.2cqw;padding:1cqw 2.4cqw;font-size:min(2.8cqw,18px);opacity:0;pointer-events:none;white-space:nowrap;box-shadow:0 .6cqw 0 #0006}
#toast.show{animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}

/* ---------- dialogue ---------- */
#dlg{position:absolute;left:2cqw;right:2cqw;bottom:2cqh;z-index:40;min-height:25cqh;background:var(--paper);color:var(--ink);border-radius:1.4cqw;border:.5cqw solid var(--ink);box-shadow:inset 0 0 0 .5cqw var(--paper),inset 0 0 0 .8cqw #c9b98f,0 .8cqw 0 #0007;padding:2.6cqh 3cqw;font-family:var(--f-dot);font-size:min(3.9cqw,26px);line-height:1.6;cursor:pointer}
#dlg .dname{position:absolute;left:2.4cqw;top:-3.6cqw;background:var(--shu);color:#fff;font-family:var(--f-body);font-weight:900;font-size:min(2.6cqw,17px);padding:.3cqw 2cqw;border-radius:.8cqw .8cqw 0 0;border:.4cqw solid var(--ink);border-bottom:0;letter-spacing:.05em}
#dlg .dtext b{color:var(--shu)}
#dlg .caret{position:absolute;right:2.6cqw;bottom:1.8cqh;width:0;height:0;border-left:1.1cqw solid transparent;border-right:1.1cqw solid transparent;border-top:1.4cqw solid var(--shu);animation:caret .7s ease-in-out infinite}
@keyframes caret{50%{transform:translateY(.6cqw)}}
#choice{position:absolute;right:2cqw;bottom:31cqh;z-index:45;display:flex;flex-direction:column;gap:.6cqw;background:var(--paper);border:.5cqw solid var(--ink);border-radius:1.4cqw;padding:1cqw;box-shadow:0 .8cqw 0 #0007;min-width:24cqw}
#choice button{background:none;border:0;text-align:left;padding:.8cqw 2cqw .8cqw 4cqw;font-family:var(--f-dot);font-size:min(3.4cqw,22px);color:var(--ink);cursor:pointer;border-radius:.8cqw;position:relative}
#choice button.sel{background:#2b24400f}
#choice button.sel::before,.pbtn.sel::before,.mm-it.sel::before{content:"";position:absolute;left:1.2cqw;top:50%;margin-top:-1cqw;border-top:1cqw solid transparent;border-bottom:1cqw solid transparent;border-left:1.3cqw solid var(--shu)}

/* ---------- panel / menus ---------- */
#panel{position:absolute;inset:0;z-index:50;background:#14162ef2;display:flex;flex-direction:column;animation:pin .18s ease-out}
#panel.menu{background:linear-gradient(90deg,#14162e00 0%,#14162ecc 40%,#14162ef5 100%)}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:center;gap:2cqw;padding:1.6cqw 2.4cqw;border-bottom:.3cqw solid var(--line);flex-wrap:wrap}
.ph h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:min(3.6cqw,26px)}
.ph span{color:var(--muted);font-size:min(2.3cqw,15px);font-weight:700;margin-left:auto}
.pback{background:var(--night3);border:.3cqw solid var(--line);border-radius:1cqw;padding:.5cqw 2cqw;font-weight:900;font-size:min(2.4cqw,15px);cursor:pointer;color:var(--text)}
.pback.sel{border-color:var(--gold)}
.pbody{flex:1;overflow-y:auto;padding:2cqw 2.4cqw 3cqw;display:flex;flex-direction:column;gap:1.6cqw;font-size:min(2.6cqw,16px)}
.lbl{margin:0;font-size:min(2.2cqw,14px);color:var(--muted);font-weight:900;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15cqw,1fr));gap:1.8cqw}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,17cqw));gap:2cqw}
.slotempty{aspect-ratio:5/7;border-radius:1.4cqw;border:.3cqw dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:min(2.2cqw,13px);font-weight:700}
.gcell{background:none;border:0;padding:.6cqw;cursor:pointer;display:flex;flex-direction:column;gap:.6cqw;min-width:0;border-radius:1.4cqw;transition:transform .12s}
.gcell.sel{background:#e6b34f22;box-shadow:0 0 0 .4cqw var(--gold);transform:translateY(-.5cqw)}
.gcell:disabled{opacity:.4}
.gcell .sub{display:flex;align-items:center;gap:.8cqw;font-size:min(1.9cqw,12px);font-weight:700;color:var(--muted)}
.gcell .sub .bar{flex:1}
.gcell.inparty .card .ci{box-shadow:0 0 0 1.4cqw var(--shu)}
.lead-tag{font-size:min(1.8cqw,11px);font-weight:900;background:var(--shu);color:#fff;border-radius:99px;padding:0 1cqw}
.bar{display:block;height:1.1cqw;min-height:5px;border-radius:99px;background:#0e1026;overflow:hidden;border:1px solid #0000004d}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--good);transition:width .55s ease,background-color .3s}
.bar.exp>i{background:#6fb6ff}
.bar.h>i{background:linear-gradient(90deg,#ff7ad9,#7ae0ff,#b9ff7a)}
.bar.g>i{background:linear-gradient(90deg,#fff1b0,#e6b34f)}
.progress{display:grid;gap:.8cqw}
.prow{display:grid;grid-template-columns:9cqw 1fr 7cqw;gap:1.4cqw;align-items:center;font-size:min(2.2cqw,13px);font-weight:700}
.prow span:last-child{text-align:right;font-family:var(--f-dot)}
.pips{display:flex;justify-content:center;gap:.6cqw}
.pips i{font-style:normal;font-size:min(1.7cqw,10px);font-weight:900;width:2.8cqw;height:2.8cqw;display:grid;place-items:center;border-radius:.6cqw;background:#ffffff0d;color:#ffffff40;border:1px solid #ffffff1a}
.pips i.on{background:var(--paper);color:var(--ink)}
.pips i.on.h{background:linear-gradient(135deg,#ff9ee6,#8fe8ff,#d2ff8f)}
.pips i.on.g{background:linear-gradient(135deg,#fff1b0,#e6b34f)}
.detailwrap{flex-direction:row;align-items:flex-start;gap:3cqw}
.detail{width:30cqw;flex:none;perspective:900px}
.detail .card{transition:transform .15s ease-out}
.dinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.4cqw}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1cqw;text-align:center}
.stats div{background:#ffffff0c;border-radius:1cqw;padding:.8cqw .4cqw}
.stats small{display:block;font-size:min(1.9cqw,11px);color:var(--muted);font-weight:700}
.stats b{font-family:var(--f-dot);font-size:min(3cqw,19px);font-weight:400}
.expl{display:flex;flex-direction:column;gap:.6cqw;font-size:min(2cqw,12px);color:var(--muted);font-weight:700}
.mvl{display:flex;flex-direction:column;gap:.6cqw;font-size:min(2.4cqw,15px)}
.mvl>div{display:flex;justify-content:space-between;gap:1cqw;border-bottom:1px dashed var(--line);padding-bottom:.5cqw}
.mvl span:last-child{font-family:var(--f-dot);color:var(--muted)}
.flav{margin:0;font-size:min(2.4cqw,15px);color:#dcdcf5;line-height:1.7}
.acts{display:flex;gap:1.2cqw;flex-wrap:wrap}
.pbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:1cqw;background:var(--paper);color:var(--ink);border:.4cqw solid var(--ink);box-shadow:0 .6cqw 0 var(--ink);border-radius:1.4cqw;padding:1cqw 2.6cqw 1cqw 3.6cqw;font-weight:900;font-size:min(2.6cqw,16px);cursor:pointer}
.pbtn.shu{background:var(--shu);color:#fff}
.pbtn.shu.sel::before{border-left-color:#fff}
.pbtn.wide{width:100%}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.pbtn.sel{transform:translateY(-.3cqw);box-shadow:0 .9cqw 0 var(--ink),0 0 0 .5cqw var(--gold)}
.chips{display:flex;gap:.8cqw;flex-wrap:wrap}
.chip{font-size:min(2cqw,12px);font-weight:900;padding:.2cqw 1.4cqw;border-radius:99px;background:var(--c,#fff3);color:#fff;border:1px solid #0004}
.chip.lv{background:#ffffff1a;color:var(--text)}
.tchip{display:inline-block;font-size:.72em;font-weight:900;padding:0 .9em;border-radius:99px;background:var(--c);color:#fff;vertical-align:middle;margin-left:.5em;line-height:1.5;font-family:var(--f-body)}
.muted{color:var(--muted)}
/* main menu */
.mm{display:flex;height:100%;flex-direction:row-reverse}
.mm-side{width:34cqw;background:var(--paper);color:var(--ink);border-left:.5cqw solid var(--ink);display:flex;flex-direction:column;padding:2cqw 1.6cqw;gap:.6cqw;box-shadow:-1cqw 0 0 #0004;animation:slin .2s ease-out}
@keyframes slin{from{transform:translateX(100%)}to{transform:none}}
.mm-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.3cqw dashed #2b244055;padding-bottom:1cqw;margin-bottom:.6cqw}
.mm-head b{font-family:var(--f-disp);font-weight:400;font-size:min(3.2cqw,22px)}
.mm-head span{font-family:var(--f-dot);font-size:min(2.5cqw,16px)}
.mm-it{position:relative;display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:.8cqw 1cqw .8cqw 4cqw;cursor:pointer;border-radius:1cqw;text-align:left;color:var(--ink)}
.mm-it b{font-size:min(3cqw,19px);font-weight:900;line-height:1.2}
.mm-it small{font-size:min(1.9cqw,12px);opacity:.65;font-weight:700}
.mm-it.sel{background:#2b244012}
.mm-party{flex:1;display:flex;flex-wrap:wrap;align-content:flex-end;gap:2cqw;padding:3cqw}
.mm-card{width:15cqw;display:flex;flex-direction:column;gap:.8cqw}
.mm-time{width:100%;margin:0;font-family:var(--f-dot);color:var(--paper);font-size:min(2.3cqw,15px)}
.bag{display:flex;flex-direction:column;gap:1.2cqw}
.bagrow,.shoprow{display:grid;grid-template-columns:6cqw 1fr auto;gap:2cqw;align-items:center;background:#ffffff0a;border:.3cqw solid var(--line);border-radius:1.4cqw;padding:1.2cqw 2cqw;text-align:left;color:var(--text)}
.shoprow{cursor:pointer}
.shoprow.sel{border-color:var(--gold);background:#e6b34f1a}
.shoprow:disabled{opacity:.45}
.bagrow b,.shoprow b{display:block;font-size:min(2.7cqw,17px)}
.bagrow small,.shoprow small{display:block;font-size:min(2cqw,12px);color:var(--muted);font-weight:700}
.cnt,.pr{font-family:var(--f-dot);font-size:min(2.8cqw,18px);text-align:right}
.pr small{font-family:var(--f-body)}
.ico{width:4.4cqw;height:6cqw;border-radius:.6cqw;border:.35cqw solid var(--ink);background:var(--fc);position:relative;justify-self:center;box-shadow:0 .4cqw 0 #0006}
.ico::after{content:"封";position:absolute;inset:.8cqw .6cqw;border:1px solid #2b244077;display:grid;place-items:center;font-family:var(--f-disp);font-size:min(1.8cqw,11px);color:#2b2440aa}
.ico.pot{border-radius:50% 50% 40% 40%;height:5.2cqw;background:radial-gradient(circle at 40% 35%,#fff,#9be7c4 40%,#3fa57a)}
.ico.pot::after,.ico.badge::after{content:"";border:0}
.ico.pack{background:linear-gradient(135deg,#3a3f82,#1d2048);border-color:var(--gold)}
.ico.pack::after{color:var(--gold);border-color:#e6b34f88}
.ico.badge{border-radius:50%;height:4.4cqw;background:radial-gradient(circle at 40% 35%,#fff1b0,#e6b34f 55%,#a8772a);box-shadow:inset 0 0 0 .6cqw #d8432c}
.keys{display:flex;flex-direction:column;gap:.4cqw;font-size:min(2.3cqw,14px);color:var(--muted);background:#ffffff08;border-radius:1.2cqw;padding:1.4cqw 2cqw}
.keys b{color:var(--text)}

/* ---------- modal: reveal / starter ---------- */
#modal{position:absolute;inset:0;z-index:60;background:#0a0b1cd9;display:flex;align-items:center;justify-content:center;animation:pin .2s ease-out}
.rvbox{width:100%;max-width:100cqw;display:flex;flex-direction:column;align-items:center;gap:2cqh;padding:2cqw 4cqw}
.m-title{font-family:var(--f-disp);font-weight:400;font-size:min(4.2cqw,30px);margin:0;text-align:center;color:var(--paper);text-shadow:0 .4cqw 0 #0008}
.m-hint{margin:0;font-size:min(2.2cqw,13px);color:var(--muted)}
.m-act{display:flex;gap:2cqw}
.rv-row{display:grid;gap:3cqw;justify-content:center}
.rv-row.n1{grid-template-columns:26cqw}
.rv-row.n3{grid-template-columns:repeat(3,22cqw)}
.rv{display:flex;flex-direction:column;gap:1cqw;align-items:center}
.flip{width:100%;perspective:900px;cursor:pointer}
.flipper{position:relative;width:100%;aspect-ratio:5/7;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.5,.5,1)}
.flip.open .flipper{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.face>.card{width:100%;height:100%;aspect-ratio:auto;min-width:0;min-height:0}
.rv-tag{visibility:hidden;display:flex;align-items:center;gap:.6cqw;flex-wrap:wrap;justify-content:center;min-height:3cqw}
.rv.open .rv-tag{visibility:visible;animation:pop .4s .3s both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.tag{display:inline-flex;align-items:center;line-height:1.4;font-size:min(2cqw,12px);font-weight:900;padding:.1cqw 1.4cqw;border-radius:99px;background:var(--paper);color:var(--ink)}
.tag.new{background:var(--shu);color:#fff}
.tag.h{background:linear-gradient(90deg,#ff9ee6,#8fe8ff,#d2ff8f)}
.tag.g{background:linear-gradient(90deg,#fff1b0,#e6b34f)}
.pick{background:none;border:0;padding:1cqw;cursor:pointer;display:flex;flex-direction:column;gap:1.2cqw;align-items:center;border-radius:1.6cqw;transition:transform .2s}
.pick .card{transition:transform .25s,filter .25s;filter:saturate(.6) brightness(.75)}
.pick.sel .card{transform:translateY(-1.4cqw) rotate(-2deg) scale(1.04);filter:none}
.pdesc{font-size:min(2.1cqw,13px);color:var(--muted);font-weight:700;text-align:center;line-height:1.4}
.pdesc b{display:block;color:var(--paper);font-size:1.15em}
.pick.sel .pdesc{color:var(--paper)}

/* ---------- battle ---------- */
#battle{position:absolute;inset:0;z-index:30}
.bt{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 58%,var(--g2) 100%)}
.bt-sky{position:absolute;inset:0}
.bt-sky .hill{position:absolute;left:-10%;right:-10%;top:38%;height:40%;background:radial-gradient(60% 100% at 30% 100%,#ffffff40,transparent 70%),radial-gradient(50% 90% at 80% 100%,#00000014,transparent 70%)}
.bt-sky .cl{position:absolute;height:4cqw;border-radius:99px;background:#ffffff8c;box-shadow:3cqw -1.4cqw 0 .6cqw #ffffff8c,-2cqw -.8cqw 0 0 #ffffff8c;animation:cloud 40s linear infinite}
.bt-sky .cl.a{width:12cqw;top:9%;left:-20%}
.bt-sky .cl.b{width:8cqw;top:22%;left:-20%;animation-duration:58s;animation-delay:-25s;opacity:.7}
@keyframes cloud{to{transform:translateX(150cqw)}}
.bt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000000a 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
.bt-plat{position:absolute;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--fl) 85%,#fff) 0%,var(--fl) 70%,color-mix(in srgb,var(--fl) 70%,#000) 100%);box-shadow:inset 0 -1.2cqw 0 #0002}
.bt-plat.f{right:5%;top:36%;width:40%;height:11%}
.bt-plat.m{left:0%;bottom:26.5%;width:48%;height:12%}
.bt-mon{position:absolute;z-index:2}
.bt-mon .inner{width:100%;height:100%}
.bt-mon svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 .6cqw 0 #0003)}
.bt-mon.f{right:11%;top:5%;width:28%;aspect-ratio:1}
.bt-mon.m{left:7%;bottom:28%;width:33%;aspect-ratio:1}
.bt-mon.m svg,.bt-mon.m .pxm{transform:scaleX(-1)}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.2cqw)}}
.hitflash{filter:brightness(4) saturate(0)}
.bt-trn{position:absolute;right:13%;top:3%;width:17%;z-index:3}
.bt-trn canvas{width:100%;image-rendering:pixelated;display:block}
.plate{position:absolute;z-index:4;background:var(--paper);color:var(--ink);border:.45cqw solid var(--ink);border-radius:1.4cqw;padding:.9cqw 1.8cqw 1.1cqw;width:42%;box-shadow:0 .6cqw 0 #0004}
.plate.f{left:3%;top:5%;border-top-right-radius:3.6cqw}
.plate.m{right:3%;bottom:29.5%;border-bottom-left-radius:3.6cqw}

.bt-cmd{position:relative;flex:none;width:52%;height:100%;box-sizing:border-box;padding:1.2cqw;display:flex;flex-direction:column;gap:.8cqw;background:var(--ink);border-left:.5cqw solid #111027}

.cb{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;padding:.4cqw 1.6cqw;border-radius:1.2cqw;background:var(--paper);color:var(--ink);border:.35cqw solid #111027;box-shadow:inset 0 -.6cqw 0 #0000001f;cursor:pointer;min-width:0;overflow:hidden}

.fchip{width:2.2cqw;height:3cqw;border-radius:.3cqw;border:.3cqw solid var(--ink);background:var(--fc);flex:none}
.dmg{position:absolute;z-index:9;font-family:var(--f-disp);font-size:min(5cqw,36px);color:#fff;-webkit-text-stroke:.5cqw var(--ink);paint-order:stroke;pointer-events:none;white-space:nowrap}
.dmg.super{color:#ffd84a;font-size:min(6.4cqw,46px)}

.flycard{position:absolute;left:0;top:0;z-index:5;width:7cqw;pointer-events:none}
.flycard .fc{width:100%;aspect-ratio:5/7;border-radius:.8cqw;background:var(--fc);border:.4cqw solid var(--ink);display:grid;place-items:center;box-shadow:0 .6cqw 1cqw #0006;position:relative}
.flycard .fc span{font-family:var(--f-disp);font-size:3cqw;color:#2b2440aa}
.flycard .fc::before{content:"";position:absolute;inset:.7cqw;border:1px solid #2b244066;border-radius:.3cqw}
.stamp{position:absolute;left:50%;top:50%;width:6.4cqw;height:6.4cqw;display:grid;place-items:center;font-family:var(--f-disp);font-size:4cqw;color:#fff;background:var(--shu);border:.4cqw solid #fff;border-radius:.8cqw;box-shadow:0 0 0 .3cqw var(--shu),0 .4cqw 1cqw #0006}
.sendcard{position:absolute;left:0;top:0;width:9cqw;z-index:5;pointer-events:none}

/* ---------- title / intro / ending ---------- */
#title{position:absolute;inset:0;z-index:55;background:linear-gradient(180deg,#14162e40 0%,#14162ecc 70%,#14162ef2 100%);display:flex;align-items:center;transition:opacity .45s}
#title.out{opacity:0}
.tt-in{position:relative;z-index:2;padding-left:7cqw;display:flex;flex-direction:column;gap:1.6cqh}
.eyebrow{margin:0;font-size:min(2.2cqw,14px);letter-spacing:.3em;color:var(--gold);font-weight:900}
.logo{font-family:var(--f-disp);font-weight:400;font-size:min(12cqw,110px);line-height:1;margin:0;color:var(--paper);text-shadow:0 .8cqw 0 #0b0a18,0 0 4cqw #e6b34f55;letter-spacing:.02em}
.logo em{font-style:normal;color:var(--shu2);display:inline-block;animation:logo 3s ease-in-out infinite}
.logo span{display:block;font-size:.42em;letter-spacing:.24em;margin-top:.3em}
.logo.sm{font-size:min(6.5cqw,56px)}
@keyframes logo{50%{transform:translateY(-.8cqw) rotate(-2deg)}}
.tt-menu{display:flex;flex-direction:column;align-items:flex-start;gap:1.6cqw;margin-top:2cqh}
.tt-menu .pbtn{min-width:28cqw;justify-content:flex-start;font-size:min(3cqw,20px)}
.tt-hint{margin:1cqh 0 0;font-size:min(1.9cqw,12px);color:var(--muted)}
.tt-cards{position:absolute;inset:0;pointer-events:none}
.tt-c{position:absolute;width:14cqw;animation:float 6s ease-in-out infinite}
.tt-c .card{filter:drop-shadow(0 1.4cqw 1.4cqw #0008)}
.tt-c.c0{right:28%;top:8%;transform:rotate(-12deg);animation-delay:-1s}
.tt-c.c1{right:9%;top:14%;width:17cqw;animation-delay:-3s}
.tt-c.c2{right:22%;top:50%;animation-delay:-2s}
.tt-c.c3{right:4%;top:56%;width:15cqw;animation-delay:-4s}
.tt-c.c4{right:40%;top:62%;width:11cqw;opacity:.8;animation-delay:-5s}
.tt-c.c5{right:44%;top:4%;width:10cqw;opacity:.7}
@keyframes float{0%,100%{translate:0 0;rotate:-6deg}50%{translate:0 -2cqh;rotate:4deg}}
#intro{position:absolute;inset:0;z-index:56;background:#0b0a18;display:grid;place-items:center;text-align:center;cursor:pointer}
#intro p{font-family:var(--f-dot);font-size:min(3.8cqw,26px);line-height:1.9;color:var(--paper);margin:0;padding:0 6cqw}
#ending{position:absolute;inset:0;z-index:57;background:radial-gradient(120% 90% at 50% 0%,#2b2f6e,#0b0a18 75%);overflow-y:auto}
.end-in{display:flex;flex-direction:column;align-items:center;gap:1.3cqh;padding:3cqh 5cqw;text-align:center}
.end-lead{margin:0;font-size:min(2.7cqw,17px);color:#dcdcf5}
.end-cards{display:flex;gap:2cqw;justify-content:center}
.end-cards .card{width:11cqw}
.end-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw;width:min(100%,80cqw)}
.end-stats div{background:#ffffff0d;border:1px solid var(--line);border-radius:1.2cqw;padding:1cqw}
.end-stats small{display:block;font-size:min(1.9cqw,12px);color:var(--muted);font-weight:700}
.end-stats b{font-family:var(--f-dot);font-size:min(3.2cqw,21px);font-weight:400}
.end-next{display:flex;flex-direction:column;gap:.4cqw;font-size:min(2.3cqw,14px);color:var(--muted);background:#e6b34f14;border:1px solid #e6b34f55;border-radius:1.4cqw;padding:1.4cqw 3cqw}
.end-next b{color:var(--gold)}
.end-act{display:flex;gap:2cqw}
.credit{margin:0;font-size:min(1.8cqw,11px);color:#7c7fa8}
#skyevent{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
#skyevent .aurora{position:absolute;inset:0;background:linear-gradient(170deg,#7af0d055 0%,#b58cff44 30%,transparent 60%);mix-blend-mode:screen;animation:aur 4.2s ease-in-out forwards}
@keyframes aur{0%,100%{opacity:0}40%,60%{opacity:1}}
#skyevent .whale .pxm{transform:scaleX(-1)}
#skyevent .whale{position:absolute;left:-10%;top:0;width:30cqw;opacity:0;filter:drop-shadow(0 0 2cqw #bfefff) brightness(1.25)}

/* ---------- touch pad ---------- */
#pad{display:none;height:var(--padh);grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:0 4px;touch-action:none;box-sizing:border-box}
@media (pointer:coarse),(max-width:700px){#pad{display:grid}}
.dpad{position:relative;width:138px;height:138px}
.dpad button{position:absolute;width:48px;height:48px;border-radius:12px;background:#2c3162;border:2px solid #0a0a16;box-shadow:0 4px 0 #0a0a16;touch-action:none}
.dpad button::after{content:"";position:absolute;left:50%;top:50%;border:9px solid transparent;transform:translate(-50%,-50%)}
.dpad [data-dir=up]{left:45px;top:0}.dpad [data-dir=up]::after{border-bottom-color:#a7a9d2;margin-top:-5px}
.dpad [data-dir=down]{left:45px;bottom:0}.dpad [data-dir=down]::after{border-top-color:#a7a9d2;margin-top:5px}
.dpad [data-dir=left]{left:0;top:45px}.dpad [data-dir=left]::after{border-right-color:#a7a9d2;margin-left:-5px}
.dpad [data-dir=right]{right:0;top:45px}.dpad [data-dir=right]::after{border-left-color:#a7a9d2;margin-left:5px}
.dpad button.on,.abtn.on{transform:translateY(3px);box-shadow:0 1px 0 #0a0a16}
.abgroup{justify-self:end;position:relative;width:132px;height:124px}
.abtn{position:absolute;width:62px;height:62px;border-radius:50%;border:2px solid #0a0a16;box-shadow:0 4px 0 #0a0a16;font-family:var(--f-disp);font-size:20px;color:#fff;touch-action:none}
#btnA{right:0;top:8px;background:var(--shu)}
#btnB{left:6px;bottom:4px;background:#5a5f9e}
#btnM{align-self:center;justify-self:center;white-space:nowrap;background:#2c3162;border:2px solid #0a0a16;border-radius:99px;padding:6px 14px;font-weight:900;font-size:13px;color:var(--muted);box-shadow:0 3px 0 #0a0a16}
.help{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-size:12px;color:#7c7fa8;font-weight:700}
.help b{color:var(--muted);font-family:var(--f-dot);font-weight:400;background:#ffffff10;border-radius:4px;padding:0 6px;margin-right:4px}
@media (pointer:coarse),(max-width:700px){.help{display:none}}
@container (max-width:560px){.tt-hint{display:none}.tt-c.c4,.tt-c.c5{display:none}
  .bt-bottom{height:31%}.bt-mon.m{width:28%}.cb-back{right:auto;left:1.2cqw}.end-cards{display:none}.end-in{gap:.8cqh;padding:2cqh 4cqw}.bt-plat.m{bottom:31.5%}.bt-mon.m{bottom:33%}.plate.m{bottom:34%}.bt-cmd .cb-grid{gap:.7cqw}.bt-cmd{padding:.9cqw}.cb{padding:.1cqw 1.3cqw}.bt-msg{margin:.9cqw}}
@media (prefers-reduced-motion:reduce){.bob,.c-foil,.tt-c,.logo em,.bt-sky .cl{animation:none!important}}

/* ===== card ===== */
.card{container-type:inline-size;position:relative;width:100%;aspect-ratio:5/7;border-radius:7%/5%}
.card .ci{position:absolute;inset:0;display:flex;flex-direction:column;gap:2.4cqw;padding:5cqw;background:var(--paper);color:var(--ink);border:1.6cqw solid var(--frame,var(--ink));border-radius:6cqw;box-shadow:0 1.5cqw 0 #00000040,0 4cqw 10cqw #00000040;overflow:hidden}
.card.r2{--frame:#9aa6be}
.card.r3{--frame:#c79a38}
.card.r4{--frame:#e86fb4}
.c-head{display:flex;justify-content:space-between;align-items:center}
.c-no{font-family:var(--f-dot);font-size:7.5cqw;letter-spacing:.05em}
.c-type{width:12cqw;height:12cqw;display:grid;place-items:center;border-radius:50%;background:var(--tc);color:#fff;font-weight:900;font-size:7.5cqw;border:.8cqw solid var(--ink)}
.c-art{position:relative;flex:1;min-height:0;border-radius:2.4cqw;border:.9cqw solid var(--ink);background:radial-gradient(90% 70% at 50% 58%,color-mix(in srgb,var(--tc) 55%,#fff) 0%,var(--tc) 38%,color-mix(in srgb,var(--tc) 45%,#0b0918) 78%,#0b0918 100%);overflow:hidden;box-shadow:inset 0 0 0 .5cqw #0006}
.c-art::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 62%,#ffffff12 0 4deg,transparent 4deg 14deg),radial-gradient(60% 18% at 50% 92%,#0008,transparent 70%)}
.c-art svg,.c-art .pxm{filter:drop-shadow(0 .8cqw 1cqw #0007)}
.c-art svg,.c-art .pxm{position:absolute;inset:0;width:100%;height:100%}
.pxm{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
.c-art .pxm{inset:auto;left:-12%;bottom:-2%;width:124%;height:124%}
.c-name{font-family:var(--f-disp);font-size:10cqw;line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{display:flex;justify-content:space-between;align-items:center;font-size:7.5cqw;font-weight:900;border-top:.6cqw dashed #2b244055;padding-top:1.6cqw}
.c-stars{letter-spacing:-.05em;color:#8b8499}
.r2 .c-stars{color:#6d7fa6}.r3 .c-stars{color:#c28a1e}.r4 .c-stars{color:#e0509f}
.c-seal{position:absolute;right:3cqw;bottom:3cqw;width:17cqw;height:17cqw;display:grid;place-items:center;font-family:var(--f-disp);font-size:10.5cqw;color:var(--shu);border:1cqw solid var(--shu);border-radius:2cqw;background:#fff9;transform:rotate(-10deg);line-height:1}
.c-badge{position:absolute;top:-3cqw;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:3;font-size:7cqw;font-weight:900;padding:.6cqw 3cqw;border-radius:99px;background:linear-gradient(90deg,#ff7ad9,#7ae0ff,#b9ff7a);color:var(--ink);border:.7cqw solid var(--ink)}
.v-gold .c-badge{background:linear-gradient(90deg,#fff1b0,#e6b34f);}
.c-foil{position:absolute;inset:0;border-radius:6cqw;pointer-events:none;opacity:0;z-index:2}
.v-holo .c-foil{opacity:.38;mix-blend-mode:color-dodge;background:linear-gradient(115deg,transparent 18%,#ff6fd8 30%,#6fe3ff 42%,#b6ff6f 54%,#ffe66f 66%,transparent 80%);background-size:260% 260%;background-position:var(--mx,0%) var(--my,50%);animation:foil 5s linear infinite}
.v-gold .ci{background:linear-gradient(160deg,#fff6d2,#f0cf72 48%,#fff1bd 70%,#e7bd57);--frame:#b07e1c}
.v-gold .c-foil{opacity:.7;mix-blend-mode:overlay;background:linear-gradient(120deg,transparent 30%,#fff 45%,transparent 60%);background-size:300% 300%;background-position:var(--mx,0%) var(--my,50%);animation:foil 3.2s linear infinite}
.r4 .c-foil{opacity:.45;mix-blend-mode:color-dodge;background:conic-gradient(from 0deg at 50% 50%,#ff7ad9,#7ae0ff,#b9ff7a,#ffe66f,#ff7ad9);animation:none}
.tilted .c-foil{animation:none}
@keyframes foil{0%{background-position:0% 50%}100%{background-position:260% 50%}}
.sil svg,.sil .pxm{filter:brightness(0) opacity(.55)}
.card.slot .ci{background:#2a2e5a;color:var(--muted);border-color:#3b4178;box-shadow:none}
.card.slot .c-art{background:#20244a;border-color:#3b4178}
.card.slot .c-art::before{display:none}
.card.slot.seen .c-art{background:radial-gradient(circle,#3a3f78,#20244a)}
.c-art.q{display:grid;place-items:center;font-family:var(--f-disp);font-size:22cqw;color:#3b4178}
.card.slot .c-meta{border-color:#3b4178}
/* back */
.card.back .ci{background:
  repeating-linear-gradient(45deg,#ffffff0a 0 4cqw,transparent 4cqw 8cqw),
  radial-gradient(circle at 50% 45%,#3a3f82,#1d2048);border-color:var(--gold);align-items:center;justify-content:center;gap:6cqw}
.bk-ring{width:48cqw;height:48cqw;border-radius:50%;border:1.4cqw double var(--gold);display:grid;place-items:center;box-shadow:0 0 0 3cqw #e6b34f22}

.bk-txt{font-family:var(--f-dot);color:var(--gold);font-size:6.5cqw;letter-spacing:.25em}
