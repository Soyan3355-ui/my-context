<!doctype html><html><head><meta charset="utf-8"><title>compare</title><style>
body{margin:0;padding:8px;background:#1b1b1b;color:#ddd;font:12px sans-serif}
.row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;background:#8fd3f0;padding:6px}
canvas{image-rendering:pixelated;display:block}.lbl{width:70px;color:#123;font-weight:bold}
</style></head><body>
<script src="../../js/pixel.js"></script> <script src="../../js/pixkit.js"></script> <script src="../../js/pixmon_1.js"></script> <script src="../../js/pixmon_2.js"></script> <script src="../../js/pixmon_3.js"></script> <script src="../../js/pixmon_4.js"></script> <script src="../../js/pixmon_5.js"></script> <script src="../../js/pixmon_6.js"></script> <script src="../../js/pixmon_7.js"></script> 
<script>
// 自作スプライトと参考画像の切り抜きを「同じ整数倍率」で並べる品質確認ページ
// 参考画像は devkit/refs/ に置く（著作物のためリポジトリには含めない）
// REF: { モンスターID: [[ファイル名, x, y, 幅, 高さ], ...] }  座標は参考画像の元ピクセル
const REF={1:[['3.png',106,104,30,30],['2.png',48,163,36,36],['4.png',31,184,32,30]],
4:[['2.png',48,2,34,36],['2.png',6,42,36,36],['2.png',168,42,36,36]],
8:[['3.png',33,102,36,36],['3.png',138,35,32,36],['2.png',6,162,36,36]],
12:[['4.png',96,145,38,38],['4.png',62,145,38,38],['3.png',138,68,32,36]],
17:[['3.png',104,36,30,32],['3.png',142,141,22,28],['3.png',104,70,30,32]],
22:[['4.png',66,184,30,30],['4.png',68,48,28,28],['4.png',31,184,32,30]]};
const q=new URLSearchParams(location.search),S=+(q.get('s')||2),only=q.get('id');
const cache={};function load(f){return cache[f]||(cache[f]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src='../refs/'+f;}))}
function cv(w,h,s,draw){const c=document.createElement('canvas');c.width=w*s;c.height=h*s;const x=c.getContext('2d');x.imageSmoothingEnabled=false;draw(x,s);return c;}
(async()=>{for(const id of PIXKIT.ids()){if(only&&!only.split(',').includes(String(id)))continue;if(!only&&!REF[id])continue;const row=document.createElement('div');row.className='row';
const l=document.createElement('div');l.className='lbl';l.textContent='#'+id+' @'+S+'x';row.appendChild(l);
const Z=PIXKIT.W;row.appendChild(cv(Z,Z,S,(x,s)=>x.drawImage(PIXKIT.canvas(id),0,0,Z*s,Z*s)));
for(const [f,a,b,w,h] of (REF[id]||[])){const im=await load(f);if(im)row.appendChild(cv(w,h,S,(x,s)=>x.drawImage(im,a,b,w,h,0,0,w*s,h*s)));}
document.body.appendChild(row);}document.title='done';})();
</script></body></html>
