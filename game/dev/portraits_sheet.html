<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Portrait Sheet</title>
<style>
  body { margin: 0; font: 12px/1.3 monospace; background: #1a1a1a; color: #eee; width: max-content; }
  .panel { padding: 16px; }
  .grey { background: #808080; color: #111; }
  .navy { background: #141c3a; color: #dfe6ff; }
  h2 { margin: 0 0 8px; font-size: 14px; }
  table { border-collapse: collapse; }
  th { font-weight: normal; padding: 2px 6px; text-align: center; }
  td { padding: 4px 6px; text-align: center; vertical-align: middle; }
  td.name { text-align: right; padding-right: 10px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
</style>
<script src="../js/portraits.js"></script>
</head>
<body>
<div class="panel grey"><h2>Portraits on mid-grey</h2><div id="grey"></div></div>
<div class="panel navy"><h2>Portraits on dark navy</h2><div id="navy"></div></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var scale = parseInt(q.get('scale') || '4', 10);
  var ids = q.get('ids') ? q.get('ids').split(',') : Portraits.ids;
  var bg = q.get('bg') || 'both';
  var exprs = q.get('exprs') ? q.get('exprs').split(',') : ['normal', 'happy', 'surprised', 'determined', 'sad'];
  function sheet(host) {
    var t = document.createElement('table');
    var hr = document.createElement('tr');
    hr.appendChild(document.createElement('th'));
    exprs.forEach(function (e) { var th = document.createElement('th'); th.textContent = e; hr.appendChild(th); });
    t.appendChild(hr);
    ids.forEach(function (id) {
      var tr = document.createElement('tr');
      var nm = document.createElement('td'); nm.className = 'name'; nm.textContent = id; tr.appendChild(nm);
      exprs.forEach(function (e) {
        var td = document.createElement('td');
        var src = Portraits.get(id, e);
        var c = document.createElement('canvas');
        c.width = Portraits.SIZE * scale; c.height = Portraits.SIZE * scale;
        var g = c.getContext('2d');
        g.imageSmoothingEnabled = false;
        g.drawImage(src, 0, 0, c.width, c.height);
        td.appendChild(c); tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    host.appendChild(t);
  }
  if (bg === 'both' || bg === 'grey') sheet(document.getElementById('grey')); else document.getElementById('grey').parentNode.style.display = 'none';
  if (bg === 'both' || bg === 'navy') sheet(document.getElementById('navy')); else document.getElementById('navy').parentNode.style.display = 'none';
})();
</script>
</body>
</html>
