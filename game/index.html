<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ハマカゼFC</title>
<meta name="description" content="港町の弱小サッカークラブを率いる、監督シミュレーション体験版。">
<style>
  @font-face { font-family: "DotGothic16"; src: url("fonts/DotGothic16-Regular.ttf") format("truetype"); font-display: block; }
  :root { --bg: #0a0e1c; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #9fdcff; font: 16px "DotGothic16", monospace; letter-spacing: 2px; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0a0e1c; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #fff6e0; font: 12px "DotGothic16", monospace; letter-spacing: 1px; text-align: center; padding: 20px; box-sizing: border-box; }
  #rotate svg { width: 64px; height: 64px; animation: rotphone 1.6s ease-in-out infinite; }
  @keyframes rotphone { 0%, 15% { transform: rotate(0deg); } 45%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="boot">LOADING…</div>
<div id="rotate">
  <svg viewBox="0 0 24 24" fill="none" stroke="#9fdcff" stroke-width="1.6"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="10" y1="19" x2="14" y2="19"/></svg>
  <div>画面を横向きにしてください<br><span style="color:#c9d6e6;font-size:10px;">この体験版は横向きプレイ用です</span></div>
</div>
<canvas id="game" tabindex="0"></canvas>
<script src="js/audio.js"></script>
<script src="js/portraits.js"></script>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/data.js"></script>
<script src="js/league.js"></script>
<script src="js/match.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
